              'app/src/test/java/com/cryptoalertengine/simulation/SimulationEngineTest.kt',
          }
          missing = required.difference(names)
          if missing:
              raise SystemExit(f"Embedded app files missing: {sorted(missing)}")
          workspace = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          # Remove the old checked-out project before extracting the payload. This
          # prevents deleted/renamed legacy tests or source files surviving from an
          # earlier repository version and being silently compiled by Gradle.
          for rel in ('.gitignore', 'LICENSE', 'README.md', 'app', 'build', '.gradle',
                      'gradle', 'build.gradle.kts', 'gradle.properties', 'settings.gradle.kts'):
              target = workspace / rel
              if target.is_dir():
                  import shutil
                  shutil.rmtree(target)
              elif target.exists():
                  target.unlink()
          zf.extractall(workspace)
          build_gradle = pathlib.Path('app/build.gradle.kts').read_text()
          if 'applicationId = "com.crossoveredge.trader"' not in build_gradle:
              raise SystemExit('Unexpected application ID')
          display_test_path = pathlib.Path('app/src/test/java/com/cryptoalertengine/trading/TradingDisplayTest.kt')
          display_test = display_test_path.read_text()
          required_markers = (
              'fun pendingCrossoverShowsPriceAndRetryLifecycle()',
              'fun activeAndExitingCrossoverLegs()',
              'fun orderTitlesIdentifyCrossoverLimitEntryAndExit()',
          )
          for marker in required_markers:
              if marker not in display_test:
                  raise SystemExit(f'Stale or incomplete Crossover Edge tests: missing {marker}')
          stale_markers = (
              'fun pendingLegShowsPriceAndCancelCountdown()',
              'fun activeAndExitingLegs()',
          )
          for marker in stale_markers:
              if marker in display_test:
                  raise SystemExit(f'Old CryptoAlertEngine UI test still present: {marker}')
          test_files = list(pathlib.Path('app/src/test/java').rglob('*Test.kt'))
          test_count = sum(f.read_text().count('@Test') for f in test_files)
          if test_count != 94:
