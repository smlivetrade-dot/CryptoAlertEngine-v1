name: Build Crypto Alert Engine V3.9.5

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore V3.9.5 project
        shell: bash
        run: |
          cat > /tmp/cryptoalertengine.b64 <<'EOF'
          
          EOF
          base64 -d /tmp/cryptoalertengine.b64 > /tmp/CryptoAlertEngine-V3.9.5.zip
          unzip -q -o /tmp/CryptoAlertEngine-V3.9.5.zip -d /tmp/cryptoalertengine-src
          cp -a /tmp/cryptoalertengine-src/. .

      - name: Validate notification design
        shell: bash
        run: |
          test -f app/src/main/java/com/cryptoalertengine/data/Models.kt
          test -f app/src/main/java/com/cryptoalertengine/service/MonitoringService.kt
          grep -q 'MULTI ST' app/src/main/java/com/cryptoalertengine/data/Models.kt
          grep -q 'MULTI EMA' app/src/main/java/com/cryptoalertengine/data/Models.kt
          grep -q 'MtEma' app/src/main/java/com/cryptoalertengine/data/Models.kt
          ! grep -q 'append("O ' app/src/main/java/com/cryptoalertengine/data/Models.kt
          ! grep -q 'append("CONDITION:' app/src/main/java/com/cryptoalertengine/data/Models.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build and test
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CryptoAlertEngine-V3.9.5-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: CryptoAlertEngine-V3.9.5-source
          path: .
          retention-days: 14
