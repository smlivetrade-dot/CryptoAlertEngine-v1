# LiveMarketWallpaper application configuration
# This file configures the app. It is NOT a GitHub Actions workflow.

app:
  name: "LiveMarketWallpaper"
  version: "1.0.0"
  package_id: "com.example.livemarketwallpaper"

data:
  provider: "delta_exchange"
  environment: "production"
  historical_candles: true
  live_updates: true
  rest_api: "public"
  websocket: "public"
  reconnect:
    enabled: true
    initial_delay_seconds: 2
    maximum_delay_seconds: 30
  candle_history:
    load_on_start: true
    retain_in_memory: true

market:
  default_symbol: "ETHUSD"
  allow_symbol_selection: true
  suggested_symbols:
    - "ETHUSD"
    - "BTCUSD"

chart:
  default_type: "candlestick"
  available_types:
    - "candlestick"
    - "line"

  default_candle_timeframe: "5m"
  available_candle_timeframes:
    - "1m"
    - "3m"
    - "5m"
    - "15m"
    - "30m"
    - "1h"
    - "2h"
    - "4h"
    - "1d"

  # Independent of candle timeframe: the total visible rolling window.
  default_display_duration: "2h"
  available_display_durations:
    - "15m"
    - "30m"
    - "1h"
    - "2h"
    - "4h"
    - "8h"
    - "12h"
    - "24h"

  behaviour:
    fixed_rolling_window: true
    auto_follow_latest_price: true
    keep_latest_price_at_right: true
    show_forming_candle: true
    update_forming_candle_with_live_data: true
    remove_data_older_than_display_window: true
    user_pan_and_zoom_in_app: true
    scrolling_ticker: false

  appearance:
    theme: "dark"
    background: "#101318"
    bullish_candle: "#16A34A"
    bearish_candle: "#DC2626"
    show_wicks: true
    show_grid: true
    show_price_scale: true
    show_time_scale: true
    show_current_price_line: true

lock_screen:
  enabled: true
  chart_display: true
  use_selected_symbol: true
  use_selected_chart_type: true
  use_selected_timeframe: true
  use_selected_display_duration: true
  update_when_data_arrives: true

performance:
  max_history_buffer_multiplier: 2
  pause_nonessential_work_when_screen_off: true
  prefer_websocket_over_frequent_rest_polling: true
  persist_last_selection: true

defaults:
  symbol: "ETHUSD"
  chart_type: "candlestick"
  candle_timeframe: "5m"
  display_duration: "2h"
