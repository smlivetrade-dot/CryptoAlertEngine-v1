          base64 -d /tmp/crossover-edge-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android | grep -q androiddebugkey

      - name: Build debug APK
        shell: bash
        timeout-minutes: 30
        run: |
          set -euo pipefail
          java -version
          gradle --version
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Run unit tests (reported; a failing test does not block the APK)
        id: unit_tests
        continue-on-error: true
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Flag failing unit tests
        if: ${{ steps.unit_tests.outcome == 'failure' }}
        shell: bash
        run: echo "::warning title=Unit tests failed::The APK was built, but at least one unit test failed. Open the 'Run unit tests' step and the uploaded reports."

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: CrossoverEdge-build-reports
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: warn

      - name: Upload Crossover Edge debug APK
        uses: actions/upload-artifact@v7
        with:
          name: CrossoverEdge-1.0.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
