name: Build Android APK

# Paste as: .github/workflows/build-apk.yml  (replace the old file)
# Self-contained: the whole Android project is generated inside this workflow.
# Data: Delta Exchange India PUBLIC API (no key).
# App: live pattern matching - symbol, timeframe, pattern length, prediction length,
#      multi-year history cached on phone, live updates, background notification.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      symbol:
        description: "Delta Exchange symbol"
        required: false
        default: "ETHUSD"
      api_base:
        description: "Delta public API base URL"
        required: false
        default: "https://api.india.delta.exchange"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      SYMBOL: ${{ inputs.symbol || 'ETHUSD' }}
      API_BASE: ${{ inputs.api_base || 'https://api.india.delta.exchange' }}

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Runner already ships the Android SDK; no setup-android action needed.
      - name: Prepare Android SDK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK at: $SDK"
          SDKM=$(find "$SDK/cmdline-tools" -path '*bin/sdkmanager' | head -1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDKM" --sdk_root="$SDK" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Android project
        run: |
          set -e
          mkdir -p android
          mkdir -p android/app
          mkdir -p android/app/src/main
          mkdir -p android/app/src/main/java/com/ethusd/patternlab
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/values

          cat > android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.ethusd.patternlab'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.ethusd.patternlab'
                  minSdk 24
                  targetSdk 34
                  versionCode 6
                  versionName '0.6.0'

                  buildConfigField "String", "SYMBOL",
                      "\"${project.findProperty('symbol') ?: 'ETHUSD'}\""
                  buildConfigField "String", "API_BASE",
                      "\"${project.findProperty('apiBase') ?: 'https://api.india.delta.exchange'}\""
              }

              buildFeatures {
                  buildConfig true
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

          cat > android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "EthusdPatternLab"
          include ':app'
          EOF

