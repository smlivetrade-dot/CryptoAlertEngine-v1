        run: |
          printf '%s' "$PROJECT_ZIP_B64" | base64 --decode > project.zip
          unzip -q project.zip -d project
          cp -a project/. .
          rm -rf project project.zip

      - name: Verify workflow project
        shell: bash
        run: |
          test -f app/src/main/java/com/cryptoalertengine/MainActivity.kt
          ! grep -q '^import kotlinx\.coroutines\.flow\.collectAsState$' app/src/main/java/com/cryptoalertengine/MainActivity.kt

      - name: Build and test
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CryptoAlertEngine-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: CryptoAlertEngine-source
          path: .
          retention-days: 14
