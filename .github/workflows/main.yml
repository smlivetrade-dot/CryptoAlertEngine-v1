                  val cap = if (snap.capped) " (capped for this timeframe)" else ""
                  tvCoverage.text = "History used: " + df.format(Date(snap.first * 1000)) + " to " +
                      df.format(Date(snap.lastBar * 1000)) + ", " + String.format(Locale.US, "%,d", snap.bars) +
                      " bars of " + res + cap + ". Stored on phone; only new bars are downloaded."

                  val patt = "Pattern: last " + w + " bars = " + Cfg.human(w * sec) + " of " + res
                  val ahead = "next " + h + " bars (" + Cfg.human(h * sec) + ")"
                  val minTxt = String.format(Locale.US, "%d%%", Math.round(mc * 100.0).toInt())

                  rows.removeAllViews()

                  if (r.count == 0) {
                      tvSummary.text = patt + "\nNo similar patterns found at all, even below " + minTxt +
                          ". Try a shorter pattern, more history days, or a different timeframe."
                      tvProjTitle.text = "Latest pattern"
                      priceChart.setSeries(
                          listOf(Series(snap.cur.toList(), Color.parseColor("#90CAF9"), 5f)),
                          snap.cur.size, -1, true
                      )
                      matchChart.setSeries(emptyList(), 0, -1, false)
                      histView.setData(IntArray(0), 0.0, 0.0)
                      tvHistTitle.text = ""
                      return
                  }

                  val flat = 100.0 - r.upPct - r.downPct
                  val sb = StringBuilder()
                  sb.append(patt).append("\n")
                  if (r.fallback) {
                      sb.append("No match reached ").append(minTxt).append(". Showing the ").append(r.count)
                          .append(" closest matches instead (best ")
                          .append(Math.round(r.bestCorr * 100.0)).append("%, weakest ")
                          .append(Math.round(r.worstCorr * 100.0)).append("%).\n")
                  } else {
                      sb.append("Matches >= ").append(minTxt).append(": ")
                          .append(String.format(Locale.US, "%,d", r.count)).append(" (non-overlapping)\n")
                  }
                  if (snap.relaxed) sb.append("Volatility filter was relaxed to find matches.\n")
                  sb.append(String.format(Locale.US, "After them, %s: Up %.1f%% Down %.1f%% Flat %.1f%%\n", ahead, r.upPct, r.downPct, flat))
                  sb.append(String.format(Locale.US, "Average %+.2f%% Median %+.2f%%\n", r.avg, r.median))
                  sb.append(String.format(Locale.US, "Best %+.2f%% Worst %+.2f%%\n", r.best, r.worst))
                  sb.append(String.format(Locale.US, "Avg peak %+.2f%% Avg dip %+.2f%% (inside the window)\n", r.avgPeak, r.avgDip))
                  sb.append("From live price $").append(fmt(p0)).append(": average $")
                      .append(fmt(p0 * (1.0 + r.avg / 100.0)))
                      .append(", middle half of cases $").append(fmt(p0 * (1.0 + r.p25 / 100.0)))
                      .append(" to $").append(fmt(p0 * (1.0 + r.p75 / 100.0)))
                  tvSummary.text = sb.toString()

                  val ser = ArrayList<Series>()
                  r.top.forEachIndexed { i, m ->
                      val rebased = m.pctPath.map { p0 * (1.0 + it / 100.0) }
                      ser.add(Series(rebased, Color.parseColor(palette[i % palette.size]), 2.5f, 0))
                  }
                  ser.add(Series(snap.cur.toList(), Color.parseColor("#90CAF9"), 5f, 0))
                  if (r.avgPath.size > 1) {
                      val avgProj = r.avgPath.map { p0 * (1.0 + it / 100.0) }
                      ser.add(Series(avgProj, Color.WHITE, 6f, w - 1))
                  }
                  tvProjTitle.text = "Latest pattern vs matches, and projection (" + ahead + ")"
                  priceChart.setSeries(ser, w + h, w - 1, true)

                  val shape = ArrayList<Series>()
                  r.top.forEachIndexed { i, m ->
                      shape.add(Series(m.path, Color.parseColor(palette[i % palette.size]), 3f))
                  }
                  shape.add(Series(r.current, Color.WHITE, 6f))
                  matchChart.setSeries(shape, w + h, w - 1, false)

                  tvHistTitle.text = "Distribution of " + ahead + " moves (" +
                      String.format(Locale.US, "%,d", r.count) + " cases)"
                  histView.setData(r.bins, r.binLo, r.binHi)

                  val dfm = SimpleDateFormat("dd MMM yyyy HH:mm", Locale.US)
                  r.top.forEachIndexed { i, m ->
                      val tv = label(13f, palette[i % palette.size])
                      tv.setPadding(0, dp(4), 0, dp(4))
                      tv.text = String.format(
                          Locale.US,
                          "#%d %d%% match %s next %d bars %+.2f%% (\$%s)",
                          i + 1,
                          Math.round(m.corr * 100.0).toInt(),
                          dfm.format(Date(m.timeSec * 1000)),
                          h,
                          m.fwdPct,
                          fmt(p0 * (1.0 + m.fwdPct / 100.0))
                      )
                      rows.addView(tv)
                  }
              }
          }
          EOF

          cat > android/app/src/main/java/com/ethusd/patternlab/MonitorService.kt <<'EOF'
          package com.ethusd.patternlab

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.Build
          import android.os.IBinder
          import android.os.PowerManager
          import java.util.Locale

          class MonitorService : Service() {

              private val chLive = "live"
              private val chAlert = "alerts"
              private var lastNotifyMs = 0L
              private var lastDir = 99
              private var lastSnap: Snapshot? = null
              private var wl: PowerManager.WakeLock? = null
              private val listener: () -> Unit = { onUpdate() }

              companion object {
                  fun start(ctx: Context) {
                      val i = Intent(ctx, MonitorService::class.java)
                      if (Build.VERSION.SDK_INT >= 26) ctx.startForegroundService(i) else ctx.startService(i)
                  }

                  fun stop(ctx: Context) {
                      ctx.stopService(Intent(ctx, MonitorService::class.java))
                  }
              }

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  makeChannels()
                  val n = build("Pattern monitor starting...", "Loading history", chLive)
                  if (Build.VERSION.SDK_INT >= 34) {
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE)
                  } else {
                      startForeground(1, n)
                  }
                  try {
                      val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                      wl = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "patternlab:monitor")
                      wl?.acquire()
                  } catch (e: Exception) {
                  }
                  LiveEngine.addListener(listener)
                  LiveEngine.start(applicationContext, Prefs.load(this))
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int = START_STICKY

              override fun onDestroy() {
                  LiveEngine.removeListener(listener)
                  if (!LiveEngine.uiVisible) LiveEngine.stop()
                  try {
                      wl?.release()
                  } catch (e: Exception) {
                  }
                  super.onDestroy()
              }

              private fun makeChannels() {
                  if (Build.VERSION.SDK_INT >= 26) {
                      val nm = getSystemService(NotificationManager::class.java)
                      nm.createNotificationChannel(
                          NotificationChannel(chLive, "Live pattern monitor", NotificationManager.IMPORTANCE_LOW)
                      )
                      nm.createNotificationChannel(
                          NotificationChannel(chAlert, "Pattern alerts", NotificationManager.IMPORTANCE_HIGH)
                      )
                  }
              }

              @Suppress("DEPRECATION")
              private fun builder(ch: String): Notification.Builder =
                  if (Build.VERSION.SDK_INT >= 26) Notification.Builder(this, ch) else Notification.Builder(this)

              private fun build(title: String, text: String, ch: String): Notification {
                  val open = PendingIntent.getActivity(
                      this, 0, Intent(this, MainActivity::class.java),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  val b = builder(ch)
                      .setSmallIcon(R.drawable.ic_stat)
                      .setContentTitle(title)
                      .setContentText(text.substringBefore("\n"))
                      .setStyle(Notification.BigTextStyle().bigText(text))
                      .setContentIntent(open)
                      .setOnlyAlertOnce(true)
                  if (ch == chLive) b.setOngoing(true) else b.setAutoCancel(true)
                  return b.build()
              }

              private fun fmt(d: Double): String = String.format(Locale.US, "%,.2f", d)

              private fun onUpdate() {
                  val now = System.currentTimeMillis()
                  val snap = LiveEngine.snapshot
                  val tk = LiveEngine.ticker
                  val fresh = snap !== lastSnap
                  if (!fresh && now - lastNotifyMs < 3000L) return
                  lastNotifyMs = now
                  lastSnap = snap

                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  val priceTxt = if (tk != null && !tk.last.isNaN()) "$" + fmt(tk.last) else ""

                  if (snap == null) {
                      nm.notify(1, build("Pattern monitor " + priceTxt, LiveEngine.status, chLive))
                      return
                  }

                  val s = snap.settings
                  val r = snap.result
                  val tf = Cfg.tfNames[s.tfIdx]
                  val tfSec = Cfg.tfSecs[s.tfIdx]
                  val sb = StringBuilder()
                  sb.append("Timeframe ").append(tf)
                      .append(" 路 Pattern ").append(s.win).append(" bars (").append(Cfg.human(s.win * tfSec)).append(")")
                      .append(" 路 Predict next ").append(s.hor).append(" bars (").append(Cfg.human(s.hor * tfSec)).append(")\n")
                  if (r.count == 0) {
                      sb.append("No similar cases found yet")
                  } else {
                      sb.append("Cases ").append(r.count)
                          .append(" 路 Positive ").append(String.format(Locale.US, "%.1f%%", r.upPct))
                          .append(" 路 Negative ").append(String.format(Locale.US, "%.1f%%", r.downPct)).append("\n")
                      sb.append(String.format(Locale.US, "Average %+.2f%% 路 Median %+.2f%%", r.avg, r.median))
                      if (r.fallback) {
                          sb.append("\nNo case reached ").append(Math.round(Cfg.corrValues[s.corrIdx] * 100.0))
                              .append("%, showing closest ones")
                      }
                  }
                  nm.notify(1, build(s.symbol + " " + priceTxt + " 路 live", sb.toString(), chLive))

                  if (fresh) {
                      val dir = if (r.fallback || r.count < 5) 0
                      else if (r.upPct >= 60.0) 1
                      else if (r.downPct >= 60.0) -1
                      else 0
                      if (s.notifyBias && lastDir != 99 && dir != lastDir && dir != 0) {
                          val word = if (dir > 0) "Positive" else "Negative"
                          val pct = if (dir > 0) r.upPct else r.downPct
                          val msg = String.format(
                              Locale.US,
                              "%.0f%% of %d similar cases moved %s in the next %s (%s timeframe, %d-bar pattern)",
                              pct, r.count, if (dir > 0) "up" else "down", Cfg.human(s.hor * tfSec), tf, s.win
                          )
                          nm.notify(2, build(s.symbol + " bias: " + word, msg, chAlert))
                      }
                      lastDir = dir
                  }
              }
          }

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  if (intent.action == Intent.ACTION_BOOT_COMPLETED) {
                      try {
                          if (Prefs.load(context).monitor) MonitorService.start(context)
                      } catch (e: Exception) {
                      }
                  }
              }
          }
