          cat > 'app/src/main/kotlin/com/lmw/marketwallpaper/wallpaper/MarketWallpaperService.kt' <<'LMW_EOF'
          package com.lmw.marketwallpaper.wallpaper

          import android.graphics.Canvas
          import android.os.Handler
          import android.os.Looper
          import android.service.wallpaper.WallpaperService
          import android.view.SurfaceHolder
          import com.lmw.marketwallpaper.chart.ChartMath
          import com.lmw.marketwallpaper.chart.ChartRenderer
          import com.lmw.marketwallpaper.chart.ChartStyle
          import com.lmw.marketwallpaper.config.ConfigStore
          import com.lmw.marketwallpaper.data.MarketEngine
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.SupervisorJob
          import kotlinx.coroutines.cancel
          import kotlinx.coroutines.launch

          /**
           * Live wallpaper. The data engine (REST + WebSocket) only runs while the wallpaper is visible
           * (home screen or lock screen showing); when the screen turns off or an app covers it the socket
           * is closed and drawing stops, so no foreground service or battery-optimisation exemption is needed.
           */
          class MarketWallpaperService : WallpaperService() {
              override fun onCreateEngine(): Engine = ChartEngine()

              inner class ChartEngine : Engine() {
                  private val handler = Handler(Looper.getMainLooper())
                  private val renderer = ChartRenderer(resources.displayMetrics.density)
                  private var scope: CoroutineScope? = null
                  private var visible = false
                  private var w = 0
                  private var h = 0
                  private var dirty = true
                  private var lastEnd = 0L

                  private val tick = object : Runnable {
                      override fun run() {
                          draw()
                          if (visible) handler.postDelayed(this, ConfigStore.current.wallpaperRedrawMs.toLong())
                      }
                  }

                  override fun onSurfaceChanged(holder: SurfaceHolder, format: Int, width: Int, height: Int) {
                      w = width; h = height; dirty = true
                      draw()
                  }

                  override fun onSurfaceRedrawNeeded(holder: SurfaceHolder) { dirty = true; draw() }

                  override fun onVisibilityChanged(v: Boolean) {
                      visible = v
                      handler.removeCallbacks(tick)
                      if (v) {
                          val s = CoroutineScope(SupervisorJob() + Dispatchers.Main)
                          scope = s
                          applyEnabled()
                          s.launch { MarketEngine.updates.collect { dirty = true } }
                          s.launch { ConfigStore.changes.collect { dirty = true; applyEnabled() } }
                          dirty = true
                          handler.post(tick)
                      } else {
                          scope?.cancel(); scope = null
                          MarketEngine.release(this)
                      }
                  }

                  override fun onDestroy() {
                      visible = false
                      handler.removeCallbacks(tick)
                      scope?.cancel()
                      MarketEngine.release(this)
                      super.onDestroy()
                  }

                  /** Honours the wallpaper_enabled setting: disabled = plain background, no network at all. */
                  private fun applyEnabled() {
                      if (ConfigStore.current.wallpaperEnabled) MarketEngine.acquire(this) else MarketEngine.release(this)
                  }

                  private fun draw() {
                      if (!visible || w == 0 || h == 0) return
                      val cfg = ConfigStore.current
                      val tf = cfg.tfSeconds
                      val end = ChartMath.windowEnd(MarketEngine.nowSec(), tf)
                      if (!dirty && end == lastEnd) return       // nothing changed: skip the redraw
                      dirty = false; lastEnd = end

                      val holder = surfaceHolder
                      var cv: Canvas? = null
                      try {
                          cv = holder.lockCanvas() ?: return
                          val st = ChartStyle.from(cfg)
                          if (!cfg.wallpaperEnabled) { cv.drawColor(st.bg); return }
                          val snap = MarketEngine.snapshot()
                          val ok = snap.tf == tf && snap.symbol == cfg.symbol
                          val data = if (ok) snap.candles else emptyList()
                          val price = if (ok) snap.price else null
                          val top = h * cfg.wallpaperChartTopPct / 100
                          val bottom = h * cfg.wallpaperChartBottomPct / 100
                          val ch = (h - top - bottom).coerceAtLeast(1)
                          cv.drawColor(st.bg)
                          cv.save()
                          cv.translate(0f, top.toFloat())
                          val title = "${cfg.symbol} \u00B7 ${cfg.candleTimeframe}" + (if (price != null) "   ${ChartMath.formatPrice(price)}" else "")
                          renderer.draw(cv, w, ch, data, tf, end - cfg.durSeconds, end, st, price, null, title)
                          cv.restore()
                      } catch (e: Exception) {
                          // never crash the launcher process because of a drawing problem
                      } finally {
                          if (cv != null) try { holder.unlockCanvasAndPost(cv) } catch (e: Exception) { }
                      }
                  }
              }
          }
