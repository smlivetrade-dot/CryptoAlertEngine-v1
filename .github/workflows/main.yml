      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify restored source
        shell: bash
        run: |
          test "$(grep -c 'versionName = \"4.1.5\"' app/build.gradle.kts)" -eq 1
          test "$(grep -c 'stAtrValue = stA ?: return@forEach' app/src/main/java/com/cryptoalertengine/engine/IncrementalIndicators.kt)" -eq 1

      - name: Build and test
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CryptoAlertEngine-V4.1.5-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload complete source
        uses: actions/upload-artifact@v4
        with:
          name: CryptoAlertEngine-V4.1.5-source
          path: .
          retention-days: 14
