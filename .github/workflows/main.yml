                  assertEquals(1_800_000_300L, ChartMath.windowEnd(1_800_000_000L + 17, 300))
                  assertEquals(1_800_000_300L, ChartMath.windowEnd(1_800_000_000L + 299, 300))
                  assertEquals(1_800_000_600L, ChartMath.windowEnd(1_800_000_000L + 300, 300))
              }

              @Test fun twoHourWindowOfFiveMinuteCandlesHasTwentyFour() {
