name: Build Crypto Alert Engine V4

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Restore V4 source archive
        env:
          SOURCE_B64: 
        run: |
          printf '%s' "$SOURCE_B64" | base64 -d > /tmp/source.zip
          rm -rf /tmp/project
          mkdir -p /tmp/project
          unzip -q /tmp/source.zip -d /tmp/project
          cp -a /tmp/project/. .
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build and test
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CryptoAlertEngine-V4-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: CryptoAlertEngine-V4-source
          path: .
          retention-days: 14
