          package com.lmw.marketwallpaper.data

          import java.util.TreeMap

          /**
           * Candles for one symbol/timeframe, keyed by aligned open time (so duplicates are impossible).
           * Closed candles come from REST, the forming candle from the WebSocket.
           */
          class CandleStore(val tf: Long, private val maxCandles: Int) {
              private val map = TreeMap<Long, Candle>()
              private var cache: List<Candle>? = null
              private var ver = 0L

              /** [version] only changes when closed history changes (new candle, merge, trim), not on ticks of the forming candle. */
              class View(val candles: List<Candle>, val version: Long)

              @Synchronized fun view(): View = View(cache ?: ArrayList(map.values).also { cache = it }, ver)

              fun align(t: Long): Long = t - Math.floorMod(t, tf)

              /**
               * Merges REST candles. Candles older than [formingStart] are final and always replace what we hold;
               * the forming candle only replaces data that is not already fed by the live stream.
               */
              @Synchronized
              fun merge(list: List<Candle>, formingStart: Long) {
                  for (c in list) {
                      val t = align(c.t)
                      val ex = map[t]
                      if (t < formingStart || ex == null || !ex.live) map[t] = c.copy(t = t, live = false)
                  }
                  trim()
                  cache = null
                  ver++
              }

              /**
               * Applies one executed trade to the forming candle: close = price, high/low extended, new candle if a new period began.
               * Returns false when nothing changed.
               */
              @Synchronized
              fun applyTrade(tsSec: Long, price: Double): Boolean {
                  val t = align(tsSec)
                  val ex = map[t]
                  val lastKey = if (map.isEmpty()) null else map.lastKey()
                  if (lastKey != null && t < lastKey) return false           // late trade for an older candle
                  val nc = if (ex == null) Candle(t, price, price, price, price, true) else {
                      if (ex.c == price && ex.h >= price && ex.l <= price) return false
                      ex.copy(h = maxOf(ex.h, price), l = minOf(ex.l, price), c = price, live = true)
                  }
                  map[t] = nc
                  val trimmed = trim()
                  cache = null
                  if (trimmed || ex == null) ver++
                  return true
              }

              /**
               * Applies a candle from the candlestick channel. With [keepClose] (a trade arrived moments ago) the close we already
               * have from the trade stream is kept so an older candle message cannot make the price jump backwards.
               */
              @Synchronized
              fun applyLive(c: Candle, keepClose: Boolean = false): Boolean {
                  val t = align(c.t)
                  val ex = map[t]
                  @Suppress("NAME_SHADOWING")
                  val c = if (keepClose && ex != null) c.copy(h = maxOf(c.h, ex.h), l = minOf(c.l, ex.l), c = ex.c) else c
                  val lastKey = if (map.isEmpty()) null else map.lastKey()
                  if (ex != null && ex.o == c.o && ex.h == c.h && ex.l == c.l && ex.c == c.c) {
                      if (!ex.live) map[t] = ex.copy(live = true)
                      return false
                  }
                  map[t] = c.copy(t = t, live = true)
                  val trimmed = trim()
                  cache = null
                  if (trimmed || lastKey == null || t != lastKey) ver++
                  return true
              }

              /** After a disconnect live data is stale: fresh REST data may replace it. */
              @Synchronized
              fun markStale() {
                  map.replaceAll { _, v -> if (v.live) v.copy(live = false) else v }
                  cache = null
              }

              /** Read-only list; the same instance is returned until the data changes (cheap for frequent redraws). */
              @Synchronized fun snapshot(): List<Candle> = view().candles
              @Synchronized fun last(): Candle? = map.lastEntry()?.value
              @Synchronized fun size(): Int = map.size

              private fun trim(): Boolean {
                  var any = false
                  while (map.size > maxCandles) { map.pollFirstEntry(); any = true }
                  return any
              }
          }
