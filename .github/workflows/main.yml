name: Build Crypto Alert Engine APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare workspace
        run: |
          rm -rf project
          mkdir project
          cat > /tmp/project.zip.b64 <<'EOF'
          
          EOF
          base64 -d /tmp/project.zip.b64 > /tmp/project.zip
          unzip -q /tmp/project.zip -d project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build and test
        working-directory: project
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CryptoAlertEngine-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Package complete source
        working-directory: project
        run: zip -qr /tmp/CryptoAlertEngine-source-built.zip .

      - name: Upload complete source
        uses: actions/upload-artifact@v4
        with:
          name: CryptoAlertEngine-source
          path: /tmp/CryptoAlertEngine-source-built.zip
          if-no-files-found: error
          retention-days: 14
