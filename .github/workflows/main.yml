      - name: Verify source structure
        shell: bash
        run: |
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/java/com/cryptoalertengine/MainActivity.kt
          test -f app/src/main/java/com/cryptoalertengine/service/MonitoringService.kt
          ! grep -R "ALERT_CHANNEL_SOUND_SILENT" -n app/src/main/java || true

      - name: Test and build APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CryptoAlertEngine-V3.4-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: CryptoAlertEngine-V3.4-source
          path: .
          retention-days: 14
