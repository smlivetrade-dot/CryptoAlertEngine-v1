      - name: Verify embedded project checksum and ZIP integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, zipfile
          from pathlib import Path
          p=Path('/tmp/project.zip')
          expected='1d4597b3da49038f7f54983ecad77cad397f6de011162af7a79e44d185bd2556'
          if not p.is_file(): raise SystemExit('Missing decoded /tmp/project.zip')
          actual=hashlib.sha256(p.read_bytes()).hexdigest()
          if actual != expected: raise SystemExit(f'Embedded project SHA-256 mismatch: {actual} != {expected}')
          with zipfile.ZipFile(p) as z:
              bad=z.testzip()
              if bad: raise SystemExit(f'Corrupt ZIP entry: {bad}')
          print('Embedded project checksum and ZIP integrity passed.')
          PY

      - name: Verify V4.3.2 source invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          checks = {
              'app/build.gradle.kts': ['versionName = "4.3.2"'],
              'gradle.properties': ['kotlin.compiler.execution.strategy=in-process', 'org.gradle.workers.max=2'],
