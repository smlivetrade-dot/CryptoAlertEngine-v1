          package com.lmw.marketwallpaper.data

          import java.util.TreeMap

          /**
           * Candles for one symbol/timeframe, keyed by aligned open time (so duplicates are impossible).
           * Closed candles come from REST, the forming candle from the WebSocket.
           */
          class CandleStore(val tf: Long, private val maxCandles: Int) {
              private val map = TreeMap<Long, Candle>()

              fun align(t: Long): Long = t - Math.floorMod(t, tf)

              /**
               * Merges REST candles. Candles older than [formingStart] are final and always replace what we hold;
               * the forming candle only replaces data that is not already fed by the live stream.
               */
              @Synchronized
              fun merge(list: List<Candle>, formingStart: Long) {
                  for (c in list) {
                      val t = align(c.t)
                      val ex = map[t]
                      if (t < formingStart || ex == null || !ex.live) map[t] = c.copy(t = t, live = false)
                  }
                  trim()
              }

              @Synchronized
              fun applyLive(c: Candle) {
                  val t = align(c.t)
                  map[t] = c.copy(t = t, live = true)
                  trim()
              }

              /** After a disconnect live data is stale: fresh REST data may replace it. */
              @Synchronized
              fun markStale() {
                  map.replaceAll { _, v -> if (v.live) v.copy(live = false) else v }
              }

              @Synchronized fun snapshot(): List<Candle> = ArrayList(map.values)
              @Synchronized fun last(): Candle? = map.lastEntry()?.value
              @Synchronized fun size(): Int = map.size

              private fun trim() {
                  while (map.size > maxCandles) map.pollFirstEntry()
              }
          }
          LMW_EOF
