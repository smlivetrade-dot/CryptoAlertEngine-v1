      - name: Validate notification design
        shell: bash
        run: |
          test -f app/src/main/java/com/cryptoalertengine/data/Models.kt
          test -f app/src/main/java/com/cryptoalertengine/service/MonitoringService.kt
          grep -q 'MULTI ST' app/src/main/java/com/cryptoalertengine/data/Models.kt
          grep -q 'MULTI EMA' app/src/main/java/com/cryptoalertengine/data/Models.kt
          grep -q 'MtEma' app/src/main/java/com/cryptoalertengine/data/Models.kt
          ! grep -q 'append("O ' app/src/main/java/com/cryptoalertengine/data/Models.kt
          ! grep -q 'append("CONDITION:' app/src/main/java/com/cryptoalertengine/data/Models.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build and test
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CryptoAlertEngine-V3.9.4-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: CryptoAlertEngine-V3.9.4-source
          path: .
          retention-days: 14
