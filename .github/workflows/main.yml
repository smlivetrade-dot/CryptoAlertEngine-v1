          cat > 'app/src/main/kotlin/com/lmw/marketwallpaper/data/MarketEngine.kt' <<'LMW_EOF'
          package com.lmw.marketwallpaper.data

          import android.os.SystemClock
          import com.lmw.marketwallpaper.config.AppConfig
          import com.lmw.marketwallpaper.config.ConfigStore
          import kotlinx.coroutines.*
          import kotlinx.coroutines.channels.BufferOverflow
          import kotlinx.coroutines.flow.MutableSharedFlow
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import okhttp3.Response
          import okhttp3.WebSocket
          import okhttp3.WebSocketListener
          import java.util.concurrent.TimeUnit
          import java.util.concurrent.atomic.AtomicBoolean
          import java.util.concurrent.atomic.AtomicLong

          object Http {
              val client: OkHttpClient by lazy {
                  val t = ConfigStore.current.httpTimeoutS.toLong()
                  OkHttpClient.Builder()
                      .connectTimeout(t, TimeUnit.SECONDS)
                      .readTimeout(t, TimeUnit.SECONDS)
                      .pingInterval(20, TimeUnit.SECONDS)
                      .build()
              }
          }

          /**
           * Data engine: REST backfill + WebSocket live candle + reconnect. Reference-counted: it only runs
           * (and only uses network/CPU) while the app screen or the wallpaper is visible.
           */
          object MarketEngine {
              data class Snapshot(val symbol: String, val tf: Long, val candles: List<Candle>, val price: Double?)

              private val scope = CoroutineScope(SupervisorJob() + Dispatchers.Default)
              private val owners = HashSet<Any>()
              private var job: Job? = null
              private var running: AppConfig? = null

              @Volatile private var store = CandleStore(300, 1500)
              @Volatile private var symbol = ""
              @Volatile private var offsetMs = 0L
              @Volatile private var wsOffsetKnown = false

              /** Emits whenever candles change (or config changes) so views can redraw. */
              val updates = MutableSharedFlow<Unit>(extraBufferCapacity = 1, onBufferOverflow = BufferOverflow.DROP_OLDEST)

              init {
                  scope.launch { ConfigStore.changes.collect { onConfig(it) } }
              }

              /** Current exchange-synchronised time in epoch seconds. */
              fun nowSec(): Long = (System.currentTimeMillis() + offsetMs) / 1000

              fun snapshot(): Snapshot {
                  val st = store
                  val c = st.snapshot()
                  return Snapshot(symbol, st.tf, c, c.lastOrNull()?.c)
              }

              @Synchronized
              fun acquire(owner: Any) {
                  owners.add(owner)
                  if (job == null) start()
              }

              @Synchronized
              fun release(owner: Any) {
                  owners.remove(owner)
                  if (owners.isEmpty()) stop()
              }

              @Synchronized
              private fun start() {
                  val cfg = ConfigStore.current
                  running = cfg
                  symbol = cfg.symbol
                  wsOffsetKnown = false
                  val st = CandleStore(cfg.tfSeconds, cfg.maxCandles)
                  store = st
                  job = scope.launch { runLoop(cfg, st) }
              }

              @Synchronized
              private fun stop() {
                  job?.cancel()
                  job = null
              }

              @Synchronized
              private fun onConfig(c: AppConfig) {
                  val r = running
                  if (job != null && r != null && c.dataKeyDiffers(r)) {
                      stop()
                      start()
                  }
                  updates.tryEmit(Unit)
              }

              private suspend fun runLoop(cfg: AppConfig, st: CandleStore) {
                  val rest = DeltaRest(Http.client, cfg.restBaseUrl)
                  var backoff = cfg.reconnectMinMs.toLong()
                  while (currentCoroutineContext().isActive) {
                      var gotData = false
                      try {
                          st.markStale()
                          backfill(cfg, st, rest)
                          gotData = listen(cfg, st, rest)
                      } catch (e: CancellationException) {
                          throw e
                      } catch (e: Exception) {
                          // network error: retry with backoff
                      }
                      backoff = if (gotData) cfg.reconnectMinMs.toLong() else minOf(backoff * 2, cfg.reconnectMaxMs.toLong())
                      delay(backoff)
                  }
              }

              /** Loads closed history plus the forming candle; safe to repeat after every reconnect. */
              private fun backfill(cfg: AppConfig, st: CandleStore, rest: DeltaRest) {
                  val tf = st.tf
                  val now = nowSec()
                  val cur = st.align(now)
                  val span = minOf(cfg.durSeconds * cfg.historyMultiplier, tf * minOf(cfg.maxCandles, 2000))
                  val r = rest.candles(cfg.symbol, cfg.candleTimeframe, cur - span, now)
                  r.serverOffsetMs?.let { if (!wsOffsetKnown && kotlin.math.abs(it) > 1500) offsetMs = it }
                  st.merge(r.candles, cur)
                  updates.tryEmit(Unit)
              }

              private fun confirmRecent(cfg: AppConfig, st: CandleStore, rest: DeltaRest) {
                  val now = nowSec()
                  val cur = st.align(now)
                  val r = rest.candles(cfg.symbol, cfg.candleTimeframe, cur - 3 * st.tf, now)
                  st.merge(r.candles, cur)
                  updates.tryEmit(Unit)
              }

              /** Runs one WebSocket session. Returns true if any data was received. */
              private suspend fun listen(cfg: AppConfig, st: CandleStore, rest: DeltaRest): Boolean {
                  val channel = "candlestick_${cfg.candleTimeframe}"
                  val closed = CompletableDeferred<Unit>()
                  val lastMsg = AtomicLong(SystemClock.elapsedRealtime())
                  val got = AtomicBoolean(false)
                  val subscribe = """{"type":"subscribe","payload":{"channels":[{"name":"$channel","symbols":["${cfg.symbol}"]}]}}"""

                  val ws: WebSocket = Http.client.newWebSocket(Request.Builder().url(cfg.wsUrl).build(), object : WebSocketListener() {
                      override fun onOpen(webSocket: WebSocket, response: Response) {
                          webSocket.send(subscribe)
                          webSocket.send("""{"type":"enable_heartbeat"}""")
                      }

                      override fun onMessage(webSocket: WebSocket, text: String) {
                          lastMsg.set(SystemClock.elapsedRealtime())
                          val live = LiveParser.parse(text, channel, cfg.symbol) ?: return
                          got.set(true)
                          live.serverMs?.let { offsetMs = it - System.currentTimeMillis(); wsOffsetKnown = true }
                          val prevLast = st.last()?.t
                          st.applyLive(live.candle)
                          if (prevLast != null && st.align(live.candle.t) > prevLast) {
                              // A new candle started: confirm the one that just closed with REST data.
                              scope.launch {
                                  delay(2000)
                                  try { confirmRecent(cfg, st, rest) } catch (e: Exception) { /* next reconnect will heal */ }
                              }
                          }
                          updates.tryEmit(Unit)
                      }

                      override fun onClosed(webSocket: WebSocket, code: Int, reason: String) { closed.complete(Unit) }
                      override fun onFailure(webSocket: WebSocket, t: Throwable, response: Response?) { closed.complete(Unit) }
                  })

                  try {
                      while (!closed.isCompleted) {
                          delay(2000)
                          if (SystemClock.elapsedRealtime() - lastMsg.get() > cfg.wsStaleSeconds * 1000L) break
                      }
                  } finally {
                      ws.cancel()
                  }
                  return got.get()
              }
          }
          LMW_EOF
