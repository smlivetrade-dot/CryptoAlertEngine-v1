      - name: Install Android SDK tools
        uses: android-actions/setup-android@v3
      - name: Build debug APK
        working-directory: /tmp/project
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace
      - name: Copy APK
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp /tmp/project/app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/CryptoAlertEngine-V4.2.0-safety-debug.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CryptoAlertEngine-V4.2.0-safety-debug-apk
          path: out/CryptoAlertEngine-V4.2.0-safety-debug.apk
