          import android.view.MotionEvent
          import android.view.ScaleGestureDetector
          import android.view.View
          import com.lmw.marketwallpaper.chart.ChartMath
          import com.lmw.marketwallpaper.chart.CachedChart
          import com.lmw.marketwallpaper.chart.ChartStyle
          import com.lmw.marketwallpaper.config.AppConfig
          import com.lmw.marketwallpaper.config.ConfigStore
          import com.lmw.marketwallpaper.data.Candle
          import com.lmw.marketwallpaper.data.MarketEngine
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.SupervisorJob
          import kotlinx.coroutines.cancel
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.launch
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import kotlin.math.max
          import kotlin.math.min

          /** Interactive chart: pinch zoom, drag to inspect history, long-press crosshair, auto-follow. */
          class ChartView(ctx: Context) : View(ctx) {
              private val d = resources.displayMetrics.density
              private val chartC = CachedChart(d)
              private val renderer get() = chartC.r
              private val pill = Paint(Paint.ANTI_ALIAS_FLAG)
              private val pillRect = RectF()
              private val timeFmt = SimpleDateFormat("dd MMM HH:mm", Locale.US)

              /** Called with the crosshair readout ("" when inactive). */
              var onInspect: ((String) -> Unit)? = null

              private var zoom = 1.0
              private var panSec = 0.0          // seconds scrolled back from the live edge; 0 = auto-follow
              private var cross: PointF? = null
              private var crossDrag = false
              private var viewKey = ""
              private var lastInfo = ""
              private var scope: CoroutineScope? = null
              private var lastData: List<Candle> = emptyList()
              private var lastSpan = 1.0
              private var lastTf = 300L

              private val scaleDetector = ScaleGestureDetector(ctx, object : ScaleGestureDetector.SimpleOnScaleGestureListener() {
                  override fun onScale(det: ScaleGestureDetector): Boolean {
                      zoom = (zoom / det.scaleFactor).coerceIn(0.1, 6.0)
                      clampPan(); invalidate(); return true
                  }
              })

              private val gestures = GestureDetector(ctx, object : GestureDetector.SimpleOnGestureListener() {
                  override fun onDown(e: MotionEvent) = true

                  override fun onScroll(e1: MotionEvent?, e2: MotionEvent, dx: Float, dy: Float): Boolean {
                      if (crossDrag) { cross = PointF(e2.x, e2.y); invalidate(); return true }
                      val pw = renderer.plotR - renderer.plotL
                      if (pw <= 0f) return true
                      panSec += (-dx / pw) * lastSpan
                      clampPan()
                      if (panSec < lastSpan * 0.01) panSec = 0.0   // back at the latest price: resume auto-follow
                      cross = null
                      invalidate(); return true
                  }

                  override fun onLongPress(e: MotionEvent) {
                      crossDrag = true; cross = PointF(e.x, e.y); invalidate()
                  }

                  override fun onSingleTapUp(e: MotionEvent): Boolean {
                      if (panSec > 0 && pillRect.contains(e.x, e.y)) { panSec = 0.0; invalidate(); return true }
                      if (cross != null) { cross = null; invalidate() }
                      return true
                  }
              })

              private fun clampPan() {
                  val first = lastData.firstOrNull()?.t
                  val liveEnd = ChartMath.windowEnd(MarketEngine.nowSec(), lastTf)
                  val maxPan = if (first == null) 0.0 else max(0.0, (liveEnd - first) - lastSpan * 0.5)
                  panSec = panSec.coerceIn(0.0, maxPan)
              }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  scaleDetector.onTouchEvent(e)
                  if (!scaleDetector.isInProgress) gestures.onTouchEvent(e)
                  if (e.actionMasked == MotionEvent.ACTION_UP || e.actionMasked == MotionEvent.ACTION_CANCEL) crossDrag = false
                  return true
              }

              override fun onAttachedToWindow() {
                  super.onAttachedToWindow()
                  val s = CoroutineScope(SupervisorJob() + Dispatchers.Main)
                  scope = s
                  // Redraw at most ~10 times a second however fast ticks arrive.
                  s.launch { MarketEngine.updates.collect { postInvalidateOnAnimation() } }   // coalesced to one draw per frame
                  removeCallbacks(tick)
                  postDelayed(tick, 1000)     // one slow ticker lets the window advance when a new candle period starts
              }

              private val tick = object : Runnable {
                  override fun run() { invalidate(); postDelayed(this, 1000) }
              }
              private var styleCfg: AppConfig? = null
              private var style: ChartStyle? = null

              override fun onDetachedFromWindow() {
                  removeCallbacks(tick)
                  chartC.release()
                  scope?.cancel()
                  super.onDetachedFromWindow()
              }

              private fun styleFor(cfg: AppConfig): ChartStyle = chartC.styleFor(cfg)

              override fun onDraw(cv: Canvas) {
                  val cfg = ConfigStore.current
                  val key = "${cfg.symbol}|${cfg.candleTimeframe}|${cfg.displayDuration}"
                  if (key != viewKey) { viewKey = key; zoom = 1.0; panSec = 0.0; cross = null }

                  val snap = MarketEngine.snapshot()
                  val tf = cfg.tfSeconds
                  val data = if (snap.tf == tf && snap.symbol == cfg.symbol) snap.candles else emptyList()
                  val price = if (data.isEmpty()) null else snap.price
                  val span = max(cfg.durSeconds * zoom, tf * 5.0)
                  lastData = data; lastSpan = span; lastTf = tf
                  clampPan()

                  val liveEnd = ChartMath.windowEnd(MarketEngine.nowSec(), tf)
                  val ve = liveEnd + (span * cfg.chartRightGapPct / 100).toLong() - panSec.toLong()
                  val vs = ve - span.toLong()
                  val found = chartC.draw(cv, width, height, data, snap.version, snap.id, tf, vs, ve, styleFor(cfg), price, cross, null)

                  if (panSec > 0) {
                      pill.style = Paint.Style.FILL; pill.color = Color.parseColor("#2A2E39")
                      pill.textSize = 12f * d
                      val s = "Latest \u25B8"
                      val tw = pill.measureText(s) + 20f * d
                      pillRect.set(renderer.plotR - tw - 8f * d, renderer.plotB - 34f * d, renderer.plotR - 8f * d, renderer.plotB - 8f * d)
                      cv.drawRoundRect(pillRect, 13f * d, 13f * d, pill)
                      pill.color = Color.WHITE
                      cv.drawText(s, pillRect.left + 10f * d, pillRect.centerY() + 4f * d, pill)
                  } else pillRect.setEmpty()

                  val info = if (cross != null && found != null) {
                      "${timeFmt.format(Date(found.t * 1000))}   O ${ChartMath.formatPrice(found.o)}  H ${ChartMath.formatPrice(found.h)}  L ${ChartMath.formatPrice(found.l)}  C ${ChartMath.formatPrice(found.c)}"
                  } else if (cross != null) {
                      "Price ${ChartMath.formatPrice(renderer.priceAt(cross!!.y))}   ${timeFmt.format(Date(renderer.timeAt(cross!!.x) * 1000))}"
                  } else ""
                  if (info != lastInfo) { lastInfo = info; onInspect?.invoke(info) }

              }
          }
