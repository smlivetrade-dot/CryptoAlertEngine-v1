      - name: Validate project payload
        shell: bash
        run: |
          test -f app/src/main/java/com/cryptoalertengine/service/MonitoringService.kt
          test -f app/src/main/java/com/cryptoalertengine/service/MonitoringBootReceiver.kt
          ! grep -R "liveTradeCandles\|list.add(merged)" -n app/src/main/java
          grep -q "isMonitoringEnabled" app/src/main/java/com/cryptoalertengine/data/ConfigStore.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test and build APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CryptoAlertEngine-V3.5-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: CryptoAlertEngine-V3.5-source
          path: .
          retention-days: 14
