                  'CLOSE SELECTED POSITION',
                  'CANCEL SELECTED',
                  'CANCEL ALL',
              ],
              'app/src/main/java/com/cryptoalertengine/service/TradingService.kt': [
                  'position.qty < totalQty',
                  'sessionRefreshJob',
                  'authenticationBlocked',
                  'AUTHENTICATION BLOCKED',
                  'isAuthenticationError',
                  'a.openOrders(productId)',
                  'a.cancelOrder(productId, id)',
                  'a.cancelAllForProduct(productId)',
                  'exchange state is stale/unknown',
                  'orderByClientId',
                  'AUTO TRADING DISARMED: no new entries',
                  'EMA COMBINED PROTECTION ACTIVE',
                  'privateConnectionGeneration += 1L',
                  'enableHeartbeat()',
                  'PRIVATE WEBSOCKET HEARTBEAT STALE — reconnecting',
                  'connectionMutex',
                  'AUTO TRADING ARMED — REST entries/exits active; private WebSocket recovering (reconciliation backstop)',
                  'startContinuousMarketBridge()',
                  'LiveStateStore.marketEvents.collect',
                  'processTradingEvent',
                  'ENTRY QUEUED: exchange position=',
                  'ST EXIT PARTIAL FILL:',
                  'COMBINED EMA PROTECTION PARTIAL FILL:',
                  'reduceOnly = true',
                  'REST entries/exits active; private WebSocket recovering',
                  'TRADING EVENT CONSUMED:',
                  'AUTO ENTRY EVENT:',
                  'enqueuePendingMarketEvent',
                  'queuedReplay',
                  'Trading events are durable until the exchange state is ready',
                  'lastAtr = market.closedSnapshot.atr ?: market.snapshot.atr ?: lastAtr',
                  'lastExchangePosition',
                  'clearManagedStateAfterExchangeFlat',
                  'EXCHANGE POSITION FLAT — bot protection/strategy ledger cleared',
                  'v2/user_trades',
                  'isBotOrder',
              ],
              'app/src/main/java/com/cryptoalertengine/data/Models.kt': [
                  'val symbol: String = "ETHUSD"',
                  'val tradingTimeframe: String = "5m"',
                  'val mtf2: String = "15m"',
                  'val mtf3: String = "1h"',
                  'val autoReconnect30m: Boolean = true',
                  'val fastEmaEntryOffset: Double = 0.2',
                  'val slowEmaEntryOffset: Double = 0.2',
                  'val minEmaEntryDistance: Double = 5.0',
                  'val emaFastPeriod: Int = 8',
                  'val emaSlowPeriod: Int = 19',
                  'val atrFilterThreshold: Double = 4.0',
                  'val stEntryOffset: Double = 0.2',
                  'val emaMaxSlDistance: Double = 10.0',
                  'val haltCrossCount: Int = 5',
                  'val priceUpdate10mEnabled: Boolean = true',
                  'val widgetLivePriceEnabled: Boolean = false',
              ],
              'app/src/main/java/com/cryptoalertengine/engine/TradingRules.kt': ['weightedAverageEntry'],
              'app/src/main/java/com/cryptoalertengine/data/LiveState.kt': [
                  'MutableSharedFlow<AlertEvent>',
                  'fun emitMarketEvent(event: AlertEvent)',
              ],
              'app/src/main/java/com/cryptoalertengine/engine/AlertEngine.kt': [
                  'val notify = notificationEnabled && alertedThisBar.isEmpty()',
                  'notificationEnabled: Boolean = true',
                  'notificationEligible = notify',
                  'if (touch("fast", s.emaFast))',
                  'if (touch("slow", s.emaSlow))',
                  'if (confirmedTrend == Trend.BUY)',
                  'if (confirmedTrend == Trend.SELL)',
              ],
          }
          for rel, needles in checks.items():
              p = Path(rel)
              if not p.is_file():
                  raise SystemExit(f'Missing required source file: {rel}')
              s = p.read_text(encoding='utf-8')
              for needle in needles:
                  if needle not in s:
                      raise SystemExit(f'Missing invariant: {needle!r} in {rel}')
          main = Path('app/src/main/java/com/cryptoalertengine/MainActivity.kt').read_text(encoding='utf-8')
          for forbidden in ('ORDER BOOK', '"ASK"', '"BID"'):
