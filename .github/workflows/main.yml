          import kotlinx.coroutines.cancel
          import kotlinx.coroutines.launch

          /** Dashboard: symbol, price, interactive chart and the three quick selectors. */
          class MainActivity : Activity() {
              private var scope: CoroutineScope? = null
              private lateinit var symbolTv: TextView
              private lateinit var priceTv: TextView
              private lateinit var infoTv: TextView
              private lateinit var statusTv: TextView
              private lateinit var atrRow: LinearLayout
              private lateinit var atrLeft: TextView
              private lateinit var atrRight: TextView
              private val clock = SimpleDateFormat("HH:mm:ss", Locale.US)

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              override fun onStart() {
                  super.onStart()
                  setContentView(buildUi())
                  MarketEngine.setBookWanted(this, ConfigStore.current.orderbookEnabled)
                  MarketEngine.acquire(this)
                  val s = CoroutineScope(SupervisorJob() + Dispatchers.Main)
                  scope = s
                  s.launch { MarketEngine.updates.collect { refreshHeader() } }
                  refreshHeader()
              }

              override fun onStop() {
                  scope?.cancel()
                  MarketEngine.setBookWanted(this, false)
                  MarketEngine.release(this)
                  super.onStop()
              }

              private fun TextView.setIfChanged(s: CharSequence) { if (text.toString() != s.toString()) text = s }

              private fun refreshHeader() {
                  val cfg = ConfigStore.current
                  val status = MarketEngine.status()
                  val live = status == "LIVE"
                  val src = if (cfg.candleSource == "mark") " \u00B7 mark" else ""
                  symbolTv.setIfChanged("${cfg.symbol}  \u00B7  ${cfg.candleTimeframe}$src   " + (when (status) { "LIVE" -> "\u25CF LIVE"; "POLLING" -> "\u25D0 polling"; else -> "\u25CB connecting" }))

                  symbolTv.setTextColor(Color.parseColor(if (live) "#D1D4DC" else "#B58900"))
                  val err = MarketEngine.lastError
                  val sline = if (!live && err.isNotEmpty()) "Data: $err" else ""
                  statusTv.setIfChanged(sline)
                  statusTv.visibility = if (sline.isEmpty()) View.GONE else View.VISIBLE
                  if (cfg.atrEnabled) {
                      val a = MarketEngine.atr
                      val px = MarketEngine.lastCandle()?.c
                      val tag = "ATR ${cfg.atrPeriod}"
                      val sb = SpannableStringBuilder(tag)
                      sb.setSpan(StyleSpan(Typeface.BOLD), 0, tag.length, 0)
                      sb.setSpan(ForegroundColorSpan(Color.parseColor("#D1D4DC")), 0, tag.length, 0)
                      if (a != null) {
                          val start = sb.length + 3
                          sb.append("   ").append(ChartMath.formatPrice(a.value))
                          sb.setSpan(StyleSpan(Typeface.BOLD), start, sb.length, 0)
                          sb.setSpan(ForegroundColorSpan(Color.parseColor("#D1D4DC")), start, sb.length, 0)
                          if (px != null && px > 0) sb.append("   ").append(String.format(Locale.US, "%.2f", a.value / px * 100)).append("%")
                      } else sb.append("   \u2014")
                      atrLeft.setIfChanged(sb)
                      atrRight.setIfChanged(if (a != null) "recalculated every ${cfg.atrRecalcSeconds} s \u00B7 ${clock.format(Date(a.atMs))}" else "")
                  }
                  val last = MarketEngine.lastCandle()
                  if (last != null && MarketEngine.matches(cfg)) {
                      priceTv.setIfChanged(ChartMath.formatPrice(last.c))
                      priceTv.setTextColor(Color.parseColor(if (last.c >= last.o) cfg.bullishColor else cfg.bearishColor))
                  } else {
                      priceTv.setIfChanged("\u2014")
                      priceTv.setTextColor(Color.parseColor("#787B86"))
                  }
              }

              private fun buildUi(): View {
                  val cfg = ConfigStore.current
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor(cfg.backgroundColor))
                      fitsSystemWindows = true
                  }
                  val header = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(12), dp(8), dp(12), 0)
                  }
                  symbolTv = TextView(this).apply { setTextColor(Color.parseColor("#D1D4DC")); textSize = 15f; typeface = Typeface.DEFAULT_BOLD }
                  priceTv = TextView(this).apply { textSize = 20f; typeface = Typeface.DEFAULT_BOLD; setPadding(dp(12), 0, 0, 0) }
                  val gear = TextView(this).apply {
                      text = "\u2699"; textSize = 22f; setTextColor(Color.parseColor("#D1D4DC")); setPadding(dp(12), 0, 0, 0)
                      setOnClickListener { startActivity(Intent(this@MainActivity, SettingsActivity::class.java)) }
                  }
                  val spacer = View(this)
                  header.addView(symbolTv)
                  header.addView(priceTv)
                  header.addView(spacer, LinearLayout.LayoutParams(0, 1, 1f))
                  header.addView(gear)
                  infoTv = TextView(this).apply {
                      setTextColor(Color.parseColor("#787B86")); textSize = 11f; setPadding(dp(12), dp(2), dp(12), 0); minLines = 1; maxLines = 1
                  }
                  statusTv = TextView(this).apply { setTextColor(Color.parseColor("#B58900")); textSize = 10f; setPadding(dp(12), 0, dp(12), 0); visibility = View.GONE }
                  val chart = ChartView(this).apply { onInspect = { infoTv.text = it } }

                  val land = resources.configuration.orientation == android.content.res.Configuration.ORIENTATION_LANDSCAPE
                  val typeSp = spinner(cfg.chartTypeOptions, cfg.chartType) { v -> ConfigStore.update { it.chartType = v } }
                  val tfSp = spinner(cfg.timeframeOptions, cfg.candleTimeframe) { v -> ConfigStore.update { it.candleTimeframe = v } }
                  val durSp = spinner(cfg.durationOptions, cfg.displayDuration) { v -> ConfigStore.update { it.displayDuration = v } }
                  val controls = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; setPadding(dp(4), 0, dp(4), dp(4)) }
                  if (land) {
                      // Landscape: selectors move into the header row so the chart gets the whole height.
                      header.removeView(gear); header.removeView(spacer)
                      header.addView(spacer, LinearLayout.LayoutParams(0, 1, 1f))
                      for (sp in listOf(typeSp, tfSp, durSp)) header.addView(sp, LinearLayout.LayoutParams(dp(120), -2))
                      header.addView(gear)
                  } else {
                      for (sp in listOf(typeSp, tfSp, durSp)) controls.addView(sp, LinearLayout.LayoutParams(0, -2, 1f))
                  }

                  atrLeft = TextView(this).apply { textSize = 12f; setTextColor(Color.parseColor("#9AA0AA")) }
                  atrRight = TextView(this).apply { textSize = 11f; setTextColor(Color.parseColor("#787B86")) }
                  atrRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(12), dp(2), dp(12), 0)
                      visibility = if (cfg.atrEnabled) View.VISIBLE else View.GONE
                      addView(atrLeft, LinearLayout.LayoutParams(0, -2, 1f)); addView(atrRight)
                  }
                  root.addView(header)
                  root.addView(atrRow)
                  root.addView(infoTv)
                  root.addView(statusTv)
                  val book = if (cfg.orderbookEnabled) OrderBookView(this) else null
                  if (land) {
                      // Landscape: order book as a narrow panel on the right, chart keeps the full height.
                      val row = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                      row.addView(chart, LinearLayout.LayoutParams(0, -1, 1f))
                      book?.let { row.addView(it, LinearLayout.LayoutParams(dp(260), -1)) }
                      root.addView(row, LinearLayout.LayoutParams(-1, 0, 1f))
                  } else {
                      root.addView(chart, LinearLayout.LayoutParams(-1, 0, 1f))
                      book?.let { root.addView(it, LinearLayout.LayoutParams(-1, dp(cfg.orderbookLevels * 22 + 96))) }
                  }
                  if (!land) root.addView(controls)
                  return root
              }

              private fun spinner(opts: List<String>, selected: String, onPick: (String) -> Unit): Spinner {
                  val s = Spinner(this)
                  s.adapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, opts)
                  s.setSelection(maxOf(0, opts.indexOf(selected)), false)
                  s.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                      override fun onItemSelected(parent: AdapterView<*>?, view: View?, pos: Int, id: Long) {
                          if (opts[pos] != selected) onPick(opts[pos])
                      }
                      override fun onNothingSelected(parent: AdapterView<*>?) {}
                  }
                  return s
              }
          }
