          package com.levelfit.hunterascension;

          import android.app.Activity;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileOutputStream;

          public class MainActivity extends Activity {
              private WebView webView;
              private static final int PICK_BACKUP = 4102;

              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  getWindow().setStatusBarColor(android.graphics.Color.rgb(16,19,27));
                  getWindow().setNavigationBarColor(android.graphics.Color.rgb(16,19,27));
                  webView = new WebView(this);
                  setContentView(webView);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.getSettings().setDatabaseEnabled(true);
                  webView.getSettings().setAllowFileAccess(true);
                  webView.getSettings().setAllowContentAccess(true);
                  webView.addJavascriptInterface(new LevelFitBridge(), "LevelFitAndroid");
                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override public boolean onShowFileChooser(WebView view, android.webkit.ValueCallback<Uri[]> callback, FileChooserParams params) {
                          Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                          intent.addCategory(Intent.CATEGORY_OPENABLE);
                          intent.setType("application/json");
                          startActivityForResult(intent, PICK_BACKUP);
                          return true;
                      }
                  });
                  webView.loadUrl("file:///android_asset/index.html");
              }

              private class LevelFitBridge {
                  @JavascriptInterface public void saveBackup(String json, String filename) {
                      try {
                          String safe = (filename == null ? "LevelFit-backup.json" : filename)
                              .replaceAll("[^A-Za-z0-9._-]", "_");
                          if (Build.VERSION.SDK_INT >= 29) {
                              ContentValues values = new ContentValues();
                              values.put(MediaStore.Downloads.DISPLAY_NAME, safe);
                              values.put(MediaStore.Downloads.MIME_TYPE, "application/json");
                              values.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/LevelFit");
                              Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                              if (uri == null) throw new Exception("Cannot create backup");
                              try (OutputStream out = getContentResolver().openOutputStream(uri)) {
                                  out.write(json.getBytes(java.nio.charset.StandardCharsets.UTF_8));
                              }
                          } else {
                              File dir = getExternalFilesDir(Environment.DIRECTORY_DOCUMENTS);
                              if (dir == null) throw new Exception("Storage unavailable");
                              try (FileOutputStream out = new FileOutputStream(new File(dir, safe))) {
                                  out.write(json.getBytes(java.nio.charset.StandardCharsets.UTF_8));
                              }
                          }
                          runOnUiThread(() -> Toast.makeText(MainActivity.this,
                              "Backup saved in Downloads/LevelFit", Toast.LENGTH_LONG).show());
                      } catch (Exception ex) {
                          runOnUiThread(() -> Toast.makeText(MainActivity.this,
                              "Backup failed: " + ex.getMessage(), Toast.LENGTH_LONG).show());
                      }
                  }

                  @JavascriptInterface public void chooseBackup() {
                      runOnUiThread(() -> {
                          Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                          i.addCategory(Intent.CATEGORY_OPENABLE);
                          i.setType("application/json");
                          startActivityForResult(i, PICK_BACKUP);
                      });
                  }
              }

              @Override protected void onActivityResult(int request, int result, Intent data) {
                  super.onActivityResult(request, result, data);
                  if (request == PICK_BACKUP && result == RESULT_OK && data != null && data.getData() != null) {
                      try (InputStream in = getContentResolver().openInputStream(data.getData());
                           ByteArrayOutputStream out = new ByteArrayOutputStream()) {
                          byte[] buf = new byte[8192]; int n;
                          while ((n = in.read(buf)) != -1) out.write(buf, 0, n);
                          String json = new String(out.toByteArray(), java.nio.charset.StandardCharsets.UTF_8);
                          String quoted = org.json.JSONObject.quote(json);
                          webView.evaluateJavascript("window.onAndroidBackupLoaded && window.onAndroidBackupLoaded(" + quoted + ")", null);
                      } catch (Exception ex) {
                          Toast.makeText(this, "Could not read backup", Toast.LENGTH_LONG).show();
                      }
                  }
              }

              @Override public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }

              @Override protected void onDestroy() {
                  if (webView != null) { webView.removeJavascriptInterface("LevelFitAndroid"); webView.destroy(); }
                  super.onDestroy();
              }
          }

          JAVA

      - name: Verify embedded application
        run: |
          test -s app/src/main/assets/index.html
          grep -q 'LEVELFIT' app/src/main/assets/index.html

      - name: Build standalone debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: LevelFit-Standalone-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
