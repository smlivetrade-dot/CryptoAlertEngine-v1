          package com.lmw.marketwallpaper.data

          import org.json.JSONObject

          /** Parses Delta Exchange `candlestick_<res>` WebSocket messages. */
          object LiveParser {
              data class Live(val candle: Candle, val serverMs: Long?)

              /** Delta sends microseconds; tolerate ms and s as well. */
              fun toSec(v: Long): Long = when {
                  v >= 100_000_000_000_000_000L -> v / 1_000_000_000L   // nanoseconds (seen in the wild)
                  v >= 100_000_000_000_000L -> v / 1_000_000L
                  v >= 100_000_000_000L -> v / 1000L
                  else -> v
              }

              fun toMs(v: Long): Long = when {
                  v >= 100_000_000_000_000_000L -> v / 1_000_000L
                  v >= 100_000_000_000_000L -> v / 1000L
                  v >= 100_000_000_000L -> v
                  else -> v * 1000L
              }

              fun parse(text: String, channel: String, symbol: String): Live? {
                  val j = try { JSONObject(text) } catch (e: Exception) { return null }
                  if (j.optString("type") != channel) return null
                  if (j.has("symbol") && j.optString("symbol").removePrefix("MARK:") != symbol.removePrefix("MARK:")) return null
                  val start = j.optLong("candle_start_time", -1L)
                  if (start <= 0) return null
                  val o = j.optDouble("open", Double.NaN)
                  val h = j.optDouble("high", Double.NaN)
                  val l = j.optDouble("low", Double.NaN)
                  val c = j.optDouble("close", Double.NaN)
                  if (o.isNaN() || h.isNaN() || l.isNaN() || c.isNaN()) return null
                  val ts = j.optLong("timestamp", -1L)
                  return Live(Candle(toSec(start), o, h, l, c, true), if (ts > 0) toMs(ts) else null)
              }
          }
          LMW_EOF
