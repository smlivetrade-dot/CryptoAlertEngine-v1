name: Build Complete LevelFit APK

'on':
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    name: Generate standalone LevelFit Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Generate complete Android project and embed LevelFit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets app/src/main/java/com/levelfit/hunterascension app/src/main/res/values

          cat > /tmp/levelfit-html.b64 <<'LEVELFIT_HTML_BASE64'
