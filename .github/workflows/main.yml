          cat > android/app/src/main/java/com/ethusd/patternlab/Cfg.kt <<'EOF'
          package com.ethusd.patternlab

          import android.content.Context

          object Cfg {
              val tfNames = listOf("1m", "5m", "15m", "1h", "4h")
              val tfSecs = longArrayOf(60L, 300L, 900L, 3600L, 14400L)
              val corrNames = listOf("90%", "95%", "97%", "99%")
              val corrValues = doubleArrayOf(0.90, 0.95, 0.97, 0.99)
              val topValues = intArrayOf(3, 5, 8)
              val symbols = listOf("BTCUSD", "ETHUSD", "SOLUSD", "XRPUSD")

              fun human(sec: Long): String {
                  val d = sec / 86400
                  val hh = (sec % 86400) / 3600
                  val m = (sec % 3600) / 60
                  val sb = StringBuilder()
                  if (d > 0) sb.append(d).append("d ")
                  if (hh > 0) sb.append(hh).append("h ")
                  if (m > 0 || sb.isEmpty()) sb.append(m).append("m ")
                  return sb.toString().trim()
              }
          }

          class AppSettings(
              val symbol: String,
              val tfIdx: Int,
              val win: Int,
              val hor: Int,
              val days: Int,
              val corrIdx: Int,
              val topIdx: Int,
              val volFilter: Boolean,
              val notifyBias: Boolean,
              val monitor: Boolean
          ) {
              fun key(): String = symbol + "|" + tfIdx + "|" + days

              fun sameSearch(o: AppSettings): Boolean =
                  symbol == o.symbol && tfIdx == o.tfIdx && win == o.win && hor == o.hor &&
                      days == o.days && corrIdx == o.corrIdx && topIdx == o.topIdx && volFilter == o.volFilter

              fun withFlags(notify: Boolean, mon: Boolean): AppSettings =
                  AppSettings(symbol, tfIdx, win, hor, days, corrIdx, topIdx, volFilter, notify, mon)
          }

          object Prefs {
              private const val FILE = "patternlab_settings"

              fun defaults(): AppSettings = AppSettings(BuildConfig.SYMBOL, 1, 48, 24, 365, 1, 1, true, true, true)

              fun load(ctx: Context): AppSettings {
                  val p = ctx.getSharedPreferences(FILE, Context.MODE_PRIVATE)
                  val d = defaults()
                  return AppSettings(
                      p.getString("symbol", d.symbol) ?: d.symbol,
                      p.getInt("tf", d.tfIdx).coerceIn(0, Cfg.tfNames.size - 1),
                      p.getInt("win", d.win).coerceIn(3, 1000),
                      p.getInt("hor", d.hor).coerceIn(1, 1000),
                      p.getInt("days", d.days).coerceIn(1, 1500),
                      p.getInt("corr", d.corrIdx).coerceIn(0, Cfg.corrValues.size - 1),
                      p.getInt("top", d.topIdx).coerceIn(0, Cfg.topValues.size - 1),
                      p.getBoolean("vol", d.volFilter),
                      p.getBoolean("notify", d.notifyBias),
                      p.getBoolean("monitor", d.monitor)
                  )
              }

              fun save(ctx: Context, s: AppSettings) {
                  ctx.getSharedPreferences(FILE, Context.MODE_PRIVATE).edit()
                      .putString("symbol", s.symbol)
                      .putInt("tf", s.tfIdx)
                      .putInt("win", s.win)
                      .putInt("hor", s.hor)
                      .putInt("days", s.days)
                      .putInt("corr", s.corrIdx)
                      .putInt("top", s.topIdx)
                      .putBoolean("vol", s.volFilter)
                      .putBoolean("notify", s.notifyBias)
                      .putBoolean("monitor", s.monitor)
                      .apply()
              }
          }
          EOF

          cat > android/app/src/main/java/com/ethusd/patternlab/ChartView.kt <<'EOF'
          package com.ethusd.patternlab

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.DashPathEffect
          import android.graphics.Paint
          import android.graphics.Path
          import android.view.View
          import java.util.Locale

          class Series(val values: List<Double>, val color: Int, val width: Float = 4f, val offset: Int = 0)

          class ChartView(context: Context) : View(context) {

              private var series: List<Series> = emptyList()
              private var total = 0
              private var mark = -1
              private var showLabels = true

              private val linePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE
                  strokeJoin = Paint.Join.ROUND
                  strokeCap = Paint.Cap.ROUND
              }
              private val gridPaint = Paint().apply {
                  color = Color.parseColor("#22FFFFFF")
                  strokeWidth = 1f
              }
              private val markPaint = Paint().apply {
                  color = Color.parseColor("#88FFFFFF")
                  strokeWidth = 2f
                  style = Paint.Style.STROKE
                  pathEffect = DashPathEffect(floatArrayOf(10f, 10f), 0f)
              }
              private val labelPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.parseColor("#99FFFFFF")
                  textSize = 26f
              }

              fun setSeries(s: List<Series>, totalPoints: Int, markIndex: Int = -1, labels: Boolean = true) {
                  series = s
                  total = totalPoints
                  mark = markIndex
                  showLabels = labels
                  invalidate()
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  if (series.isEmpty() || total < 2) return

                  var mn = Double.MAX_VALUE
                  var mx = -Double.MAX_VALUE
                  for (s in series) {
                      for (v in s.values) {
                          if (v < mn) mn = v
                          if (v > mx) mx = v
                      }
                  }
                  if (mn > mx) return
                  val range = if (mx - mn < 1e-9) 1.0 else mx - mn

                  val w = width.toFloat()
                  val h = height.toFloat()
                  val padTop = if (showLabels) 34f else 12f
                  val padBottom = if (showLabels) 34f else 12f
                  val usable = h - padTop - padBottom

                  for (i in 0..3) {
                      val y = padTop + usable * i / 3f
                      canvas.drawLine(0f, y, w, y, gridPaint)
                  }

                  if (mark in 0 until total) {
                      val mxp = w * mark / (total - 1).toFloat()
                      val mp = Path()
                      mp.moveTo(mxp, padTop)
                      mp.lineTo(mxp, h - padBottom)
                      canvas.drawPath(mp, markPaint)
                  }

                  for (s in series) {
                      if (s.values.size < 2) continue
                      val path = Path()
                      s.values.forEachIndexed { i, v ->
                          val x = w * (i + s.offset) / (total - 1).toFloat()
                          val y = padTop + usable * (1f - ((v - mn) / range).toFloat())
                          if (i == 0) path.moveTo(x, y) else path.lineTo(x, y)
                      }
                      linePaint.color = s.color
                      linePaint.strokeWidth = s.width
                      canvas.drawPath(path, linePaint)
                  }

                  if (showLabels) {
                      canvas.drawText(String.format(Locale.US, "%.2f", mx), 8f, padTop - 8f, labelPaint)
                      canvas.drawText(String.format(Locale.US, "%.2f", mn), 8f, h - 8f, labelPaint)
                  }
              }
          }

          class HistView(context: Context) : View(context) {

              private var counts = IntArray(0)
              private var lo = 0.0
              private var hi = 0.0

              private val bar = Paint(Paint.ANTI_ALIAS_FLAG)
              private val axis = Paint().apply {
                  color = Color.parseColor("#66FFFFFF")
                  strokeWidth = 2f
              }
              private val txt = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.parseColor("#99FFFFFF")
                  textSize = 26f
              }

              fun setData(c: IntArray, low: Double, high: Double) {
                  counts = c
                  lo = low
                  hi = high
                  invalidate()
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  val n = counts.size
                  if (n == 0) return
                  var mx = 1
                  for (v in counts) if (v > mx) mx = v

                  val w = width.toFloat()
                  val h = height.toFloat()
                  val top = 30f
                  val bottom = h - 34f
                  val bw = w / n

                  for (i in 0 until n) {
                      val center = lo + (hi - lo) * (i + 0.5) / n
                      bar.color = Color.parseColor(if (center >= 0) "#4CAF50" else "#F44336")
                      val bh = (bottom - top) * counts[i] / mx.toFloat()
                      canvas.drawRect(i * bw + 2f, bottom - bh, (i + 1) * bw - 2f, bottom, bar)
                  }
                  canvas.drawLine(0f, bottom, w, bottom, axis)

                  if (lo < 0 && hi > 0) {
                      val x = w * ((0 - lo) / (hi - lo)).toFloat()
                      canvas.drawLine(x, top, x, bottom, axis)
                  }

                  canvas.drawText(String.format(Locale.US, "%+.2f%%", lo), 4f, h - 6f, txt)
                  val s = String.format(Locale.US, "%+.2f%%", hi)
                  canvas.drawText(s, w - txt.measureText(s) - 4f, h - 6f, txt)
                  canvas.drawText("most common bin: " + mx, 4f, 24f, txt)
              }
          }
          EOF

          cat > android/app/src/main/java/com/ethusd/patternlab/DataStore.kt <<'EOF'
          package com.ethusd.patternlab

          import android.content.Context
          import org.json.JSONObject
          import java.io.BufferedInputStream
          import java.io.BufferedOutputStream
          import java.io.DataInputStream
          import java.io.DataOutputStream
          import java.io.File
          import java.io.FileInputStream
          import java.io.FileOutputStream
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.concurrent.ExecutionException
          import java.util.concurrent.Executors
          import java.util.concurrent.atomic.AtomicInteger
          import kotlin.math.min

          class Candles(
              val times: LongArray,
              val closes: DoubleArray,
              val coveredFrom: Long,
              val capped: Boolean = false
          )

          object DataStore {

              private const val MAX_BARS = 330000L
              private const val CHUNK = 1990L

              private fun http(url: String): String {
                  val c = URL(url).openConnection() as HttpURLConnection
                  c.connectTimeout = 15000
                  c.readTimeout = 30000
                  c.setRequestProperty("Accept", "application/json")
                  c.setRequestProperty("User-Agent", "EthusdPatternLab/0.4")
                  try {
                      return c.inputStream.bufferedReader().readText()
                  } finally {
                      c.disconnect()
                  }
              }

              fun getJson(path: String): JSONObject = JSONObject(http(BuildConfig.API_BASE + path))

              private fun fetchChunk(sym: String, res: String, start: Long, end: Long): Pair<LongArray, DoubleArray> {
                  val path = "/v2/history/candles?resolution=" + res + "&symbol=" + sym +
                      "&start=" + start + "&end=" + end
                  var lastErr: Exception? = null
                  for (attempt in 1..3) {
                      try {
                          val arr = getJson(path).getJSONArray("result")
                          val pairs = ArrayList<Pair<Long, Double>>()
                          for (i in 0 until arr.length()) {
                              val o = arr.getJSONObject(i)
                              val cl = o.optDouble("close")
                              if (!cl.isNaN()) pairs.add(Pair(o.optLong("time"), cl))
                          }
                          pairs.sortBy { it.first }
                          return Pair(
                              LongArray(pairs.size) { pairs[it].first },
                              DoubleArray(pairs.size) { pairs[it].second }
                          )
                      } catch (e: Exception) {
                          lastErr = e
                          Thread.sleep(500L * attempt)
                      }
                  }
                  throw (lastErr ?: RuntimeException("fetch failed"))
              }

              private fun concat(parts: List<Pair<LongArray, DoubleArray>>): Pair<LongArray, DoubleArray> {
                  var total = 0
                  for (p in parts) total += p.first.size
                  val t = LongArray(total)
                  val c = DoubleArray(total)
                  var k = 0
                  var lastT = Long.MIN_VALUE
                  for (p in parts) {
                      for (i in p.first.indices) {
                          if (p.first[i] > lastT) {
                              t[k] = p.first[i]
                              c[k] = p.second[i]
                              lastT = p.first[i]
                              k++
                          }
                      }
                  }
                  return Pair(t.copyOf(k), c.copyOf(k))
              }

              private fun fetchRange( sym: String, res: String, tfSec: Long, start: Long, end: Long, progress: (Int, Int) -> Unit ): Pair<LongArray, DoubleArray> {
                  if (end <= start) return Pair(LongArray(0), DoubleArray(0))
                  val span = CHUNK * tfSec
                  val ranges = ArrayList<LongArray>()
                  var s = start
                  while (s < end) {
                      val e = min(s + span, end)
                      ranges.add(longArrayOf(s, e))
                      if (e >= end) break
                      s = e
                  }
                  val results = arrayOfNulls<Pair<LongArray, DoubleArray>>(ranges.size)
                  val done = AtomicInteger(0)
                  val pool = Executors.newFixedThreadPool(3)
                  try {
                      val futures = ranges.mapIndexed { i, r ->
                          pool.submit(Runnable {
                              results[i] = fetchChunk(sym, res, r[0], r[1])
                              progress(done.incrementAndGet(), ranges.size)
                          })
                      }
                      for (f in futures) {
                          try {
                              f.get()
                          } catch (ex: ExecutionException) {
                              throw (ex.cause ?: ex)
                          }
                      }
                  } finally {
                      pool.shutdownNow()
                  }
                  return concat(results.map { it ?: Pair(LongArray(0), DoubleArray(0)) })
              }

              private fun cacheFile(ctx: Context, sym: String, res: String): File =
                  File(ctx.filesDir, "cache_" + sym.replace(Regex("[^A-Za-z0-9]"), "") + "_" + res + ".bin")

              private fun load(ctx: Context, sym: String, res: String): Candles? {
                  val f = cacheFile(ctx, sym, res)
                  if (!f.exists()) return null
                  try {
                      DataInputStream(BufferedInputStream(FileInputStream(f))).use { d ->
                          val cov = d.readLong()
                          val n = d.readInt()
                          val t = LongArray(n)
                          val c = DoubleArray(n)
                          for (i in 0 until n) t[i] = d.readLong()
                          for (i in 0 until n) c[i] = d.readDouble()
                          return Candles(t, c, cov)
                      }
                  } catch (e: Exception) {
                      return null
                  }
              }

              private fun save(ctx: Context, sym: String, res: String, cov: Long, t: LongArray, c: DoubleArray) {
                  try {
                      DataOutputStream(BufferedOutputStream(FileOutputStream(cacheFile(ctx, sym, res)))).use { d ->
                          d.writeLong(cov)
                          d.writeInt(t.size)
                          for (v in t) d.writeLong(v)
                          for (v in c) d.writeDouble(v)
                      }
                  } catch (e: Exception) {
                  }
              }

              fun sync( ctx: Context, sym: String, res: String, tfSec: Long, days: Int, known: Candles?, progress: (Int, Int) -> Unit ): Candles {
                  val now = System.currentTimeMillis() / 1000
                  var need = now - days * 86400L
                  val capStart = now - MAX_BARS * tfSec
                  val capped = need < capStart
                  if (capped) need = capStart

                  val cache = known ?: load(ctx, sym, res)
                  val parts = ArrayList<Pair<LongArray, DoubleArray>>()
                  var covered = need
                  var changed = false

                  if (cache == null || cache.times.isEmpty()) {
                      parts.add(fetchRange(sym, res, tfSec, need, now, progress))
                      changed = true
                  } else {
                      val first = cache.times[0]
                      val last = cache.times[cache.times.size - 1]
                      covered = cache.coveredFrom
                      if (need < cache.coveredFrom - tfSec) {
                          parts.add(fetchRange(sym, res, tfSec, need, first, progress))
                          covered = need
                          changed = true
                      }
                      parts.add(Pair(cache.times, cache.closes))
                      if (now - last >= 2 * tfSec) {
                          parts.add(fetchRange(sym, res, tfSec, last, now, progress))
                          changed = true
                      }
                  }

                  val merged = concat(parts)
                  var n = merged.first.size
                  while (n > 0 && merged.first[n - 1] + tfSec > now) n--
                  val t = merged.first.copyOf(n)
                  val c = merged.second.copyOf(n)
                  if (changed) save(ctx, sym, res, covered, t, c)

                  var from = 0
                  while (from < n && t[from] < need) from++
                  val cov = if (from > 0) need else covered
                  return Candles(t.copyOfRange(from, n), c.copyOfRange(from, n), cov, capped)
              }
          }
          EOF

          cat > android/app/src/main/java/com/ethusd/patternlab/LiveEngine.kt <<'EOF'
          package com.ethusd.patternlab

          import android.content.Context
          import java.util.concurrent.CopyOnWriteArrayList
          import java.util.concurrent.locks.LockSupport
          import kotlin.math.max

          class Ticker(
              val last: Double,
              val open: Double,
              val high: Double,
              val low: Double,
              val mark: Double,
              val volume: Double,
              val funding: Double,
              val oi: Double
          )

          class Snapshot(
              val settings: AppSettings,
              val result: Result,
              val cur: DoubleArray,
              val first: Long,
              val lastBar: Long,
              val bars: Int,
              val capped: Boolean,
              val price: Double,
              val relaxed: Boolean,
              val secs: Double,
              val stampMs: Long
          )

          object LiveEngine {

              @Volatile var snapshot: Snapshot? = null
              @Volatile var ticker: Ticker? = null
              @Volatile var status: String = "Starting..."
              @Volatile var progress: Int = -1
              @Volatile var uiVisible: Boolean = false

              private val listeners = CopyOnWriteArrayList<() -> Unit>()
              @Volatile private var cfg: AppSettings? = null
              @Volatile private var dirty = true
              @Volatile private var running = false
              @Volatile private var gen = 0
              private var worker: Thread? = null

              fun addListener(l: () -> Unit) {
                  if (!listeners.contains(l)) listeners.add(l)
              }

              fun removeListener(l: () -> Unit) {
                  listeners.remove(l)
              }

              private fun fire() {
                  for (l in listeners) {
                      try {
                          l()
                      } catch (e: Exception) {
                      }
                  }
              }

              private fun wake() {
                  val t = worker
                  if (t != null) LockSupport.unpark(t)
              }

              @Synchronized
              fun start(ctx: Context, s: AppSettings) {
                  val old = cfg
                  cfg = s
                  if (old == null || !old.sameSearch(s)) dirty = true
                  if (running) {
                      wake()
                      return
                  }
                  running = true
                  gen++
                  val myGen = gen
                  val app = ctx.applicationContext
                  val t = Thread { loop(app, myGen) }
                  t.isDaemon = true
                  worker = t
                  t.start()
              }

              @Synchronized
              fun stop() {
                  running = false
                  wake()
              }

              fun forceRun() {
                  dirty = true
                  wake()
              }

              private fun readTicker(sym: String): Ticker {
                  val root = try {
                      DataStore.getJson("/v2/tickers/" + sym)
                  } catch (e: java.io.FileNotFoundException) {
                      throw RuntimeException("Symbol not found on Delta India: " + sym)
                  }
                  val t = root.optJSONObject("result")
                      ?: throw RuntimeException("No data for symbol " + sym + ". Check the symbol name.")
                  return Ticker(
                      t.optDouble("close"), t.optDouble("open"), t.optDouble("high"), t.optDouble("low"),
                      t.optDouble("mark_price"), t.optDouble("volume"), t.optDouble("funding_rate"), t.optDouble("oi")
                  )
              }

              private fun loop(app: Context, myGen: Int) {
                  var data: Candles? = null
                  var dataKey = ""
                  var lastRunMs = 0L
                  var lastRunPrice = Double.NaN

                  while (running && myGen == gen) {
                      val s = cfg ?: break
                      val force = dirty
                      if (force) dirty = false
                      try {
                          val tfSec = Cfg.tfSecs[s.tfIdx]
                          val res = Cfg.tfNames[s.tfIdx]

                          // 1. live price (every loop, about every 2 seconds)
                          val t = readTicker(s.symbol)
                          ticker = t
                          val live = if (!t.last.isNaN() && t.last > 0.0) t.last else t.mark
                          fire()

                          // 2. history: download once, keep on phone, then only fetch new bars
                          val key = s.key()
                          val nowSec = System.currentTimeMillis() / 1000
                          val d0 = data
                          val keyChanged = d0 == null || key != dataKey
                          var newData = false
                          if (keyChanged || nowSec - d0!!.times[d0.times.size - 1] >= 2 * tfSec) {
                              if (keyChanged) {
                                  progress = 0
                                  status = "Step 1/3 路 Loading history (saved on phone after first download)..."
                                  fire()
                              }
                              val known = if (keyChanged) null else d0
                              val c = DataStore.sync(app, s.symbol, res, tfSec, s.days, known) { done, total ->
                                  if (keyChanged) {
                                      progress = done * 60 / max(total, 1)
                                      status = "Step 1/3 路 Downloading history: request " + done + " of " + total
                                      fire()
                                  }
                              }
                              if (c.closes.size < 10) throw RuntimeException("No candles returned for " + res + " " + s.symbol)
                              data = c
                              dataKey = key
                              newData = true
                          }
                          val dd = data ?: throw RuntimeException("No data")

                          // 3. matching on the in-memory data + the live (forming) candle
                          val nowMs = System.currentTimeMillis()
                          val moved = lastRunPrice.isNaN() || live != lastRunPrice
                          if (force || newData || (moved && nowMs - lastRunMs >= 5000L)) {
                              val n = dd.closes.size
                              if (n < s.win * 3 + s.hor) {
                                  throw RuntimeException(
                                      "Only " + n + " candles available. Use more history days or a shorter pattern / look-ahead."
                                  )
                              }
                              val barStart = (nowSec / tfSec) * tfSec
                              val cl = DoubleArray(n + 1)
                              System.arraycopy(dd.closes, 0, cl, 0, n)
                              cl[n] = live
                              val tm = LongArray(n + 1)
                              System.arraycopy(dd.times, 0, tm, 0, n)
                              tm[n] = barStart

                              val showProg = force || keyChanged
                              val mc = Cfg.corrValues[s.corrIdx]
                              val topN = Cfg.topValues[s.topIdx]
                              val t0 = System.currentTimeMillis()
                              if (showProg) {
                                  progress = 60
                                  status = "Step 2/3 路 Sliding the pattern across all history..."
                                  fire()
                              }
                              var r = PatternEngine.find(cl, tm, s.win, s.hor, mc, s.volFilter, topN) { p ->
                                  if (showProg) {
                                      progress = 60 + p * 35 / 100
                                      status = "Step 2/3 路 Scanning history: " + p + "%"
                                      fire()
                                  }
                              }
                              var relaxed = false
                              if (r.count == 0 && s.volFilter) {
                                  relaxed = true
                                  r = PatternEngine.find(cl, tm, s.win, s.hor, mc, false, topN) { p ->
                                      if (showProg) {
                                          progress = 60 + p * 35 / 100
                                          status = "Step 2/3 路 Re-scanning without volatility filter: " + p + "%"
                                          fire()
                                      }
                                  }
                              }
                              val secs = (System.currentTimeMillis() - t0) / 1000.0
                              val cur = cl.copyOfRange(cl.size - s.win, cl.size)
                              snapshot = Snapshot(
                                  s, r, cur, dd.times[0], dd.times[dd.times.size - 1], n, dd.capped,
                                  live, relaxed, secs, System.currentTimeMillis()
                              )
                              progress = -1
                              status = "Live"
                              lastRunMs = System.currentTimeMillis()
                              lastRunPrice = live
                              fire()
                          }
                      } catch (e: Throwable) {
                          if (force) dirty = true
                          progress = -1
                          status = "Error: " + (e.message ?: e.javaClass.simpleName) + " (retrying)"
                          fire()
                          LockSupport.parkNanos(6_000_000_000L)
                          continue
                      }
                      if (!dirty) LockSupport.parkNanos(2_000_000_000L)
                  }
              }
          }
