          PAYLOAD
          base64 -d /tmp/project.b64 > /tmp/project.zip
          rm -rf app build.gradle.kts settings.gradle.kts gradle.properties README.md LICENSE V3.5_NOTES.md
          unzip -q /tmp/project.zip -d /tmp/project
          cp -R /tmp/project/app ./app
          cp /tmp/project/build.gradle.kts ./build.gradle.kts
          cp /tmp/project/settings.gradle.kts ./settings.gradle.kts
          cp /tmp/project/gradle.properties ./gradle.properties
          cp /tmp/project/README.md ./README.md
          cp /tmp/project/LICENSE ./LICENSE
          cp /tmp/project/V3.5_NOTES.md ./V3.5_NOTES.md
          rm -rf .github
          mkdir -p .github/workflows
          cp /tmp/project/.github/workflows/build-apk.yml .github/workflows/build-apk.yml

      - name: Validate project payload
        shell: bash
        run: |
          test -f app/src/main/java/com/cryptoalertengine/service/MonitoringService.kt
          test -f app/src/main/java/com/cryptoalertengine/service/MonitoringBootReceiver.kt
          ! grep -R "liveTradeCandles\|list.add(merged)" -n app/src/main/java
          grep -q "isMonitoringEnabled" app/src/main/java/com/cryptoalertengine/data/ConfigStore.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test and build APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CryptoAlertEngine-V3.5.1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: CryptoAlertEngine-V3.5.1-source
          path: .
          retention-days: 14
