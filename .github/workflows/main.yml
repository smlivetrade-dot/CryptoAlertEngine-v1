              ],
              'app/src/main/java/com/cryptoalertengine/trading/TradingLedgerStore.kt': [
                  'fun claimEntryBar',
                  'prefs.edit().putString(KEY, gson.toJson(states)).commit()',
                  'loadCorrupt',
                  'Stored EMA protection is empty or invalid',
                  'TradingRules.isNewEntryBar(previous, barTime)',
                  'LAST_ENTRY_BARS_KEY',
              ],
              'app/src/main/java/com/cryptoalertengine/trading/TradingModels.kt': [
                  'val entryClientOrderId: String?',
                  'val reduceOnly: Boolean = false',
              ],
              'app/src/main/java/com/cryptoalertengine/data/LiveState.kt': [
                  'Channel<AlertEvent>(Channel.UNLIMITED)',
                  'fun emitMarketEvent(event: AlertEvent)',
                  'marketEventChannel.trySend(event)',
              ],
              'app/src/main/java/com/cryptoalertengine/engine/AlertEngine.kt': [
                  'val notify = notificationEnabled && alertedThisBar.isEmpty()',
                  'notificationEnabled: Boolean = true',
                  'notificationEligible = notify',
                  'if (touch("fast", s.emaFast))',
                  'if (touch("slow", s.emaSlow))',
                  'if (confirmedTrend == Trend.BUY)',
                  'if (confirmedTrend == Trend.SELL)',
              ],
          }
          for rel, needles in checks.items():
              p = Path(rel)
              if not p.is_file():
                  raise SystemExit(f'Missing required source file: {rel}')
              s = p.read_text(encoding='utf-8')
              for needle in needles:
                  if needle not in s:
                      raise SystemExit(f'Missing invariant: {needle!r} in {rel}')
          main = Path('app/src/main/java/com/cryptoalertengine/MainActivity.kt').read_text(encoding='utf-8')
          for forbidden in ('ORDER BOOK', '"ASK"', '"BID"'):
              if forbidden in main:
                  raise SystemExit(f'Forbidden order-book UI marker found: {forbidden!r}')
          alert = Path('app/src/main/java/com/cryptoalertengine/engine/AlertEngine.kt').read_text(encoding='utf-8')
          if 'config.atrFilterEnabled' in alert and 'atrFilterThreshold' in alert:
              raise SystemExit('ATR entry filter leaked into AlertEngine')
          trading = Path('app/src/main/java/com/cryptoalertengine/service/TradingService.kt').read_text(encoding='utf-8')
          if 'privateConnectionGeneration' not in trading:
              raise SystemExit('Missing private WebSocket generation guard')
          if 'DROP_OLDEST' in Path('app/src/main/java/com/cryptoalertengine/data/LiveState.kt').read_text(encoding='utf-8'):
              raise SystemExit('Trading market-event stream must not use DROP_OLDEST')
          if 'order_not_found' not in trading:
              raise SystemExit('Missing Delta order_not_found handling')
          if 'validateExistingOrder' not in trading:
              raise SystemExit('Missing existing-order identity validation')
          for marker in ('ENTRY BLOCKED (NOT QUEUED)', 'fresh signal required after reconciliation'):
              if marker not in trading:
                  raise SystemExit(f'Missing unmanaged-position queue guard: {marker}')
          if 'ENTRY QUEUED: exchange position=' in trading:
              raise SystemExit('Unattributed exchange exposure must not queue/replay entry events')
          for marker in ('lastPrice - buffer', 'lastPrice + buffer', 'passivePrice = if (side == "sell") price + buffer else price - buffer', 'market = config.emaTpMarketEnabled', 'old.tpMarket == config.emaTpMarketEnabled'):
              if marker not in trading:
                  raise SystemExit(f'Missing passive-limit / TP-mode invariant: {marker}')
          api = Path('app/src/main/java/com/cryptoalertengine/trading/DeltaTradingApi.kt').read_text(encoding='utf-8')
          if 'addProperty("post_only", true)' not in api:
              raise SystemExit('Limit orders must be post-only to avoid accidental taker execution')
          if 'if (market) "market_order" else "limit_order"' not in api:
              raise SystemExit('Missing selectable TP market/limit order type')
          if 'EMA Fast + Slow share one SL/TP pair' not in Path('app/src/main/java/com/cryptoalertengine/MainActivity.kt').read_text(encoding='utf-8'):
              raise SystemExit('Missing EMA combined protection settings explanation')
          trading = Path('app/src/main/java/com/cryptoalertengine/service/TradingService.kt').read_text(encoding='utf-8')
          if 'TradingRules.isSignalFresh(event.timestamp' not in trading:
              raise SystemExit('Missing fresh-signal guard for delayed trading events')
          if 'pendingMarketEvents' in trading or 'queuedReplay' in trading:
              raise SystemExit('Unsafe delayed market-event replay still exists')
          for marker in ('if (touch("fast", s.emaFast))', 'if (touch("slow", s.emaSlow))', 'if (confirmedTrend == Trend.BUY)', 'if (confirmedTrend == Trend.SELL)'):
              if marker not in alert:
                  raise SystemExit(f'Missing notification-independent trading event marker: {marker}')
          print('Continuous event/ATR/notification invariants passed.')
          if not Path('app/src/test/java/com/cryptoalertengine/trading/DeltaTradingApiSignatureTest.kt').is_file():
              raise SystemExit('Missing DeltaTradingApiSignatureTest.kt')
          if 'atrThresholdDoesNotBlockAlerts' not in Path('app/src/test/java/com/cryptoalertengine/engine/AlertEngineTest.kt').read_text(encoding='utf-8'):
              raise SystemExit('Missing ATR alert regression test')
          rules_tests = Path('app/src/test/java/com/cryptoalertengine/engine/TradingRulesTest.kt').read_text(encoding='utf-8')
          for marker in ('pendingEntryBlocksEveryOtherStrategyUntilReconciled', 'fastAndSlowEmaGapFilterIsSymmetricAndUsesBothIndicatorLevels', 'staleSignalsCannotBeReplayedAfterWaitingForReconnectOrReconciliation', 'sameStrategyCannotConsumeTheSameCandleTwice', 'partialOpenEntryRemainsPendingUntilTerminalState', 'fastEmaFillUpdatesFastLedgerOnlyWithConfirmedExchangeAverage', 'fillWithUnknownAverageNeverInventsAnEntryPrice'):
              if marker not in rules_tests:
                  raise SystemExit(f'Missing trading safety regression test: {marker}')
          store = Path('app/src/main/java/com/cryptoalertengine/trading/TradingLedgerStore.kt').read_text(encoding='utf-8')
          if 'prefs.edit().putString(KEY, gson.toJson(states)).commit()' not in store:
              raise SystemExit('Ledger writes must synchronously commit before order submission')
          if 'if (!ledgerStore.save(legs.values))' not in trading or 'could not persist $leg order intent; no Delta order was submitted' not in trading:
              raise SystemExit('Entry order must fail closed if durable intent cannot be saved')
          if 'TradingRules.updateEntryLedgerState(' not in trading:
              raise SystemExit('Order fill must pass through the unit-tested strategy ledger transition')
          if 'enqueuePendingMarketEvent' in trading or 'pendingMarketEvents' in trading or 'queuedReplay' in trading:
              raise SystemExit('Entry events must not be replayed after a delay/reconnect')
          if 'TradingRules.isSignalFresh(event.timestamp' not in trading:
              raise SystemExit('Missing stale/future entry-signal rejection')
          print('All V4.3.2 source invariants passed.')
          PY
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Run unit tests and build debug APK
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version
          gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Upload test and build reports on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: CryptoAlertEngine-V4.3.2-continuous-event-build-reports
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: warn

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: CryptoAlertEngine-V4.3.2-continuous-event-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
