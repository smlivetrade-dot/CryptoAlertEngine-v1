name: LiveMarketWallpaper

# Self-contained: this one file writes the whole Android project (source, config.yaml,
# manifest, unit tests) into the runner and builds the APK.
# Put it at .github/workflows/LiveMarketWallpaper.yml (or main.yml), push, then download the
# artifact "LiveMarketWallpaper-debug-apk" from the run page.

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Write project files
        shell: bash
        run: |
          mkdir -p "$(dirname 'app/build.gradle.kts')"
          cat > 'app/build.gradle.kts' <<'LMW_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.lmw.marketwallpaper"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.lmw.marketwallpaper"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0"
              }
              buildTypes {
                  release { isMinifyEnabled = false }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              testOptions { unitTests.isReturnDefaultValues = true }
          }

          dependencies {
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
              testImplementation("junit:junit:4.13.2")
              testImplementation("org.json:json:20240303")
          }
          LMW_EOF
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          cat > 'app/src/main/AndroidManifest.xml' <<'LMW_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-feature android:name="android.software.live_wallpaper" android:required="false" />

              <application
                  android:name=".App"
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".ui.MainActivity"
                      android:exported="true"
                      android:theme="@android:style/Theme.Material.NoActionBar">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".ui.SettingsActivity"
                      android:exported="true"
                      android:theme="@android:style/Theme.Material.NoActionBar" />

                  <service
                      android:name=".wallpaper.MarketWallpaperService"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_WALLPAPER">
                      <intent-filter>
                          <action android:name="android.service.wallpaper.WallpaperService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.service.wallpaper"
                          android:resource="@xml/wallpaper" />
                  </service>
              </application>
          </manifest>
          LMW_EOF
          mkdir -p "$(dirname 'app/src/main/assets/config.yaml')"
          cat > 'app/src/main/assets/config.yaml' <<'LMW_EOF'
          # Live Market Wallpaper - configuration (flat "key: value" YAML).
          # On first run the app copies this file to its private storage and rewrites the
          # values there whenever you change a setting in the app. Missing keys fall back
          # to the values below.

          # Bumped when shipped defaults change; on mismatch the endpoint/symbol keys are reset to the defaults below.
          config_version: 6

          # ---- Market data (Delta Exchange public API, no API key needed) ----
          symbol: ETHUSD
          # Used for the symbol picker only if the live instrument list cannot be loaded.
          fallback_symbols: ETHUSD, BTCUSD
          # Exchange region. "india" = Delta Exchange India (api.india.delta.exchange), "global" = Delta Global
          # (api.delta.exchange). The two have different instruments and prices - pick the one your account uses.
          # Choosing a region in Settings copies that region's three URLs below into rest_base_url / ws_url / ws_fallback_url.
          region: india
          region_options: india, global
          rest_base_url: "https://api.india.delta.exchange"
          ws_url: "wss://public-socket.india.delta.exchange"
          # Tried automatically when the primary socket connects but delivers nothing / keeps failing.
          ws_fallback_url: "wss://socket.india.delta.exchange"
          india_rest_base_url: "https://api.india.delta.exchange"
          india_ws_url: "wss://public-socket.india.delta.exchange"
          india_ws_fallback_url: "wss://socket.india.delta.exchange"
          global_rest_base_url: "https://api.delta.exchange"
          global_ws_url: "wss://socket.delta.exchange"
          global_ws_fallback_url: "wss://public-socket.delta.exchange"
          # Which instruments appear in the symbol picker (options are excluded: there are thousands).
          symbol_contract_types: perpetual_futures, futures
          # trade = candles from last traded price, mark = candles from the mark price (MARK:<symbol>).
          candle_source: trade
          candle_source_options: trade, mark
          http_timeout_s: 10
          # Reconnect backoff (milliseconds) and the silence limit before a socket is declared dead.
          reconnect_min_ms: 1000
          reconnect_max_ms: 30000
          ws_stale_seconds: 30
          # Memory bounds: candles kept in RAM, and how many display-durations of history to load
          # (the extra history is what you can scroll back through in the app).
          max_candles: 1500
          history_multiplier: 3

          # ---- Chart ----
          chart_type: candlestick
          chart_type_options: candlestick, line
          candle_timeframe: 5m
          timeframe_options: 1m, 3m, 5m, 15m, 30m, 1h, 2h, 4h, 1d
          display_duration: 2h
          duration_options: 15m, 30m, 1h, 2h, 4h, 8h, 12h, 24h
          # Empty space kept to the right of the live candle, as a percentage of the visible time span
          # (so the forming candle is never hidden behind the price tag / screen edge). 0 = flush right.
          chart_right_gap_pct: 8

          # ---- Appearance ----
          background_color: "#0B0E11"
          bullish_color: "#26A69A"
          bearish_color: "#EF5350"
          show_grid: true
          show_price_scale: true
          show_time_scale: true

          # ---- ATR (Average True Range, Wilder) ----
          # Recomputed from scratch from closed candles of the chart timeframe every atr_recalc_seconds,
          # so no drift can build up between refreshes. Shown on the dashboard and in the wallpaper title.
          atr_enabled: true
          atr_period: 14
          atr_recalc_seconds: 60

          # ---- Order book (dashboard only; the wallpaper never subscribes to it) ----
          orderbook_enabled: true
          orderbook_levels: 10
          # Also draw the order book on the live wallpaper (portrait: below the chart, landscape: right panel).
          wallpaper_orderbook: true

          # ---- Live wallpaper ----
          wallpaper_enabled: true
          # Minimum milliseconds between wallpaper frames. The wallpaper redraws the moment new data arrives
          # (never on a timer when nothing changed); this only caps the frame rate (33 = about 30 fps).
          wallpaper_redraw_ms: 33
          # Chart area as a percentage of screen height kept clear at the top (e.g. 30 to stay below the
          # lock-screen clock) and at the bottom. 0 = chart fills the whole screen. Landscape always uses the full screen.
          wallpaper_chart_top_pct: 4
          wallpaper_chart_bottom_pct: 0
          LMW_EOF
          mkdir -p "$(dirname 'app/src/main/kotlin/com/lmw/marketwallpaper/App.kt')"
          cat > 'app/src/main/kotlin/com/lmw/marketwallpaper/App.kt' <<'LMW_EOF'
          package com.lmw.marketwallpaper

          import android.app.Application
          import com.lmw.marketwallpaper.config.ConfigStore

          class App : Application() {
              override fun onCreate() {
                  super.onCreate()
                  ConfigStore.init(this)
              }
          }
          LMW_EOF
          mkdir -p "$(dirname 'app/src/main/kotlin/com/lmw/marketwallpaper/chart/CachedChart.kt')"
          cat > 'app/src/main/kotlin/com/lmw/marketwallpaper/chart/CachedChart.kt' <<'LMW_EOF'
          package com.lmw.marketwallpaper.chart

          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.PointF
          import com.lmw.marketwallpaper.config.AppConfig
          import com.lmw.marketwallpaper.data.Candle

          /**
           * Renders the chart with a cached static layer. On a tick only the forming candle, the price line and the
           * crosshair are drawn on top of a bitmap; the bitmap is rebuilt only when the window, size, style, closed
           * history or price scale changes (a new candle period, zoom/pan, or the live candle breaking out of the scale).
           */
          class CachedChart(density: Float) {
              val r = ChartRenderer(density)
              private var bmp: Bitmap? = null
              private var bc: Canvas? = null
              private var lw = 0
              private var lh = 0
              private var lst: ChartStyle? = null
              private var lvs = 0L
              private var lve = 0L
              private var ltf = 0L
              private var lver = -1L
              private var lid = 0
              private var sCfg: AppConfig? = null
              private var sSt: ChartStyle? = null

              /** One ChartStyle per config instance so the cache can compare by identity. */
              fun styleFor(cfg: AppConfig): ChartStyle {
                  if (cfg !== sCfg || sSt == null) { sSt = ChartStyle.from(cfg); sCfg = cfg }
                  return sSt!!
              }

              fun draw(
                  cv: Canvas, w: Int, h: Int, data: List<Candle>, version: Long, storeId: Int, tf: Long, vs: Long, ve: Long,
                  st: ChartStyle, price: Double?, cross: PointF?, title: String?,
              ): Candle? {
                  if (!r.layout(w, h, st)) { cv.drawColor(st.bg); return null }
                  r.setView(vs, ve)
                  val ext = r.extent(data, tf, st)
                  val outside = ext != null && (ext[0] < r.pMin || ext[1] > r.pMax)
                  val same = bmp != null && lw == w && lh == h && lst === st && lvs == vs && lve == ve &&
                      ltf == tf && lver == version && lid == storeId
                  if (!same || outside) {
                      r.setRange(ext, price)
                      val b = bmp
                      if (b == null || b.width != w || b.height != h) {
                          b?.recycle()
                          val nb = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
                          bmp = nb; bc = Canvas(nb)
                      }
                      r.drawStatic(bc!!, data, tf, st)
                      lw = w; lh = h; lst = st; lvs = vs; lve = ve; ltf = tf; lver = version; lid = storeId
                  }
                  cv.drawBitmap(bmp!!, 0f, 0f, null)
                  return r.drawDynamic(cv, w, data, tf, st, price, cross, title)
              }

              fun release() {
                  bmp?.recycle(); bmp = null; bc = null; lst = null
              }
          }
          LMW_EOF
          mkdir -p "$(dirname 'app/src/main/kotlin/com/lmw/marketwallpaper/chart/ChartRenderer.kt')"
          cat > 'app/src/main/kotlin/com/lmw/marketwallpaper/chart/ChartRenderer.kt' <<'LMW_EOF'
          package com.lmw.marketwallpaper.chart

          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.DashPathEffect
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.PointF
          import android.graphics.RectF
          import android.graphics.Typeface
          import com.lmw.marketwallpaper.config.AppConfig
          import com.lmw.marketwallpaper.data.Candle
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import java.util.TimeZone
          import kotlin.math.abs
          import kotlin.math.ceil
          import kotlin.math.floor
          import kotlin.math.log10
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.pow

          /** Pure chart calculations (no Android types) so they can be unit tested. */
          object ChartMath {
              /**
               * Right edge of the fixed rolling window: the end of the candle that is forming now.
               * It moves forward exactly one timeframe at a time, so the latest candle always sits at the
               * extreme right and the window never "scrolls" continuously.
               */
              fun windowEnd(nowSec: Long, tf: Long): Long = nowSec - Math.floorMod(nowSec, tf) + tf

              fun niceStep(range: Double, target: Int): Double {
                  val raw = range / target
                  val mag = 10.0.pow(floor(log10(raw)))
                  val f = raw / mag
                  val n = when {
                      f < 1.5 -> 1.0
                      f < 3.0 -> 2.0
                      f < 7.0 -> 5.0
                      else -> 10.0
                  }
                  return n * mag
              }

              fun formatPrice(p: Double): String = when {
                  abs(p) >= 1.0 -> String.format(Locale.US, "%,.2f", p)
                  abs(p) >= 0.01 -> String.format(Locale.US, "%.4f", p)
                  else -> String.format(Locale.US, "%.6f", p)
              }
          }

          class ChartStyle(
              val bg: Int,
              val up: Int,
              val down: Int,
              val grid: Boolean,
              val priceScale: Boolean,
              val timeScale: Boolean,
              val candles: Boolean,
          ) {
              companion object {
                  fun from(c: AppConfig) = ChartStyle(
                      Color.parseColor(c.backgroundColor), Color.parseColor(c.bullishColor), Color.parseColor(c.bearishColor),
                      c.showGrid, c.showPriceScale, c.showTimeScale, c.isCandlestick,
                  )
              }
          }

          private val C_GRID = Color.parseColor("#1E222D")
          private val C_AXIS = Color.parseColor("#787B86")
          private val C_TITLE = Color.parseColor("#D1D4DC")
          private val C_CROSS = Color.parseColor("#758696")
          private val C_TAG = Color.parseColor("#363A45")

          /**
           * Draws candlesticks or a line for the time range [viewStart, viewEnd] in two layers:
           *  - static: background, grid, axis labels and every closed candle (redrawn only when something structural changes)
           *  - dynamic: the forming (last) candle, current-price line, crosshair (redrawn on every tick, a handful of draw calls)
           */
          class ChartRenderer(private val density: Float) {
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private val txt = Paint(Paint.ANTI_ALIAS_FLAG)
              private val tfmt = SimpleDateFormat("HH:mm", Locale.US)
              private val dfmt = SimpleDateFormat("dd MMM", Locale.US)
              private val full = SimpleDateFormat("dd MMM HH:mm", Locale.US)
              private val rect = RectF()
              private val path = Path()

              var plotL = 0f; private set
              var plotT = 0f; private set
              var plotR = 0f; private set
              var plotB = 0f; private set
              var viewStart = 0L; private set
              var viewEnd = 1L; private set
              var pMin = 0.0; private set
              var pMax = 1.0; private set
              private var span = 1.0
              private var pw = 0f
              private var ph = 0f

              fun timeAt(x: Float): Long = viewStart + ((x - plotL) / (plotR - plotL) * (viewEnd - viewStart)).toLong()
              fun priceAt(y: Float): Double = pMax - (y - plotT) / (plotB - plotT) * (pMax - pMin)

              private fun yOf(v: Double) = plotT + ((pMax - v) / (pMax - pMin) * ph).toFloat()
              private fun xOf(t: Double) = plotL + ((t - viewStart) / span * pw).toFloat()
              private fun visible(c: Candle, tf: Long) = c.t + tf > viewStart && c.t < viewEnd

              fun layout(w: Int, h: Int, st: ChartStyle): Boolean {
                  val d = density
                  txt.textSize = 11f * d
                  val axisW = if (st.priceScale) txt.measureText("100000.00") + 12f * d else 6f * d
                  plotL = 4f * d; plotT = 8f * d; plotR = w - axisW
                  plotB = h - (if (st.timeScale) 20f * d else 4f * d)
                  pw = plotR - plotL; ph = plotB - plotT
                  return pw > 0f && ph > 0f
              }

              fun setView(vs: Long, ve: Long) { viewStart = vs; viewEnd = ve; span = (ve - vs).toDouble().coerceAtLeast(1.0) }

              /** Exact [low, high] of everything visible (including the forming candle); null if nothing is visible. */
              fun extent(data: List<Candle>, tf: Long, st: ChartStyle): DoubleArray? {
                  var lo = Double.MAX_VALUE
                  var hi = -Double.MAX_VALUE
                  var any = false
                  for (c in data) {
                      if (!visible(c, tf)) continue
                      any = true
                      lo = min(lo, if (st.candles) c.l else c.c)
                      hi = max(hi, if (st.candles) c.h else c.c)
                  }
                  return if (any) doubleArrayOf(lo, hi) else null
              }

              /** Sets the price scale with 8% headroom; the static layer is only rebuilt when a candle leaves this range. */
              fun setRange(ext: DoubleArray?, price: Double?) {
                  val lo: Double
                  val hi: Double
                  if (ext == null) { val q = price ?: 1.0; lo = q * 0.995; hi = q * 1.005 } else { lo = ext[0]; hi = ext[1] }
                  var pad = (hi - lo) * 0.08
                  if (pad <= 0.0) pad = abs(hi) * 0.001 + 1e-9
                  pMin = lo - pad; pMax = hi + pad
              }

              private fun bodyW(tf: Long) = max(1.5f * density, (tf / span * pw * 0.8).toFloat())

              private fun drawCandle(cv: Canvas, c: Candle, tf: Long, st: ChartStyle, bodyW: Float) {
                  val cx = xOf(c.t + tf / 2.0)
                  p.color = if (c.c >= c.o) st.up else st.down
                  p.style = Paint.Style.STROKE; p.strokeWidth = max(1f, density)
                  cv.drawLine(cx, yOf(c.h), cx, yOf(c.l), p)
                  p.style = Paint.Style.FILL
                  val top = yOf(max(c.o, c.c))
                  var bot = yOf(min(c.o, c.c))
                  if (bot - top < 1f) bot = top + 1f
                  cv.drawRect(cx - bodyW / 2, top, cx + bodyW / 2, bot, p)
              }

              /** Static layer: everything that does not change on a tick. Excludes the last candle of [data]. */
              fun drawStatic(cv: Canvas, data: List<Candle>, tf: Long, st: ChartStyle) {
                  val d = density
                  val tz = TimeZone.getDefault()
                  tfmt.timeZone = tz; dfmt.timeZone = tz
                  cv.drawColor(st.bg)
                  txt.textSize = 11f * d; txt.typeface = Typeface.DEFAULT; txt.color = C_AXIS
                  p.style = Paint.Style.STROKE; p.strokeWidth = 1f; p.color = C_GRID

                  val pStep = ChartMath.niceStep(pMax - pMin, 5)
                  var v = ceil(pMin / pStep) * pStep
                  while (v <= pMax) {
                      val y = yOf(v)
                      if (st.grid) cv.drawLine(plotL, y, plotR, y, p)
                      if (st.priceScale) cv.drawText(ChartMath.formatPrice(v), plotR + 6f * d, y + 4f * d, txt)
                      v += pStep
                  }

                  val steps = longArrayOf(60, 300, 900, 1800, 3600, 7200, 14400, 21600, 43200, 86400, 172800)
                  val tStep = steps.firstOrNull { span / it <= 6.0 } ?: steps.last()
                  val tzSec = tz.getOffset(viewStart * 1000) / 1000L
                  var t = ((viewStart + tzSec + tStep - 1) / tStep) * tStep - tzSec
                  while (t <= viewEnd) {
                      val x = xOf(t.toDouble())
                      if (st.grid) cv.drawLine(x, plotT, x, plotB, p)
                      if (st.timeScale) {
                          val s = (if (tStep >= 86400) dfmt else tfmt).format(Date(t * 1000))
                          val tw = txt.measureText(s)
                          if (x + tw / 2 <= plotR + (cv.width - plotR) * 0.5f && x - tw / 2 >= 0f) cv.drawText(s, x - tw / 2, plotB + 15f * d, txt)
                      }
                      t += tStep
                  }

                  if (st.candles && data.size > 1) {
                      cv.save()
                      cv.clipRect(plotL, plotT, plotR, plotB)
                      val bw = bodyW(tf)
                      for (i in 0 until data.size - 1) {
                          val c = data[i]
                          if (visible(c, tf)) drawCandle(cv, c, tf, st, bw)
                      }
                      cv.restore()
                  }
              }

              /** Dynamic layer: forming candle (or the whole line), current price, title, crosshair. Returns the candle under the crosshair. */
              fun drawDynamic(
                  cv: Canvas, w: Int, data: List<Candle>, tf: Long, st: ChartStyle,
                  price: Double?, cross: PointF?, title: String?,
              ): Candle? {
                  val d = density
                  full.timeZone = TimeZone.getDefault()
                  txt.textSize = 11f * d; txt.typeface = Typeface.DEFAULT

                  cv.save()
                  cv.clipRect(plotL, plotT, plotR, plotB)
                  val last = data.lastOrNull()
                  if (st.candles) {
                      if (last != null && visible(last, tf)) drawCandle(cv, last, tf, st, bodyW(tf))
                  } else {
                      path.reset()
                      var first: Candle? = null
                      var lastVis: Candle? = null
                      for (c in data) {
                          if (!visible(c, tf)) continue
                          val x = xOf(c.t + tf / 2.0); val y = yOf(c.c)
                          if (first == null) { first = c; path.moveTo(x, y) } else path.lineTo(x, y)
                          lastVis = c
                      }
                      if (first != null && lastVis != null) {
                          p.style = Paint.Style.STROKE; p.strokeWidth = 1.6f * d
                          p.color = if (lastVis.c >= first.c) st.up else st.down
                          cv.drawPath(path, p)
                      }
                  }

                  var priceY = -1f
                  var priceCol = st.up
                  if (price != null && price >= pMin && price <= pMax) {
                      priceY = yOf(price)
                      priceCol = if (last == null || last.c >= last.o) st.up else st.down
                      p.style = Paint.Style.STROKE; p.strokeWidth = max(1f, d * 0.8f); p.color = priceCol
                      p.pathEffect = DashPathEffect(floatArrayOf(5f * d, 4f * d), 0f)
                      cv.drawLine(plotL, priceY, plotR, priceY, p)
                      p.pathEffect = null
                  }
                  cv.restore()

                  if (priceY >= 0f && price != null && st.priceScale) tag(cv, ChartMath.formatPrice(price), plotR, w.toFloat(), priceY, priceCol, Color.WHITE)

                  if (title != null) {
                      txt.color = C_TITLE; txt.typeface = Typeface.DEFAULT_BOLD; txt.textSize = 14f * d
                      cv.drawText(title, plotL + 6f * d, plotT + 16f * d, txt)
                      txt.typeface = Typeface.DEFAULT; txt.textSize = 11f * d
                  }

                  var found: Candle? = null
                  if (cross != null && cross.x >= plotL && cross.x <= plotR && cross.y >= plotT && cross.y <= plotB) {
                      val tt = timeAt(cross.x)
                      val f = data.firstOrNull { visible(it, tf) && tt >= it.t && tt < it.t + tf }
                      found = f
                      val cx = if (f != null) xOf(f.t + tf / 2.0) else cross.x
                      p.style = Paint.Style.STROKE; p.strokeWidth = max(1f, d * 0.8f); p.color = C_CROSS
                      p.pathEffect = DashPathEffect(floatArrayOf(4f * d, 3f * d), 0f)
                      cv.drawLine(cx, plotT, cx, plotB, p)
                      cv.drawLine(plotL, cross.y, plotR, cross.y, p)
                      p.pathEffect = null
                      if (st.priceScale) tag(cv, ChartMath.formatPrice(priceAt(cross.y)), plotR, w.toFloat(), cross.y, C_TAG, Color.WHITE)
                      if (st.timeScale) {
                          val s = full.format(Date((f?.t ?: tt) * 1000))
                          val tw = txt.measureText(s) + 10f * d
                          val left = (cx - tw / 2).coerceIn(0f, w - tw)
                          rect.set(left, plotB + 2f * d, left + tw, plotB + 18f * d)
                          p.style = Paint.Style.FILL; p.color = C_TAG
                          cv.drawRoundRect(rect, 3f * d, 3f * d, p)
                          txt.color = Color.WHITE
                          cv.drawText(s, left + 5f * d, plotB + 14f * d, txt)
                      }
                  }
                  return found
              }

              private fun tag(cv: Canvas, s: String, l: Float, r: Float, y: Float, bg: Int, fg: Int) {
                  val d = density
                  rect.set(l, y - 8f * d, r, y + 8f * d)
                  p.style = Paint.Style.FILL; p.color = bg
                  cv.drawRect(rect, p)
                  txt.color = fg
                  cv.drawText(s, l + 6f * d, y + 4f * d, txt)
              }
          }
          LMW_EOF
          mkdir -p "$(dirname 'app/src/main/kotlin/com/lmw/marketwallpaper/chart/OrderBookPainter.kt')"
          cat > 'app/src/main/kotlin/com/lmw/marketwallpaper/chart/OrderBookPainter.kt' <<'LMW_EOF'
          package com.lmw.marketwallpaper.chart

          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.RectF
          import android.graphics.Typeface
          import com.lmw.marketwallpaper.config.AppConfig
          import com.lmw.marketwallpaper.data.Level
          import com.lmw.marketwallpaper.data.OrderBook
          import java.util.Locale
          import kotlin.math.max

          /** Draws the top-N order book (bids left, asks right, cumulative depth bars). Shared by the dashboard and the wallpaper. */
          class OrderBookPainter(private val d: Float) {
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private val t = Paint(Paint.ANTI_ALIAS_FLAG)
              private val rect = RectF()
              private var colCfg: AppConfig? = null
              private var bg = 0
              private var up = 0
              private var down = 0
              private var upText = 0
              private var downText = 0
              private var upBar = 0
              private var downBar = 0

              private val muted = Color.parseColor("#9AA0AA")
              private val normal = Color.parseColor("#D1D4DC")

              private fun colors(cfg: AppConfig) {
                  if (cfg === colCfg) return
                  colCfg = cfg
                  bg = Color.parseColor(cfg.backgroundColor)
                  up = Color.parseColor(cfg.bullishColor)
                  down = Color.parseColor(cfg.bearishColor)
                  upText = lighten(up); downText = lighten(down)
                  upBar = withAlpha(up, 50); downBar = withAlpha(down, 50)
              }

              private fun lighten(c: Int): Int = Color.rgb(
                  Color.red(c) + (255 - Color.red(c)) / 5, Color.green(c) + (255 - Color.green(c)) / 5, Color.blue(c) + (255 - Color.blue(c)) / 5)

              private fun withAlpha(c: Int, a: Int) = Color.argb(a, Color.red(c), Color.green(c), Color.blue(c))

              private fun size(v: Double) = when {
                  v >= 1000 -> String.format(Locale.US, "%,.0f", v)
                  v >= 10 -> String.format(Locale.US, "%.1f", v)
                  else -> String.format(Locale.US, "%.2f", v)
              }

              private fun right(cv: Canvas, s: String, x: Float, y: Float) = cv.drawText(s, x - t.measureText(s), y, t)

              private fun cum(l: List<Level>): DoubleArray {
                  var s = 0.0
                  return DoubleArray(l.size) { s += l[it].size; s }
              }

              /** Draws into a (0,0)-(w,h) area of [cv]. [clear] paints the background first (off for the wallpaper). */
              fun draw(cv: Canvas, w: Float, h: Float, book: OrderBook?, cfg: AppConfig, clear: Boolean) {
                  colors(cfg)
                  if (clear) cv.drawColor(bg)
                  val pad = 12f * d
                  t.typeface = Typeface.DEFAULT
                  if (book == null || (book.bids.isEmpty() && book.asks.isEmpty())) {
                      t.color = muted; t.textSize = 12f * d
                      val s = "Waiting for order book\u2026"
                      cv.drawText(s, (w - t.measureText(s)) / 2, h / 2, t)
                      return
                  }

                  var y = 4f * d
                  t.textSize = 12f * d; t.typeface = Typeface.DEFAULT_BOLD; t.color = normal
                  cv.drawText("Order book \u00B7 top ${cfg.orderbookLevels}", pad, y + 13f * d, t)
                  t.typeface = Typeface.DEFAULT; t.color = muted; t.textSize = 11f * d
                  val bb = book.bids.firstOrNull(); val ba = book.asks.firstOrNull()
                  if (bb != null && ba != null) {
                      val spread = ba.price - bb.price
                      val mid = (ba.price + bb.price) / 2
                      right(cv, "Spread ${ChartMath.formatPrice(spread)} (${String.format(Locale.US, "%.3f", spread / mid * 100)}%)", w - pad, y + 13f * d)
                  }
                  y += 22f * d

                  val bt = book.bids.sumOf { it.size }; val at = book.asks.sumOf { it.size }
                  val pct = if (bt + at > 0) bt / (bt + at) else 0.5
                  val bw = w - 2 * pad
                  p.style = Paint.Style.FILL
                  p.color = up; rect.set(pad, y, pad + (bw * pct).toFloat(), y + 6f * d); cv.drawRect(rect, p)
                  p.color = down; rect.set(pad + (bw * pct).toFloat(), y, pad + bw, y + 6f * d); cv.drawRect(rect, p)
                  y += 6f * d + 12f * d
                  t.textSize = 10.5f * d; t.color = muted
                  cv.drawText("Bids ${size(bt)} \u00B7 ${Math.round(pct * 100)}%", pad, y, t)
                  right(cv, "${100 - Math.round(pct * 100)}% \u00B7 ${size(at)} Asks", w - pad, y)
                  y += 8f * d

                  val gap = 6f * d
                  val colW = (w - 2 * pad - gap) / 2
                  val lx = pad; val rx = pad + colW + gap
                  y += 12f * d
                  t.textSize = 10.5f * d
                  cv.drawText("Size", lx + 6f * d, y, t); right(cv, "Bid", lx + colW - 6f * d, y)
                  cv.drawText("Ask", rx + 6f * d, y, t); right(cv, "Size", rx + colW - 6f * d, y)
                  y += 6f * d

                  val n = cfg.orderbookLevels
                  val rowH = ((h - y - 2f * d) / n).coerceIn(12f * d, 26f * d)
                  t.textSize = (rowH * 0.52f).coerceIn(10f * d, 13f * d)
                  val cumB = cum(book.bids); val cumA = cum(book.asks)
                  val mx = max(cumB.lastOrNull() ?: 0.0, cumA.lastOrNull() ?: 0.0).coerceAtLeast(1e-9)
                  for (i in 0 until n) {
                      val top = y + i * rowH
                      val base = top + rowH / 2 + t.textSize * 0.36f
                      book.bids.getOrNull(i)?.let { l ->
                          p.color = upBar
                          rect.set(lx + colW - (cumB[i] / mx * colW).toFloat(), top + 1f, lx + colW, top + rowH - 1f); cv.drawRect(rect, p)
                          t.color = normal; cv.drawText(size(l.size), lx + 6f * d, base, t)
                          t.color = upText; right(cv, ChartMath.formatPrice(l.price), lx + colW - 6f * d, base)
                      }
                      book.asks.getOrNull(i)?.let { l ->
                          p.color = downBar
                          rect.set(rx, top + 1f, rx + (cumA[i] / mx * colW).toFloat(), top + rowH - 1f); cv.drawRect(rect, p)
                          t.color = downText; cv.drawText(ChartMath.formatPrice(l.price), rx + 6f * d, base, t)
                          t.color = normal; right(cv, size(l.size), rx + colW - 6f * d, base)
                      }
                  }
              }
          }
