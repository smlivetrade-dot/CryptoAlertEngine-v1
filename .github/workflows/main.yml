name: Build Crypto Alert Engine V3.6

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Restore V3.6 project
        shell: bash
        env:
          PROJECT_ZIP_B64: 
        run: |
          rm -rf restore.zip project_restore
          echo "$PROJECT_ZIP_B64" | base64 --decode > restore.zip
          unzip -q restore.zip -d project_restore
          cp -a project_restore/. .
          rm -rf project_restore restore.zip

      - name: Validate V3.6 source
        shell: bash
        run: |
          test -f app/src/main/java/com/cryptoalertengine/engine/IncrementalIndicators.kt
          test -f app/src/main/java/com/cryptoalertengine/service/MonitoringService.kt
          test -f app/src/main/java/com/cryptoalertengine/data/Models.kt
          grep -q 'atrFilterEnabled' app/src/main/java/com/cryptoalertengine/data/Models.kt
          grep -q 'autoReconnect30m' app/src/main/java/com/cryptoalertengine/data/Models.kt
          grep -q 'IncrementalIndicatorState' app/src/main/java/com/cryptoalertengine/service/MonitoringService.kt
          grep -q 'schedule30mRefresh' app/src/main/java/com/cryptoalertengine/service/MonitoringService.kt
          if grep -R -n 'liveTradeCandles\|updateLiveTradeCandle\|list.add(merged)' app/src/main/java; then echo 'Old trade-candle logic detected'; exit 1; fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test and build APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CryptoAlertEngine-V3.6-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: CryptoAlertEngine-V3.6-source
          path: .
          retention-days: 14
