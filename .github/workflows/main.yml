name: LiveMarketWallpaper

# Self-contained: this one file writes the whole Android project (source, config.yaml,
# manifest, unit tests) into the runner and builds the APK.
# Put it at .github/workflows/LiveMarketWallpaper.yml, push, then download the artifact
# "LiveMarketWallpaper-debug-apk" from the run page.

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Write project files
        shell: bash
        run: |
          mkdir -p "$(dirname 'app/build.gradle.kts')"
          cat > 'app/build.gradle.kts' <<'LMW_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.lmw.marketwallpaper"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.lmw.marketwallpaper"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0"
              }
              buildTypes {
                  release { isMinifyEnabled = false }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              testOptions { unitTests.isReturnDefaultValues = true }
          }

          dependencies {
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
              testImplementation("junit:junit:4.13.2")
              testImplementation("org.json:json:20240303")
          }
          LMW_EOF
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          cat > 'app/src/main/AndroidManifest.xml' <<'LMW_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-feature android:name="android.software.live_wallpaper" android:required="false" />

              <application
                  android:name=".App"
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".ui.MainActivity"
                      android:exported="true"
                      android:theme="@android:style/Theme.Material.NoActionBar">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".ui.SettingsActivity"
                      android:exported="true"
                      android:theme="@android:style/Theme.Material.NoActionBar" />

                  <service
                      android:name=".wallpaper.MarketWallpaperService"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_WALLPAPER">
                      <intent-filter>
                          <action android:name="android.service.wallpaper.WallpaperService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.service.wallpaper"
                          android:resource="@xml/wallpaper" />
                  </service>
              </application>
          </manifest>
          LMW_EOF
          mkdir -p "$(dirname 'app/src/main/assets/config.yaml')"
          cat > 'app/src/main/assets/config.yaml' <<'LMW_EOF'
          # Live Market Wallpaper - configuration (flat "key: value" YAML).
          # On first run the app copies this file to its private storage and rewrites the
          # values there whenever you change a setting in the app. Missing keys fall back
          # to the values below.

          # ---- Market data (Delta Exchange public API, no API key needed) ----
          symbol: ETHUSD
          # Used for the symbol picker only if the live instrument list cannot be loaded.
          fallback_symbols: ETHUSD, BTCUSD
          # Global exchange. Delta Exchange India accounts use the India hosts instead
          # (check docs.delta.exchange for the current hostnames).
          rest_base_url: "https://api.delta.exchange"
          ws_url: "wss://socket.delta.exchange"
          http_timeout_s: 10
          # Reconnect backoff (milliseconds) and the silence limit before a socket is declared dead.
          reconnect_min_ms: 1000
          reconnect_max_ms: 30000
          ws_stale_seconds: 30
          # Memory bounds: candles kept in RAM, and how many display-durations of history to load
          # (the extra history is what you can scroll back through in the app).
          max_candles: 1500
          history_multiplier: 3

          # ---- Chart ----
          chart_type: candlestick
          chart_type_options: candlestick, line
          candle_timeframe: 5m
          timeframe_options: 1m, 3m, 5m, 15m, 30m, 1h, 2h, 4h, 1d
          display_duration: 2h
          duration_options: 15m, 30m, 1h, 2h, 4h, 8h, 12h, 24h

          # ---- Appearance ----
          background_color: "#0B0E11"
          bullish_color: "#26A69A"
          bearish_color: "#EF5350"
          show_grid: true
          show_price_scale: true
          show_time_scale: true

          # ---- Live wallpaper ----
          wallpaper_enabled: true
          # Minimum milliseconds between wallpaper redraws while the wallpaper is visible.
          wallpaper_redraw_ms: 1000
          # Chart area as a percentage of screen height kept clear at the top (lock-screen clock)
          # and at the bottom (gesture bar / shortcuts).
          wallpaper_chart_top_pct: 30
          wallpaper_chart_bottom_pct: 8
          LMW_EOF
          mkdir -p "$(dirname 'app/src/main/kotlin/com/lmw/marketwallpaper/App.kt')"
          cat > 'app/src/main/kotlin/com/lmw/marketwallpaper/App.kt' <<'LMW_EOF'
          package com.lmw.marketwallpaper

          import android.app.Application
          import com.lmw.marketwallpaper.config.ConfigStore

          class App : Application() {
              override fun onCreate() {
                  super.onCreate()
                  ConfigStore.init(this)
              }
          }
          LMW_EOF
          mkdir -p "$(dirname 'app/src/main/kotlin/com/lmw/marketwallpaper/chart/ChartRenderer.kt')"
          cat > 'app/src/main/kotlin/com/lmw/marketwallpaper/chart/ChartRenderer.kt' <<'LMW_EOF'
          package com.lmw.marketwallpaper.chart

          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.DashPathEffect
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.PointF
          import android.graphics.RectF
          import android.graphics.Typeface
          import com.lmw.marketwallpaper.config.AppConfig
          import com.lmw.marketwallpaper.data.Candle
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import java.util.TimeZone
          import kotlin.math.abs
          import kotlin.math.ceil
          import kotlin.math.floor
          import kotlin.math.log10
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.pow

          /** Pure chart calculations (no Android types) so they can be unit tested. */
          object ChartMath {
              /**
               * Right edge of the fixed rolling window: the end of the candle that is forming now.
               * It moves forward exactly one timeframe at a time, so the latest candle always sits at the
               * extreme right and the window never "scrolls" continuously.
               */
              fun windowEnd(nowSec: Long, tf: Long): Long = nowSec - Math.floorMod(nowSec, tf) + tf

              fun niceStep(range: Double, target: Int): Double {
                  val raw = range / target
                  val mag = 10.0.pow(floor(log10(raw)))
                  val f = raw / mag
                  val n = when {
                      f < 1.5 -> 1.0
                      f < 3.0 -> 2.0
                      f < 7.0 -> 5.0
                      else -> 10.0
                  }
                  return n * mag
              }

              fun formatPrice(p: Double): String = when {
                  abs(p) >= 1.0 -> String.format(Locale.US, "%,.2f", p)
                  abs(p) >= 0.01 -> String.format(Locale.US, "%.4f", p)
                  else -> String.format(Locale.US, "%.6f", p)
              }
          }

          class ChartStyle(
              val bg: Int,
              val up: Int,
              val down: Int,
              val grid: Boolean,
              val priceScale: Boolean,
              val timeScale: Boolean,
              val candles: Boolean,
          ) {
              companion object {
                  fun from(c: AppConfig) = ChartStyle(
                      Color.parseColor(c.backgroundColor), Color.parseColor(c.bullishColor), Color.parseColor(c.bearishColor),
                      c.showGrid, c.showPriceScale, c.showTimeScale, c.isCandlestick,
                  )
              }
          }

          /** Draws candlesticks or a line for the time range [viewStart, viewEnd]. Shared by the app and the wallpaper. */
          class ChartRenderer(private val density: Float) {
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private val txt = Paint(Paint.ANTI_ALIAS_FLAG)
              private val tfmt = SimpleDateFormat("HH:mm", Locale.US)
              private val dfmt = SimpleDateFormat("dd MMM", Locale.US)
              private val full = SimpleDateFormat("dd MMM HH:mm", Locale.US)
              private val rect = RectF()
              private val path = Path()

              var plotL = 0f; private set
              var plotT = 0f; private set
              var plotR = 0f; private set
              var plotB = 0f; private set
              var viewStart = 0L; private set
              var viewEnd = 1L; private set
              var pMin = 0.0; private set
              var pMax = 1.0; private set

              fun timeAt(x: Float): Long = viewStart + ((x - plotL) / (plotR - plotL) * (viewEnd - viewStart)).toLong()
              fun priceAt(y: Float): Double = pMax - (y - plotT) / (plotB - plotT) * (pMax - pMin)

              /** Returns the candle under the crosshair (if any). */
              fun draw(
                  cv: Canvas, w: Int, h: Int, data: List<Candle>, tf: Long, vs: Long, ve: Long,
                  st: ChartStyle, price: Double?, cross: PointF?, title: String?,
              ): Candle? {
                  val d = density
                  val tz = TimeZone.getDefault()
                  tfmt.timeZone = tz; dfmt.timeZone = tz; full.timeZone = tz
                  cv.drawColor(st.bg)
                  txt.textSize = 11f * d
                  txt.typeface = Typeface.DEFAULT
                  val axisW = if (st.priceScale) txt.measureText("100000.00") + 12f * d else 6f * d
                  plotL = 4f * d; plotT = 8f * d; plotR = w - axisW
                  plotB = h - (if (st.timeScale) 20f * d else 4f * d)
                  viewStart = vs; viewEnd = ve
                  val pw = plotR - plotL
                  val ph = plotB - plotT
                  val span = (ve - vs).toDouble()
                  if (pw <= 0f || ph <= 0f || span <= 0.0) return null

                  val vis = data.filter { it.t + tf > vs && it.t < ve }
                  var lo = Double.MAX_VALUE
                  var hi = -Double.MAX_VALUE
                  for (c in vis) {
                      lo = min(lo, if (st.candles) c.l else c.c)
                      hi = max(hi, if (st.candles) c.h else c.c)
                  }
                  if (lo > hi) { val q = price ?: 1.0; lo = q * 0.995; hi = q * 1.005 }
                  var pad = (hi - lo) * 0.08
                  if (pad <= 0.0) pad = abs(hi) * 0.001 + 1e-9
                  pMin = lo - pad; pMax = hi + pad

                  fun yOf(v: Double) = plotT + ((pMax - v) / (pMax - pMin) * ph).toFloat()
                  fun xOf(t: Double) = plotL + ((t - vs) / span * pw).toFloat()

                  val gridColor = Color.parseColor("#1E222D")
                  val axisColor = Color.parseColor("#787B86")
                  p.style = Paint.Style.STROKE; p.strokeWidth = 1f; p.color = gridColor

                  // Price grid + labels
                  val pStep = ChartMath.niceStep(pMax - pMin, 5)
                  var v = ceil(pMin / pStep) * pStep
                  txt.color = axisColor
                  while (v <= pMax) {
                      val y = yOf(v)
                      if (st.grid) cv.drawLine(plotL, y, plotR, y, p)
                      if (st.priceScale) cv.drawText(ChartMath.formatPrice(v), plotR + 6f * d, y + 4f * d, txt)
                      v += pStep
                  }

                  // Time grid + labels (aligned to local time)
                  val steps = longArrayOf(60, 300, 900, 1800, 3600, 7200, 14400, 21600, 43200, 86400, 172800)
                  val tStep = steps.firstOrNull { span / it <= 6.0 } ?: steps.last()
                  val tzSec = tz.getOffset(vs * 1000) / 1000L
                  var t = ((vs + tzSec + tStep - 1) / tStep) * tStep - tzSec
                  while (t <= ve) {
                      val x = xOf(t.toDouble())
                      if (st.grid) cv.drawLine(x, plotT, x, plotB, p)
                      if (st.timeScale) {
                          val s = (if (tStep >= 86400) dfmt else tfmt).format(Date(t * 1000))
                          val tw = txt.measureText(s)
                          if (x + tw / 2 <= plotR + axisW * 0.5f && x - tw / 2 >= 0f) cv.drawText(s, x - tw / 2, plotB + 15f * d, txt)
                      }
                      t += tStep
                  }

                  cv.save()
                  cv.clipRect(plotL, plotT, plotR, plotB)
                  val lastC = vis.lastOrNull()
                  if (st.candles) {
                      val bodyW = max(1f, (tf / span * pw * 0.7).toFloat())
                      for (c in vis) {
                          val cx = xOf(c.t + tf / 2.0)
                          p.color = if (c.c >= c.o) st.up else st.down
                          p.style = Paint.Style.STROKE; p.strokeWidth = max(1f, d)
                          cv.drawLine(cx, yOf(c.h), cx, yOf(c.l), p)
                          p.style = Paint.Style.FILL
                          val top = yOf(max(c.o, c.c))
                          var bot = yOf(min(c.o, c.c))
                          if (bot - top < 1f) bot = top + 1f
                          cv.drawRect(cx - bodyW / 2, top, cx + bodyW / 2, bot, p)
                      }
                  } else if (vis.isNotEmpty()) {
                      path.reset()
                      vis.forEachIndexed { i, c ->
                          val x = xOf(c.t + tf / 2.0); val y = yOf(c.c)
                          if (i == 0) path.moveTo(x, y) else path.lineTo(x, y)
                      }
                      p.style = Paint.Style.STROKE; p.strokeWidth = 1.6f * d
                      p.color = if (vis.last().c >= vis.first().c) st.up else st.down
                      cv.drawPath(path, p)
                  }

                  // Current price line
                  var priceY = -1f
                  var priceCol = st.up
                  if (price != null && price >= pMin && price <= pMax) {
                      priceY = yOf(price)
                      priceCol = if (lastC == null || lastC.c >= lastC.o) st.up else st.down
                      p.style = Paint.Style.STROKE; p.strokeWidth = max(1f, d * 0.8f); p.color = priceCol
                      p.pathEffect = DashPathEffect(floatArrayOf(5f * d, 4f * d), 0f)
                      cv.drawLine(plotL, priceY, plotR, priceY, p)
                      p.pathEffect = null
                  }
                  cv.restore()

                  if (priceY >= 0f && price != null && st.priceScale) tag(cv, ChartMath.formatPrice(price), plotR, w.toFloat(), priceY, priceCol, Color.WHITE)

                  if (title != null) {
                      txt.color = Color.parseColor("#D1D4DC"); txt.typeface = Typeface.DEFAULT_BOLD; txt.textSize = 14f * d
                      cv.drawText(title, plotL + 6f * d, plotT + 16f * d, txt)
                      txt.typeface = Typeface.DEFAULT; txt.textSize = 11f * d
                  }

                  // Crosshair
                  var found: Candle? = null
                  if (cross != null && cross.x >= plotL && cross.x <= plotR && cross.y >= plotT && cross.y <= plotB) {
                      val tt = timeAt(cross.x)
                      val f = vis.firstOrNull { tt >= it.t && tt < it.t + tf }
                      found = f
                      val cx = if (f != null) xOf(f.t + tf / 2.0) else cross.x
                      val ch = Color.parseColor("#758696")
                      p.style = Paint.Style.STROKE; p.strokeWidth = max(1f, d * 0.8f); p.color = ch
                      p.pathEffect = DashPathEffect(floatArrayOf(4f * d, 3f * d), 0f)
                      cv.drawLine(cx, plotT, cx, plotB, p)
                      cv.drawLine(plotL, cross.y, plotR, cross.y, p)
                      p.pathEffect = null
                      val tagBg = Color.parseColor("#363A45")
                      if (st.priceScale) tag(cv, ChartMath.formatPrice(priceAt(cross.y)), plotR, w.toFloat(), cross.y, tagBg, Color.WHITE)
                      if (st.timeScale) {
                          val s = full.format(Date((f?.t ?: tt) * 1000))
                          val tw = txt.measureText(s) + 10f * d
                          val left = (cx - tw / 2).coerceIn(0f, w - tw)
                          rect.set(left, plotB + 2f * d, left + tw, plotB + 18f * d)
                          p.style = Paint.Style.FILL; p.color = tagBg
                          cv.drawRoundRect(rect, 3f * d, 3f * d, p)
                          txt.color = Color.WHITE
                          cv.drawText(s, left + 5f * d, plotB + 14f * d, txt)
                      }
                  }
                  return found
              }

              private fun tag(cv: Canvas, s: String, l: Float, r: Float, y: Float, bg: Int, fg: Int) {
                  val d = density
                  rect.set(l, y - 8f * d, r, y + 8f * d)
                  p.style = Paint.Style.FILL; p.color = bg
                  cv.drawRect(rect, p)
                  txt.color = fg
                  cv.drawText(s, l + 6f * d, y + 4f * d, txt)
              }
          }
          LMW_EOF
          mkdir -p "$(dirname 'app/src/main/kotlin/com/lmw/marketwallpaper/config/AppConfig.kt')"
          cat > 'app/src/main/kotlin/com/lmw/marketwallpaper/config/AppConfig.kt' <<'LMW_EOF'
          package com.lmw.marketwallpaper.config

          import kotlin.properties.ReadWriteProperty
          import kotlin.reflect.KProperty

          /** "5m" -> 300, "2h" -> 7200, "1d" -> 86400. */
          object Dur {
              fun seconds(s: String): Long {
                  val t = s.trim().lowercase()
                  require(t.length >= 2) { "bad duration: $s" }
                  val n = t.dropLast(1).toLong()
                  require(n > 0) { "bad duration: $s" }
                  return when (t.last()) {
                      'm' -> n * 60
                      'h' -> n * 3600
                      'd' -> n * 86400
                      else -> throw IllegalArgumentException("bad duration: $s")
                  }
              }

              fun isValid(s: String) = try { seconds(s); true } catch (e: Exception) { false }
          }

          /** Minimal parser/writer for flat "key: value" YAML (comments, quoted values). */
          object FlatYaml {
              fun parse(text: String): MutableMap<String, String> {
                  val m = LinkedHashMap<String, String>()
                  for (raw in text.lines()) {
                      val line = raw.trim()
                      if (line.isEmpty() || line.startsWith("#")) continue
                      val i = line.indexOf(':')
                      if (i <= 0) continue
                      val k = line.substring(0, i).trim()
                      var v = line.substring(i + 1).trim()
                      if (v.startsWith("\"") || v.startsWith("'")) {
                          val q = v[0]
                          val e = v.indexOf(q, 1)
                          v = if (e > 0) v.substring(1, e) else v.substring(1)
                      } else {
                          val c = v.indexOf(" #")
                          if (c >= 0) v = v.substring(0, c).trim()
                      }
                      m[k] = v
                  }
                  return m
              }

              private fun fmt(v: String) =
                  if (v.startsWith("#") || v.startsWith("http") || v.startsWith("ws") || v.contains(": ")) "\"$v\"" else v

              /** Rewrites [template], keeping its comments and order, with the values from [values]. */
              fun dump(template: String, values: Map<String, String>): String {
                  val seen = HashSet<String>()
                  val sb = StringBuilder()
                  for (raw in template.lines()) {
                      val line = raw.trim()
                      val i = line.indexOf(':')
                      val key = if (line.isNotEmpty() && !line.startsWith("#") && i > 0) line.substring(0, i).trim() else null
                      if (key != null && values.containsKey(key)) {
                          sb.append(key).append(": ").append(fmt(values.getValue(key))).append('\n')
                          seen.add(key)
                      } else sb.append(raw).append('\n')
                  }
                  for ((k, v) in values) if (k !in seen) sb.append(k).append(": ").append(fmt(v)).append('\n')
                  return sb.toString().trimEnd('\n') + "\n"
              }
          }

          private class S(val k: String) : ReadWriteProperty<AppConfig, String> {
              override fun getValue(thisRef: AppConfig, property: KProperty<*>): String = thisRef.m.getValue(k)
              override fun setValue(thisRef: AppConfig, property: KProperty<*>, value: String) { thisRef.m[k] = value }
          }

          private class B(val k: String) : ReadWriteProperty<AppConfig, Boolean> {
              override fun getValue(thisRef: AppConfig, property: KProperty<*>): Boolean = thisRef.m.getValue(k).toBoolean()
              override fun setValue(thisRef: AppConfig, property: KProperty<*>, value: Boolean) { thisRef.m[k] = value.toString() }
          }

          private class I(val k: String) : ReadWriteProperty<AppConfig, Int> {
              override fun getValue(thisRef: AppConfig, property: KProperty<*>): Int = thisRef.m.getValue(k).toInt()
              override fun setValue(thisRef: AppConfig, property: KProperty<*>, value: Int) { thisRef.m[k] = value.toString() }
          }

          class AppConfig(internal val m: MutableMap<String, String>) {
              var symbol by S("symbol")
              var restBaseUrl by S("rest_base_url")
              var wsUrl by S("ws_url")
              var chartType by S("chart_type")
              var candleTimeframe by S("candle_timeframe")
              var displayDuration by S("display_duration")
              var backgroundColor by S("background_color")
              var bullishColor by S("bullish_color")
              var bearishColor by S("bearish_color")
              var showGrid by B("show_grid")
              var showPriceScale by B("show_price_scale")
              var showTimeScale by B("show_time_scale")
              var wallpaperEnabled by B("wallpaper_enabled")
              var httpTimeoutS by I("http_timeout_s")
              var reconnectMinMs by I("reconnect_min_ms")
              var reconnectMaxMs by I("reconnect_max_ms")
              var wsStaleSeconds by I("ws_stale_seconds")
              var maxCandles by I("max_candles")
              var historyMultiplier by I("history_multiplier")
              var wallpaperRedrawMs by I("wallpaper_redraw_ms")
              var wallpaperChartTopPct by I("wallpaper_chart_top_pct")
              var wallpaperChartBottomPct by I("wallpaper_chart_bottom_pct")

              val isCandlestick get() = chartType == "candlestick"
              val timeframeOptions get() = list("timeframe_options")
              val durationOptions get() = list("duration_options")
              val chartTypeOptions get() = list("chart_type_options")
              val fallbackSymbols get() = list("fallback_symbols")
              val tfSeconds get() = Dur.seconds(candleTimeframe)
              val durSeconds get() = Dur.seconds(displayDuration)

              private fun list(k: String) = m.getValue(k).split(",").map { it.trim() }.filter { it.isNotEmpty() }

              fun toMap(): Map<String, String> = LinkedHashMap(m)
              fun copy() = AppConfig(LinkedHashMap(m))

              /** True when a change requires the data engine to reload (not just a redraw). */
              fun dataKeyDiffers(o: AppConfig) =
                  symbol != o.symbol || candleTimeframe != o.candleTimeframe || displayDuration != o.displayDuration ||
                      restBaseUrl != o.restBaseUrl || wsUrl != o.wsUrl || maxCandles != o.maxCandles ||
                      historyMultiplier != o.historyMultiplier
          }
          LMW_EOF
          mkdir -p "$(dirname 'app/src/main/kotlin/com/lmw/marketwallpaper/config/ConfigStore.kt')"
          cat > 'app/src/main/kotlin/com/lmw/marketwallpaper/config/ConfigStore.kt' <<'LMW_EOF'
          package com.lmw.marketwallpaper.config

          import android.content.Context
          import kotlinx.coroutines.channels.BufferOverflow
          import kotlinx.coroutines.flow.MutableSharedFlow
          import java.io.File

          /** Loads config.yaml (defaults from assets, user values from private storage) and persists changes. */
          object ConfigStore {
              private lateinit var file: File
              private lateinit var template: String
              private lateinit var defaults: Map<String, String>

              @Volatile
              lateinit var current: AppConfig
                  private set

              val changes = MutableSharedFlow<AppConfig>(extraBufferCapacity = 1, onBufferOverflow = BufferOverflow.DROP_OLDEST)

              @Synchronized
              fun init(ctx: Context) {
                  if (::file.isInitialized) return
                  val app = ctx.applicationContext
                  template = app.assets.open("config.yaml").bufferedReader().use { it.readText() }
                  defaults = FlatYaml.parse(template)
                  file = File(app.filesDir, "config.yaml")
                  val merged = LinkedHashMap(defaults)
                  if (file.exists()) {
                      try { merged.putAll(FlatYaml.parse(file.readText())) } catch (e: Exception) { /* use defaults */ }
                  }
                  sanitize(merged)
                  current = AppConfig(merged)
                  if (!file.exists()) save(current)
              }

              /** Replaces unparsable values with the shipped defaults so a bad edit cannot crash the app. */
              private fun sanitize(m: MutableMap<String, String>) {
                  for (k in listOf("candle_timeframe", "display_duration")) if (!Dur.isValid(m[k] ?: "")) m[k] = defaults.getValue(k)
                  for (k in listOf("max_candles", "history_multiplier", "http_timeout_s", "reconnect_min_ms", "reconnect_max_ms",
                      "ws_stale_seconds", "wallpaper_redraw_ms", "wallpaper_chart_top_pct", "wallpaper_chart_bottom_pct")) {
                      if (m[k]?.toIntOrNull() == null) m[k] = defaults.getValue(k)
                  }
                  m["max_candles"] = m.getValue("max_candles").toInt().coerceIn(50, 2000).toString()
                  m["history_multiplier"] = m.getValue("history_multiplier").toInt().coerceIn(1, 10).toString()
                  m["wallpaper_redraw_ms"] = m.getValue("wallpaper_redraw_ms").toInt().coerceAtLeast(250).toString()
              }

              @Synchronized
              fun update(block: (AppConfig) -> Unit) {
                  val c = current.copy()
                  block(c)
                  if (c.toMap() == current.toMap()) return
                  current = c
                  save(c)
                  changes.tryEmit(c)
              }

              private fun save(c: AppConfig) {
                  try {
                      val tmp = File(file.parentFile, "config.yaml.tmp")
                      tmp.writeText(FlatYaml.dump(template, c.toMap()))
                      if (!tmp.renameTo(file)) { file.writeText(tmp.readText()); tmp.delete() }
                  } catch (e: Exception) { /* keep running with in-memory config */ }
              }
          }
