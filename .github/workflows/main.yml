      - name: Run unit tests and build debug APK
        shell: bash
        timeout-minutes: 30
        run: |
          set -euo pipefail
          java -version
          gradle --version
          gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Upload test reports if build fails
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: CrossoverEdge-build-reports
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: warn

      - name: Upload Crossover Edge debug APK
        uses: actions/upload-artifact@v7
        with:
          name: CrossoverEdge-1.0.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
