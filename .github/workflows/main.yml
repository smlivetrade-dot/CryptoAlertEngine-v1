name: Build Android APK

# Paste this file as: .github/workflows/build-apk.yml
# Self-contained: the whole Android project is generated inside the workflow.
# Data source: Delta Exchange India PUBLIC API (no API key needed).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      symbol:
        description: "Delta Exchange symbol"
        required: false
        default: "ETHUSD"
      api_base:
        description: "Delta public API base URL"
        required: false
        default: "https://api.india.delta.exchange"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      SYMBOL: ${{ inputs.symbol || 'ETHUSD' }}
      API_BASE: ${{ inputs.api_base || 'https://api.india.delta.exchange' }}

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Android project
        run: |
          set -e
          mkdir -p android/app/src/main/java/com/ethusd/patternlab
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/drawable

          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "EthusdPatternLab"
          include ':app'
          EOF

          cat > android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          cat > android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.ethusd.patternlab'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.ethusd.patternlab'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '0.2.0'

                  buildConfigField "String", "SYMBOL",
                      "\"${project.findProperty('symbol') ?: 'ETHUSD'}\""
                  buildConfigField "String", "API_BASE",
                      "\"${project.findProperty('apiBase') ?: 'https://api.india.delta.exchange'}\""
              }

              buildFeatures {
                  buildConfig true
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > android/app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">ETHUSD Pattern Lab</string>
          </resources>
          EOF

          cat > android/app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.NoActionBar">
                  <item name="android:statusBarColor">#0B1B2B</item>
                  <item name="android:navigationBarColor">#0B1B2B</item>
                  <item name="android:windowBackground">#0B1B2B</item>
              </style>
          </resources>
          EOF

          cat > android/app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#0B1B2B"
                    android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#4CAF50"
                    android:pathData="M16,84 L32,58 L44,70 L58,36 L70,52 L92,20 L92,84 Z" />
              <path android:fillColor="#FFC107"
                    android:pathData="M70,52 L92,20 L92,32 L70,60 Z" />
          </vector>
          EOF

          cat > android/app/src/main/java/com/ethusd/patternlab/ChartView.kt <<'EOF'
          package com.ethusd.patternlab

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Path
          import android.view.View

          class ChartView(context: Context) : View(context) {

              private var data: List<Double> = emptyList()

              private val line = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE
                  strokeWidth = 4f
                  strokeJoin = Paint.Join.ROUND
              }
              private val grid = Paint().apply {
                  color = Color.parseColor("#22FFFFFF")
                  strokeWidth = 1f
              }
              private val label = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.parseColor("#99FFFFFF")
                  textSize = 28f
              }

              fun setData(values: List<Double>) {
                  data = values
                  invalidate()
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  if (data.size < 2) return

                  val min = data.minOrNull() ?: return
                  val max = data.maxOrNull() ?: return
                  val range = if (max - min < 1e-9) 1.0 else max - min

                  val w = width.toFloat()
                  val h = height.toFloat()
                  val padTop = 36f
                  val padBottom = 36f
                  val usable = h - padTop - padBottom

                  for (i in 0..3) {
                      val y = padTop + usable * i / 3f
                      canvas.drawLine(0f, y, w, y, grid)
                  }

                  val path = Path()
                  data.forEachIndexed { i, v ->
                      val x = w * i / (data.size - 1).toFloat()
                      val y = padTop + usable * (1f - ((v - min) / range).toFloat())
                      if (i == 0) path.moveTo(x, y) else path.lineTo(x, y)
                  }

                  line.color = if (data.last() >= data.first())
                      Color.parseColor("#4CAF50") else Color.parseColor("#F44336")
                  canvas.drawPath(path, line)

                  canvas.drawText(String.format("%.2f", max), 8f, padTop - 8f, label)
                  canvas.drawText(String.format("%.2f", min), 8f, h - 8f, label)
              }
          }
          EOF

          cat > android/app/src/main/java/com/ethusd/patternlab/MainActivity.kt <<'EOF'
          package com.ethusd.patternlab

          import android.app.Activity
          import android.graphics.Color
          import android.graphics.Typeface
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.ViewGroup
          import android.widget.LinearLayout
          import android.widget.TextView
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import kotlin.concurrent.thread

          class MainActivity : Activity() {

              private val ui = Handler(Looper.getMainLooper())
              private var running = false

              private lateinit var tvSymbol: TextView
              private lateinit var tvPrice: TextView
              private lateinit var tvChange: TextView
              private lateinit var tvStats: TextView
              private lateinit var tvStatus: TextView
              private lateinit var chart: ChartView

              private val tick = object : Runnable {
                  override fun run() {
                      if (!running) return
                      refresh()
                      ui.postDelayed(this, 10_000)
                  }
              }

              private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()

              private fun text(size: Float, color: String, bold: Boolean = false): TextView =
                  TextView(this).apply {
                      textSize = size
                      setTextColor(Color.parseColor(color))
                      if (bold) setTypeface(typeface, Typeface.BOLD)
                  }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#0B1B2B"))
                      setPadding(dp(16), dp(32), dp(16), dp(16))
                  }

                  tvSymbol = text(16f, "#99FFFFFF", true).also { it.text = BuildConfig.SYMBOL + " · Delta Exchange India" }
                  tvPrice = text(40f, "#FFFFFF", true).also { it.text = "--" }
                  tvChange = text(16f, "#FFFFFF").also { it.text = "" }
                  tvStats = text(14f, "#CCFFFFFF").also { it.setPadding(0, dp(12), 0, dp(12)) }
                  chart = ChartView(this)
                  tvStatus = text(12f, "#77FFFFFF").also { it.text = "Loading..." }

                  root.addView(tvSymbol)
                  root.addView(tvPrice)
                  root.addView(tvChange)
                  root.addView(tvStats)
                  root.addView(chart, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f))
                  root.addView(tvStatus)

                  setContentView(root)
              }

              override fun onResume() {
                  super.onResume()
                  running = true
                  ui.post(tick)
              }

              override fun onPause() {
                  super.onPause()
                  running = false
                  ui.removeCallbacks(tick)
              }

              private fun get(path: String): JSONObject {
                  val c = URL(BuildConfig.API_BASE + path).openConnection() as HttpURLConnection
                  c.connectTimeout = 8000
                  c.readTimeout = 8000
                  c.setRequestProperty("Accept", "application/json")
                  c.setRequestProperty("User-Agent", "EthusdPatternLab/0.2")
                  try {
                      return JSONObject(c.inputStream.bufferedReader().readText())
                  } finally {
                      c.disconnect()
                  }
              }

              private fun refresh() {
                  thread {
                      try {
                          val sym = BuildConfig.SYMBOL
                          val t = get("/v2/tickers/" + sym).getJSONObject("result")

                          val end = System.currentTimeMillis() / 1000
                          val start = end - 100L * 3600
                          val arr = get(
                              "/v2/history/candles?resolution=1h&symbol=" + sym +
                                  "&start=" + start + "&end=" + end
                          ).getJSONArray("result")

                          val rows = (0 until arr.length()).map { arr.getJSONObject(it) }
                              .sortedBy { it.optLong("time") }
                          val closes = rows.map { it.optDouble("close") }

                          runOnUiThread { render(t, closes) }
                      } catch (e: Exception) {
                          runOnUiThread {
                              tvStatus.text = "Error: " + (e.message ?: e.javaClass.simpleName)
                          }
                      }
                  }
              }

              private fun fmt(d: Double): String = String.format(Locale.US, "%,.2f", d)

              private fun render(t: JSONObject, closes: List<Double>) {
                  val last = t.optDouble("close")
                  val open = t.optDouble("open")
                  val high = t.optDouble("high")
                  val low = t.optDouble("low")
                  val mark = t.optDouble("mark_price")
                  val vol = t.optDouble("volume")
                  val funding = t.optDouble("funding_rate")
                  val oi = t.optDouble("oi")

                  tvPrice.text = "$" + fmt(last)

                  val pct = if (open > 0) (last - open) / open * 100.0 else 0.0
                  tvChange.text = String.format(Locale.US, "%+.2f%% (24h)", pct)
                  tvChange.setTextColor(Color.parseColor(if (pct >= 0) "#4CAF50" else "#F44336"))

                  tvStats.text =
                      "High " + fmt(high) + " Low " + fmt(low) + "\n" +
                      "Mark " + fmt(mark) + " Open " + fmt(open) + "\n" +
                      "Volume " + fmt(vol) + "\n" +
                      "Funding " + String.format(Locale.US, "%.4f", funding) + " OI " + fmt(oi)

                  chart.setData(closes)
                  tvStatus.text = "1h candles (last " + closes.size + ") · updated " +
                      SimpleDateFormat("HH:mm:ss", Locale.US).format(Date())
              }
          }
          EOF

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon -Psymbol="$SYMBOL" -PapiBase="$API_BASE"

      - name: Show APK
        run: ls -lh android/app/build/outputs/apk/debug/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ethusd-pattern-lab-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
