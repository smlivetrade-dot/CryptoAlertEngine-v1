          package com.lmw.marketwallpaper

          import com.lmw.marketwallpaper.data.AtrCalc
          import com.lmw.marketwallpaper.data.Candle
          import org.junit.Assert.*
          import org.junit.Test

          class AtrCalcTest {
              private fun c(t: Long, h: Double, l: Double, cl: Double) = Candle(t, cl, h, l, cl)

              @Test fun wilderSeedAndSmoothing() {
                  val data = listOf(c(0, 10.0, 8.0, 9.0), c(1, 11.0, 9.0, 10.0), c(2, 12.0, 10.0, 11.0), c(3, 15.0, 11.0, 14.0))
                  // period 2: seed = mean(TR1=2, TR2=2) = 2; then (2*1 + TR3=4)/2 = 3
                  assertEquals(3.0, AtrCalc.wilder(data, 2)!!, 1e-9)
              }

              @Test fun trueRangeUsesGapFromPreviousClose() {
                  val data = listOf(c(0, 10.0, 9.0, 9.5), c(1, 21.0, 20.0, 20.5))   // gap up: TR = 21 - 9.5 = 11.5
                  assertEquals(11.5, AtrCalc.wilder(data, 1)!!, 1e-9)
              }

              @Test fun needsPeriodPlusOneCandles() {
                  assertNull(AtrCalc.wilder(listOf(c(0, 2.0, 1.0, 1.5), c(1, 2.0, 1.0, 1.5)), 2))
              }

              @Test fun recomputingFromScratchIsDeterministic() {
                  val data = (0 until 200).map { c(it.toLong(), 100.0 + it % 7, 98.0 + it % 5, 99.0 + it % 3) }
                  assertEquals(AtrCalc.wilder(data, 14)!!, AtrCalc.wilder(data.toList(), 14)!!, 0.0)
              }
          }
