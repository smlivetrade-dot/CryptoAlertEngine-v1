                      raise SystemExit(f'Missing operational-fix invariant: {needle!r} in {rel}')
          import re
          for rel in ['app/src/main/java/com/cryptoalertengine/service/TradingService.kt', 'app/src/main/java/com/cryptoalertengine/trading/DeltaTradingApi.kt']:
              text = Path(rel).read_text(encoding='utf-8')
              if re.search(r'\.get\("[^"]+"\)\?\.as(String|Int|Double|Boolean)', text):
                  raise SystemExit(f'Raw Gson accessor on nullable Delta JSON found in {rel}; use optString/optInt/optDouble/optBool')
          if 'fun JsonObject.optDouble' not in Path('app/src/main/java/com/cryptoalertengine/trading/JsonSafe.kt').read_text(encoding='utf-8'):
