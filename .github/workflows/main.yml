          package com.lmw.marketwallpaper.data

          import kotlin.math.abs

          data class AtrValue(val value: Double, val atMs: Long)

          object AtrCalc {
              private fun tr(c: Candle, prevClose: Double) = maxOf(c.h - c.l, abs(c.h - prevClose), abs(c.l - prevClose))

              /**
               * Wilder's ATR computed from scratch over [candles] (oldest first, closed candles only):
               * seed = mean of the first [period] true ranges, then ATR = (prev * (period - 1) + TR) / period.
               * Null when there are fewer than period + 1 candles.
               */
              fun wilder(candles: List<Candle>, period: Int): Double? {
                  if (period < 1 || candles.size < period + 1) return null
                  var atr = 0.0
                  for (i in 1..period) atr += tr(candles[i], candles[i - 1].c)
                  atr /= period
                  for (i in period + 1 until candles.size) atr = (atr * (period - 1) + tr(candles[i], candles[i - 1].c)) / period
                  return atr
              }
          }
