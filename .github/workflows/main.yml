          package com.lmw.marketwallpaper

          import com.lmw.marketwallpaper.data.Candle
          import com.lmw.marketwallpaper.data.CandleStore
          import org.junit.Assert.*
          import org.junit.Test

          class CandleStoreTest {
              private fun c(t: Long, p: Double) = Candle(t, p, p + 1, p - 1, p)

              @Test fun noDuplicatesWhenHistoryAndLiveOverlap() {
                  val s = CandleStore(300, 100)
                  s.merge(listOf(c(0, 10.0), c(300, 11.0), c(600, 12.0)), formingStart = 600)
                  s.applyLive(Candle(600, 12.0, 14.0, 11.0, 13.0))
                  s.applyLive(Candle(600, 12.0, 15.0, 11.0, 14.0))
                  s.merge(listOf(c(600, 99.0)), formingStart = 600)          // REST forming candle must not clobber live
                  val snap = s.snapshot()
                  assertEquals(listOf(0L, 300L, 600L), snap.map { it.t })
                  assertEquals(14.0, snap.last().c, 0.0)
              }

              @Test fun timestampsAreAligned() {
                  val s = CandleStore(300, 100)
                  s.applyLive(Candle(7, 1.0, 1.0, 1.0, 1.0))
                  assertEquals(0L, s.snapshot().single().t)
              }

              @Test fun closedHistoryOverridesLiveForClosedCandles() {
                  val s = CandleStore(300, 100)
                  s.applyLive(Candle(0, 1.0, 2.0, 0.5, 1.5))
                  s.merge(listOf(Candle(0, 1.0, 3.0, 0.5, 2.5)), formingStart = 300)
                  assertEquals(2.5, s.snapshot().single().c, 0.0)
              }

              @Test fun staleLiveCandleIsReplacedAfterReconnect() {
                  val s = CandleStore(300, 100)
                  s.applyLive(Candle(600, 1.0, 2.0, 0.5, 1.5))
                  s.markStale()
                  s.merge(listOf(Candle(600, 1.0, 4.0, 0.5, 3.5)), formingStart = 600)
                  assertEquals(3.5, s.snapshot().single().c, 0.0)
              }

              @Test fun identicalTickIsNotAChangeAndForceNoStructuralVersion() {
                  val s = CandleStore(300, 100)
                  s.merge(listOf(c(0, 10.0)), formingStart = 300)
                  val v0 = s.view().version
                  assertTrue(s.applyLive(Candle(300, 1.0, 2.0, 0.5, 1.5)))      // new candle opens: structural
                  val v1 = s.view().version
                  assertTrue(v1 > v0)
                  assertFalse(s.applyLive(Candle(300, 1.0, 2.0, 0.5, 1.5)))     // same data again: nothing to redraw
                  assertTrue(s.applyLive(Candle(300, 1.0, 2.5, 0.5, 1.8)))      // forming candle moves: not structural
                  assertEquals(v1, s.view().version)
              }

              @Test fun memoryIsBounded() {
                  val s = CandleStore(60, 50)
                  s.merge((0 until 500).map { c(it * 60L, 1.0) }, formingStart = 500 * 60L)
                  assertEquals(50, s.size())
                  assertEquals(450 * 60L, s.snapshot().first().t)
              }
          }
