      - name: Verify embedded source
        shell: bash
        run: |
          set -euo pipefail
          test -f app/build.gradle.kts
          test -f app/src/main/java/com/cryptoalertengine/trading/DeltaTradingApi.kt
          test -f app/src/main/java/com/cryptoalertengine/service/TradingService.kt
          grep -q 'versionName = "4.3.1"' app/build.gradle.kts
          grep -q 'inner class PrivateConnection' app/src/main/java/com/cryptoalertengine/trading/DeltaTradingApi.kt
          grep -q 'this@DeltaTradingApi.signedTimestampSeconds()' app/src/main/java/com/cryptoalertengine/trading/DeltaTradingApi.kt
          grep -q 'productId > 0' app/src/main/java/com/cryptoalertengine/trading/DeltaTradingApi.kt
          grep -q 'reduce_only' app/src/main/java/com/cryptoalertengine/trading/DeltaTradingApi.kt
          ! grep -q 'ORDER BOOK' app/src/main/java/com/cryptoalertengine/MainActivity.kt
          ! grep -q '"ASK"' app/src/main/java/com/cryptoalertengine/MainActivity.kt
          ! grep -q '"BID"' app/src/main/java/com/cryptoalertengine/MainActivity.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests and build APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CryptoAlertEngine-V4.3.1-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: CryptoAlertEngine-V4.3.1-source
          path: |
            app/
            build.gradle.kts
            settings.gradle.kts
            gradle.properties
            README.md
            V*.md
            LICENSE
          if-no-files-found: warn
          retention-days: 14
