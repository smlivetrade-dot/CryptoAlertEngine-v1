name: Build LevelFit Android APK

'on':
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Check LevelFit HTML file
        run: test -f LevelFit_Hunter_Ascension_V4_4.html

      - name: Prepare web app folder
        run: mkdir -p www && cp LevelFit_Hunter_Ascension_V4_4.html www/index.html

      - name: Create package.json
        run: node -e "require('fs').writeFileSync('package.json', JSON.stringify({name:'levelfit-android',version:'1.0.0',private:true},null,2))"

      - name: Create Capacitor configuration
        run: node -e "require('fs').writeFileSync('capacitor.config.json', JSON.stringify({appId:'com.levelfit.hunterascension',appName:'LevelFit',webDir:'www'},null,2))"

      - name: Install Capacitor
        run: npm install @capacitor/core@8.6.2 @capacitor/android@8.6.2 @capacitor/cli@8.6.2

      - name: Create Android project
        run: npx cap add android

      - name: Sync web app
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LevelFit-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
