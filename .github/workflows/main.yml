          package com.lmw.marketwallpaper.wallpaper

          import android.graphics.Canvas
          import android.os.Handler
          import android.os.Looper
          import android.os.SystemClock
          import android.service.wallpaper.WallpaperService
          import android.view.SurfaceHolder
          import com.lmw.marketwallpaper.chart.CachedChart
          import com.lmw.marketwallpaper.chart.ChartMath
          import com.lmw.marketwallpaper.chart.OrderBookPainter
          import com.lmw.marketwallpaper.config.ConfigStore
          import com.lmw.marketwallpaper.data.MarketEngine
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.SupervisorJob
          import kotlinx.coroutines.cancel
          import kotlinx.coroutines.launch

          /**
           * Live wallpaper. Event driven: a frame is drawn as soon as a price tick or order-book update arrives (capped by
           * wallpaper_redraw_ms), and nothing is drawn while nothing changes. The data engine only runs while the wallpaper
           * is visible, so no foreground service or battery-optimisation exemption is needed.
           */
          class MarketWallpaperService : WallpaperService() {
              override fun onCreateEngine(): Engine = ChartEngine()

              inner class ChartEngine : Engine() {
                  private val handler = Handler(Looper.getMainLooper())
                  private val density = resources.displayMetrics.density
                  private val chart = CachedChart(density)
                  private val bookPainter = OrderBookPainter(density)
                  private var scope: CoroutineScope? = null
                  private var visible = false
                  private var w = 0
                  private var h = 0
                  private var dirty = true
                  private var lastEnd = 0L
                  private var lastDraw = 0L
                  private var framePending = false

                  private val frame = Runnable { framePending = false; draw() }

                  /** Slow safety tick: only needed so the window advances when a new candle period starts. */
                  private val tick = object : Runnable {
                      override fun run() {
                          draw()
                          if (visible) handler.postDelayed(this, 1000)
                      }
                  }

                  private fun requestFrame() {
                      if (!visible || framePending) return
                      framePending = true
                      val wait = (lastDraw + ConfigStore.current.wallpaperRedrawMs - SystemClock.uptimeMillis()).coerceAtLeast(0L)
                      if (wait == 0L) handler.post(frame) else handler.postDelayed(frame, wait)
                  }

                  override fun onSurfaceChanged(holder: SurfaceHolder, format: Int, width: Int, height: Int) {
                      w = width; h = height; dirty = true; lastEnd = 0L
                      draw()
                  }

                  override fun onSurfaceRedrawNeeded(holder: SurfaceHolder) { dirty = true; draw() }

                  override fun onVisibilityChanged(v: Boolean) {
                      visible = v
                      handler.removeCallbacks(tick); handler.removeCallbacks(frame); framePending = false
                      if (v) {
                          val s = CoroutineScope(SupervisorJob() + Dispatchers.Main)
                          scope = s
                          applyEnabled()
                          s.launch { MarketEngine.updates.collect { dirty = true; requestFrame() } }
                          s.launch { MarketEngine.bookUpdates.collect { dirty = true; requestFrame() } }
                          s.launch { ConfigStore.changes.collect { dirty = true; applyEnabled(); requestFrame() } }
                          dirty = true
                          handler.post(tick)
                      } else {
                          scope?.cancel(); scope = null
                          MarketEngine.setBookWanted(this, false)
                          MarketEngine.release(this)
                      }
                  }

                  override fun onDestroy() {
                      visible = false
                      handler.removeCallbacks(tick); handler.removeCallbacks(frame)
                      scope?.cancel()
                      MarketEngine.setBookWanted(this, false)
                      MarketEngine.release(this)
                      chart.release()
                      super.onDestroy()
                  }

                  /** wallpaper_enabled off = plain background and no network at all. Order book feed only when it is shown. */
                  private fun applyEnabled() {
                      val cfg = ConfigStore.current
                      if (cfg.wallpaperEnabled) MarketEngine.acquire(this) else MarketEngine.release(this)
                      MarketEngine.setBookWanted(this, cfg.wallpaperEnabled && cfg.wallpaperOrderbook)
                  }

                  private fun draw() {
                      if (!visible || w == 0 || h == 0) return
                      val cfg = ConfigStore.current
                      val tf = cfg.tfSeconds
                      val end = ChartMath.windowEnd(MarketEngine.nowSec(), tf)
                      if (!dirty && end == lastEnd) return            // nothing changed: no redraw
                      dirty = false; lastEnd = end; lastDraw = SystemClock.uptimeMillis()

                      val holder = surfaceHolder
                      var cv: Canvas? = null
                      try {
                          cv = (try { holder.lockHardwareCanvas() } catch (e: Exception) { null }) ?: holder.lockCanvas() ?: return
                          val st = chart.styleFor(cfg)
                          cv.drawColor(st.bg)
                          if (!cfg.wallpaperEnabled) return
                          val snap = MarketEngine.snapshot()
                          val ok = snap.tf == tf && snap.symbol == cfg.symbol
                          val data = if (ok) snap.candles else emptyList()
                          val price = if (ok) snap.price else null

                          // Portrait keeps a clear band for the lock-screen clock; landscape (and top=0) uses the full screen.
                          val landscape = w > h
                          val top = if (landscape) 0 else h * cfg.wallpaperChartTopPct / 100
                          val bottom = if (landscape) 0 else h * cfg.wallpaperChartBottomPct / 100
                          val ch = (h - top - bottom).coerceAtLeast(1)
                          val atrNow = if (cfg.atrEnabled) MarketEngine.atr else null
                          val title = "${cfg.symbol} \u00B7 ${cfg.candleTimeframe}" + (if (price != null) "   ${ChartMath.formatPrice(price)}" else "") +
                              (if (atrNow != null) "   ATR ${ChartMath.formatPrice(atrNow.value)}" else "")
                          val gap = cfg.durSeconds * cfg.chartRightGapPct / 100       // breathing room right of the live candle
                          val ve = end + gap
                          val vs = ve - cfg.durSeconds

                          cv.save()
                          cv.translate(0f, top.toFloat())
                          if (!cfg.wallpaperOrderbook) {
                              chart.draw(cv, w, ch, data, snap.version, snap.id, tf, vs, ve, st, price, null, title)
                          } else if (landscape) {
                              val bw = minOf((260 * density).toInt(), w * 2 / 5)
                              chart.draw(cv, w - bw, ch, data, snap.version, snap.id, tf, vs, ve, st, price, null, title)
                              cv.translate((w - bw).toFloat(), 0f)
                              bookPainter.draw(cv, bw.toFloat(), ch.toFloat(), MarketEngine.book, cfg, false)
                          } else {
                              val bh = minOf(((cfg.orderbookLevels * 22 + 96) * density).toInt(), ch / 2)
                              chart.draw(cv, w, ch - bh, data, snap.version, snap.id, tf, vs, ve, st, price, null, title)
                              cv.translate(0f, (ch - bh).toFloat())
                              bookPainter.draw(cv, w.toFloat(), bh.toFloat(), MarketEngine.book, cfg, false)
                          }
                          cv.restore()
                      } catch (e: Exception) {
                          // never crash the launcher process because of a drawing problem
                      } finally {
                          if (cv != null) try { holder.unlockCanvasAndPost(cv) } catch (e: Exception) { }
                      }
                  }
              }
          }
