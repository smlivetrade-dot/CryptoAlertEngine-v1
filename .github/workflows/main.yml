          class TradeTest {
              @Test fun parsesTradesAndIgnoresSnapshotAndAck() {
                  val m = """{"type":"all_trades","symbol":"ETHUSD","price":"2245.55","size":3,"timestamp":1800000012000000}"""
                  val t = TradeParser.parse(m, "ETHUSD")!!
                  assertEquals(2245.55, t.price, 0.0)
