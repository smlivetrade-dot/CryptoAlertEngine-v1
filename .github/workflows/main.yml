      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify complete project
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties
          test -f gradlew
          test -f gradlew.bat
          test -f gradle/wrapper/gradle-wrapper.properties
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/cryptoalertengine/MainActivity.kt
          test -f app/src/main/java/com/cryptoalertengine/service/MonitoringService.kt
          test -f app/src/main/java/com/cryptoalertengine/service/TradingService.kt
          test -f app/src/main/java/com/cryptoalertengine/trading/DeltaTradingApi.kt
          test -f app/src/main/java/com/cryptoalertengine/trading/TradingLedgerStore.kt
          test -f app/src/main/java/com/cryptoalertengine/simulation/SimulationEngine.kt
          test -f app/src/test/java/com/cryptoalertengine/engine/IndicatorsTest.kt
          test -f app/src/test/java/com/cryptoalertengine/engine/AlertEngineTest.kt
          test -f app/src/test/java/com/cryptoalertengine/data/DeltaApiTest.kt
          grep -q 'versionName = "4.3.1"' app/build.gradle.kts
          ! grep -R -q 'ORDER BOOK' app/src/main/java/com/cryptoalertengine
          echo "Project verification PASSED"

      - name: Build and unit test
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CryptoAlertEngine-V4.3.1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload complete source
        uses: actions/upload-artifact@v4
        with:
          name: CryptoAlertEngine-V4.3.1-complete-source
          path: .
          retention-days: 14
