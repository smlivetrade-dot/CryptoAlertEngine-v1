          cat > 'app/src/main/kotlin/com/lmw/marketwallpaper/data/MarketEngine.kt' <<'LMW_EOF'
          package com.lmw.marketwallpaper.data

          import android.os.SystemClock
          import com.lmw.marketwallpaper.config.AppConfig
          import com.lmw.marketwallpaper.config.ConfigStore
          import kotlinx.coroutines.*
          import kotlinx.coroutines.channels.BufferOverflow
          import kotlinx.coroutines.flow.MutableSharedFlow
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import okhttp3.Response
          import okhttp3.WebSocket
          import okhttp3.WebSocketListener
          import java.util.concurrent.TimeUnit
          import java.util.concurrent.atomic.AtomicBoolean
          import java.util.concurrent.atomic.AtomicLong

          object Http {
              val client: OkHttpClient by lazy {
                  val t = ConfigStore.current.httpTimeoutS.toLong()
                  OkHttpClient.Builder()
                      .connectTimeout(t, TimeUnit.SECONDS)
                      .readTimeout(t, TimeUnit.SECONDS)
                      .pingInterval(20, TimeUnit.SECONDS)
                      .build()
              }
          }

          /**
           * Data engine: REST backfill + WebSocket live candle + reconnect. Reference-counted: it only runs
           * (and only uses network/CPU) while the app screen or the wallpaper is visible.
           */
          object MarketEngine {
              data class Snapshot(val symbol: String, val tf: Long, val candles: List<Candle>, val price: Double?, val version: Long, val id: Int)

              private val scope = CoroutineScope(SupervisorJob() + Dispatchers.IO)
              private val owners = HashSet<Any>()
              private var job: Job? = null
              private var running: AppConfig? = null

              @Volatile private var store = CandleStore(300, 1500)
              @Volatile private var symbol = ""
              @Volatile private var offsetMs = 0L
              @Volatile private var wsOffsetKnown = false
              @Volatile private var connected = false
              @Volatile private var lastMsgMs = 0L
              @Volatile private var useFallbackUrl = false

              /** Latest ATR; recomputed from scratch every atr_recalc_seconds (never updated incrementally, so it cannot drift). */
              @Volatile var atr: AtrValue? = null
                  private set
              @Volatile var book: OrderBook? = null
                  private set
              @Volatile private var lastBookMs = 0L
              @Volatile private var lastTradeMs = 0L
              @Volatile private var wantBook = false
              @Volatile private var activeWs: WebSocket? = null
              @Volatile private var lastRestMs = 0L
              @Volatile var lastError: String = ""
                  private set

              /** "LIVE" (socket up, messages flowing), "POLLING" (socket down, REST refresh every few seconds), else "CONNECTING". */
              fun status(): String {
                  val now = SystemClock.elapsedRealtime()
                  return when {
                      connected && now - lastMsgMs < 20_000 -> "LIVE"
                      lastRestMs != 0L && now - lastRestMs < 30_000 -> "POLLING"
                      else -> "CONNECTING"
                  }
              }

              /** Emits whenever candles change (or config changes) so views can redraw. */
              val updates = MutableSharedFlow<Unit>(extraBufferCapacity = 1, onBufferOverflow = BufferOverflow.DROP_OLDEST)

              /** Emits only when the order book actually changed. */
              val bookUpdates = MutableSharedFlow<Unit>(extraBufferCapacity = 1, onBufferOverflow = BufferOverflow.DROP_OLDEST)

              init {
                  scope.launch { ConfigStore.changes.collect { onConfig(it) } }
              }

              /** Current exchange-synchronised time in epoch seconds. */
              fun nowSec(): Long = (System.currentTimeMillis() + offsetMs) / 1000

              fun snapshot(): Snapshot {
                  val st = store
                  val v = st.view()
                  return Snapshot(symbol, st.tf, v.candles, v.candles.lastOrNull()?.c, v.version, System.identityHashCode(st))
              }

              private val bookOwners = HashSet<Any>()

              /** Screens that draw the order book (dashboard, wallpaper) register here; the feed is subscribed while any exists. */
              fun setBookWanted(owner: Any, want: Boolean) {
                  val subscribeNow: Boolean
                  synchronized(bookOwners) {
                      val before = bookOwners.isNotEmpty()
                      if (want) bookOwners.add(owner) else bookOwners.remove(owner)
                      wantBook = bookOwners.isNotEmpty()
                      if (wantBook == before) return
                      subscribeNow = wantBook
                  }
                  val cfg = ConfigStore.current
                  val ws = activeWs ?: return
                  val msg = if (subscribeNow) "subscribe" else "unsubscribe"
                  ws.send("""{"type":"$msg","payload":{"channels":[{"name":"l2_orderbook","symbols":["${cfg.symbol}"]}]}}""")
                  if (!subscribeNow) { book = null; bookUpdates.tryEmit(Unit) }
              }

              @Synchronized
              fun acquire(owner: Any) {
                  owners.add(owner)
                  if (job == null) start()
              }

              @Synchronized
              fun release(owner: Any) {
                  owners.remove(owner)
                  if (owners.isEmpty()) stop()
              }

              @Synchronized
              private fun start() {
                  val cfg = ConfigStore.current
                  running = cfg
                  symbol = cfg.symbol
                  wsOffsetKnown = false
                  connected = false
                  useFallbackUrl = false
                  lastRestMs = 0L
                  lastError = ""
                  book = null
                  atr = null
                  val st = CandleStore(cfg.tfSeconds, cfg.maxCandles)
                  store = st
                  job = scope.launch {
                      launch { atrLoop(cfg, st, DeltaRest(Http.client, cfg.restBaseUrl)) }
                      runLoop(cfg, st)
                  }
              }

              @Synchronized
              private fun stop() {
                  job?.cancel()
                  job = null
              }

              @Synchronized
              private fun onConfig(c: AppConfig) {
                  val r = running
                  if (job != null && r != null && c.dataKeyDiffers(r)) {
                      stop()
                      start()
                  }
                  updates.tryEmit(Unit)
              }

              private suspend fun runLoop(cfg: AppConfig, st: CandleStore) {
                  val rest = DeltaRest(Http.client, cfg.restBaseUrl)
                  var backoff = cfg.reconnectMinMs.toLong()
                  while (currentCoroutineContext().isActive) {
                      var gotData = false
                      try {
                          st.markStale()
                          backfill(cfg, st, rest)
                          gotData = listen(cfg, st, rest)
                      } catch (e: CancellationException) {
                          throw e
                      } catch (e: Exception) {
                          lastError = "${e.javaClass.simpleName}: ${e.message ?: ""}".take(120)
                      }
                      connected = false
                      updates.tryEmit(Unit)
                      // A session that never received any message: try the other endpoint next time.
                      if (!gotData && cfg.wsFallbackUrl.isNotBlank() && cfg.wsFallbackUrl != cfg.wsUrl) useFallbackUrl = !useFallbackUrl
                      backoff = if (gotData) cfg.reconnectMinMs.toLong() else minOf(backoff * 2, cfg.reconnectMaxMs.toLong())
                      // While waiting to reconnect keep the chart fresh with a light REST poll (every 5 s).
                      val until = SystemClock.elapsedRealtime() + backoff
                      while (currentCoroutineContext().isActive && SystemClock.elapsedRealtime() < until) {
                          delay(minOf(5000L, maxOf(250L, until - SystemClock.elapsedRealtime())))
                          pollRest(cfg, st, rest)
                      }
                  }
              }

              /** Refreshes the last few candles (including the forming one) from REST. Never throws. */
              private fun pollRest(cfg: AppConfig, st: CandleStore, rest: DeltaRest) {
                  try {
                      st.markStale()
                      confirmRecent(cfg, st, rest)
                      lastRestMs = SystemClock.elapsedRealtime()
                      lastError = ""
                      pollBook(cfg, rest)
                  } catch (e: CancellationException) {
                      throw e
                  } catch (e: Exception) {
                      lastError = "${e.javaClass.simpleName}: ${e.message ?: ""}".take(120)
                  }
              }

              /** Recomputes ATR from scratch every atr_recalc_seconds (1 REST call per cycle, only while the engine is running). */
              private suspend fun atrLoop(cfg: AppConfig, st: CandleStore, rest: DeltaRest) {
                  if (!cfg.atrEnabled) return
                  while (currentCoroutineContext().isActive) {
                      var waitMs = cfg.atrRecalcSeconds * 1000L
                      try {
                          val tf = st.tf
                          val cur = st.align(nowSec())
                          val need = cfg.atrPeriod * 10 + 1                      // long warm-up so the Wilder seed has negligible weight
                          val r = rest.candles(cfg.dataSymbol, cfg.candleTimeframe, cur - (need + 2) * tf, cur)
                          val v = AtrCalc.wilder(r.candles.filter { it.t < cur }, cfg.atrPeriod)   // closed candles only
                          if (v != null) {
                              atr = AtrValue(v, System.currentTimeMillis())
                              updates.tryEmit(Unit)
                          } else waitMs = 5000
                      } catch (e: CancellationException) {
                          throw e
                      } catch (e: Exception) {
                          waitMs = 5000                                          // retry soon after a network error
                      }
                      delay(waitMs)
                  }
              }

              /** A new candle started: confirm the one that just closed with REST data. */
              private fun confirmLater(cfg: AppConfig, st: CandleStore, rest: DeltaRest) {
                  scope.launch {
                      delay(2000)
                      try { confirmRecent(cfg, st, rest) } catch (e: Exception) { /* next reconnect will heal */ }
                  }
              }

              /** Cheap accessors for the header: no candle-list copy. */
              fun lastCandle(): Candle? = store.last()
              fun matches(cfg: AppConfig): Boolean = symbol == cfg.symbol && store.tf == cfg.tfSeconds

              private fun pollBook(cfg: AppConfig, rest: DeltaRest) {
                  if (!wantBook) return
                  try {
                      val b = rest.orderBook(cfg.symbol, cfg.orderbookLevels)
                      lastBookMs = SystemClock.elapsedRealtime()
                      if (b != book) { book = b; bookUpdates.tryEmit(Unit) }
                  } catch (e: CancellationException) {
                      throw e
                  } catch (e: Exception) { /* keep the last book */ }
              }

              /** Loads closed history plus the forming candle; safe to repeat after every reconnect. */
              private fun backfill(cfg: AppConfig, st: CandleStore, rest: DeltaRest) {
                  val tf = st.tf
                  val now = nowSec()
                  val cur = st.align(now)
                  val span = minOf(cfg.durSeconds * cfg.historyMultiplier, tf * minOf(cfg.maxCandles, 2000))
                  val r = rest.candles(cfg.dataSymbol, cfg.candleTimeframe, cur - span, now)
                  lastRestMs = SystemClock.elapsedRealtime()
                  lastError = ""
                  r.serverOffsetMs?.let { if (!wsOffsetKnown && kotlin.math.abs(it) > 1500) offsetMs = it }
                  st.merge(r.candles, cur)
                  updates.tryEmit(Unit)
              }

              private fun confirmRecent(cfg: AppConfig, st: CandleStore, rest: DeltaRest) {
                  val now = nowSec()
                  val cur = st.align(now)
                  val r = rest.candles(cfg.dataSymbol, cfg.candleTimeframe, cur - 3 * st.tf, now)
                  st.merge(r.candles, cur)
                  updates.tryEmit(Unit)
              }

              /** Runs one WebSocket session. Returns true if any data was received. */
              private suspend fun listen(cfg: AppConfig, st: CandleStore, rest: DeltaRest): Boolean {
                  val channel = "candlestick_${cfg.candleTimeframe}"
                  val closed = CompletableDeferred<Unit>()
                  val lastMsg = AtomicLong(SystemClock.elapsedRealtime())
                  val got = AtomicBoolean(false)
                  val lastCandle = AtomicLong(0L)
                  val bookChannel = if (wantBook) ""","{"name":"l2_orderbook","symbols":["${cfg.symbol}"]}""" else ""
                  // all_trades moves the forming candle on every executed trade (only meaningful for last-price candles).
                  val tradeChannel = if (cfg.candleSource == "trade") ""","{"name":"all_trades","symbols":["${cfg.symbol}"]}""" else ""
                  val subscribe = """{"type":"subscribe","payload":{"channels":[{"name":"$channel","symbols":["${cfg.dataSymbol}"]}$tradeChannel$bookChannel]}}"""

                  val url = if (useFallbackUrl && cfg.wsFallbackUrl.isNotBlank()) cfg.wsFallbackUrl else cfg.wsUrl
                  val ws: WebSocket = Http.client.newWebSocket(Request.Builder().url(url).build(), object : WebSocketListener() {
                      override fun onOpen(webSocket: WebSocket, response: Response) {
                          connected = true
                          activeWs = webSocket
                          lastMsgMs = SystemClock.elapsedRealtime()
                          updates.tryEmit(Unit)
                          webSocket.send(subscribe)
                          webSocket.send("""{"type":"enable_heartbeat"}""")
                      }

                      override fun onMessage(webSocket: WebSocket, text: String) {
                          lastMsg.set(SystemClock.elapsedRealtime())
                          lastMsgMs = lastMsg.get()
                          got.set(true)                       // any message (incl. heartbeat) proves the endpoint works
                          if (text.contains("l2_orderbook")) {
                              BookParser.parse(text, cfg.symbol, cfg.orderbookLevels)?.let {
                                  lastBookMs = SystemClock.elapsedRealtime()
                                  if (it != book) { book = it; bookUpdates.tryEmit(Unit) }
                              }
                              return
                          }
                          if (text.contains("all_trades")) {
                              TradeParser.parse(text, cfg.symbol)?.let { tr ->
                                  lastTradeMs = SystemClock.elapsedRealtime()
                                  lastCandle.set(lastTradeMs)
                                  val prev = st.last()?.t
                                  val ts = tr.tsSec ?: nowSec()
                                  if (st.applyTrade(ts, tr.price)) {
                                      if (prev != null && st.align(ts) > prev) confirmLater(cfg, st, rest)
                                      updates.tryEmit(Unit)
                                  }
                              }
                              return
                          }
                          val live = LiveParser.parse(text, channel, cfg.dataSymbol) ?: return
                          lastCandle.set(SystemClock.elapsedRealtime())
                          live.serverMs?.let { offsetMs = it - System.currentTimeMillis(); wsOffsetKnown = true }
                          val prevLast = st.last()?.t
                          val keep = SystemClock.elapsedRealtime() - lastTradeMs < 3000
                          val changed = st.applyLive(live.candle, keep)
                          if (prevLast != null && st.align(live.candle.t) > prevLast) confirmLater(cfg, st, rest)
                          if (changed) updates.tryEmit(Unit)
                      }

                      override fun onClosed(webSocket: WebSocket, code: Int, reason: String) { closed.complete(Unit) }
                      override fun onFailure(webSocket: WebSocket, t: Throwable, response: Response?) { closed.complete(Unit) }
                  })

                  try {
                      var lastPoll = SystemClock.elapsedRealtime()
                      var lastBookPoll = 0L
                      while (!closed.isCompleted) {
                          delay(2000)
                          val now = SystemClock.elapsedRealtime()
                          if (now - lastMsg.get() > cfg.wsStaleSeconds * 1000L) break
                          // Socket is up but no candle data for 15 s (quiet market or unexpected format): refresh via REST.
                          if (wantBook && now - lastBookMs > 6_000 && now - lastBookPoll > 4_000) {
                              lastBookPoll = now
                              pollBook(cfg, rest)
                          }
                          if (now - lastCandle.get() > 15_000 && now - lastPoll > 10_000) {
                              lastPoll = now
                              pollRest(cfg, st, rest)
                          }
                      }
                  } finally {
                      if (activeWs === ws) activeWs = null
                      ws.cancel()
                  }
                  return got.get()
              }
          }
          LMW_EOF
          mkdir -p "$(dirname 'app/src/main/kotlin/com/lmw/marketwallpaper/data/OrderBook.kt')"
          cat > 'app/src/main/kotlin/com/lmw/marketwallpaper/data/OrderBook.kt' <<'LMW_EOF'
          package com.lmw.marketwallpaper.data

          import org.json.JSONArray
          import org.json.JSONObject

          data class Level(val price: Double, val size: Double)

          /** Bids best (highest) first, asks best (lowest) first. */
          data class OrderBook(val bids: List<Level>, val asks: List<Level>)

          object BookParser {
              private fun parseLevels(a: JSONArray?, max: Int, descending: Boolean): List<Level> {
                  if (a == null) return emptyList()
                  val out = ArrayList<Level>(a.length())
                  for (i in 0 until a.length()) {
                      val o = a.optJSONObject(i) ?: continue
                      // WebSocket uses "limit_price", REST uses "price".
                      val p = if (o.has("limit_price")) o.optDouble("limit_price", Double.NaN) else o.optDouble("price", Double.NaN)
                      val s = o.optDouble("size", Double.NaN)
                      if (!p.isNaN() && !s.isNaN() && s > 0) out.add(Level(p, s))
                  }
                  out.sortBy { if (descending) -it.price else it.price }
                  return if (out.size > max) out.subList(0, max).toList() else out
              }

              fun fromObject(j: JSONObject, max: Int) =
                  OrderBook(parseLevels(j.optJSONArray("buy"), max, true), parseLevels(j.optJSONArray("sell"), max, false))

              /** Parses a WebSocket `l2_orderbook` message; null for anything else. */
              fun parse(text: String, symbol: String, max: Int): OrderBook? {
                  if (!text.contains("l2_orderbook")) return null
                  val j = try { JSONObject(text) } catch (e: Exception) { return null }
                  if (j.optString("type") != "l2_orderbook") return null
                  if (j.has("symbol") && j.optString("symbol") != symbol) return null
                  val b = fromObject(j, max)
                  return if (b.bids.isEmpty() && b.asks.isEmpty()) null else b
              }
          }
          LMW_EOF
          mkdir -p "$(dirname 'app/src/main/kotlin/com/lmw/marketwallpaper/data/TradeParser.kt')"
          cat > 'app/src/main/kotlin/com/lmw/marketwallpaper/data/TradeParser.kt' <<'LMW_EOF'
          package com.lmw.marketwallpaper.data

          import org.json.JSONObject

          /** Parses Delta `all_trades` WebSocket messages: every executed trade, used to move the forming candle instantly. */
          object TradeParser {
              data class Trade(val price: Double, val tsSec: Long?)

              fun parse(text: String, symbol: String): Trade? {
                  if (!text.contains("all_trades")) return null
                  val j = try { JSONObject(text) } catch (e: Exception) { return null }
                  if (j.optString("type") != "all_trades") return null          // ignores the snapshot and the subscribe ack
                  if (j.has("symbol") && j.optString("symbol") != symbol) return null
                  val p = j.optDouble("price", Double.NaN)
                  if (p.isNaN() || p <= 0.0) return null
                  val ts = j.optLong("timestamp", -1L)
                  return Trade(p, if (ts > 0) LiveParser.toSec(ts) else null)
              }
          }
