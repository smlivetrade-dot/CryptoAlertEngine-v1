                      sb.append(" ")
                      val b = sb.length
                      sb.append("Negative " + String.format(Locale.US, "%.1f%%", r.downPct))
                      sb.setSpan(ForegroundColorSpan(RED), b, sb.length, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE)
