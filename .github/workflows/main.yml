          package com.lmw.marketwallpaper.data

          import okhttp3.HttpUrl.Companion.toHttpUrl
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import org.json.JSONObject
          import java.io.IOException

          class DeltaRest(private val client: OkHttpClient, base: String) {
              private val base = base.trimEnd('/')

              data class CandleResult(val candles: List<Candle>, val serverOffsetMs: Long?)

              /** GET /v2/history/candles - public, no key. Times are epoch seconds. */
              fun candles(symbol: String, resolution: String, startSec: Long, endSec: Long): CandleResult {
                  val url = "$base/v2/history/candles".toHttpUrl().newBuilder()
                      .addQueryParameter("resolution", resolution)
                      .addQueryParameter("symbol", symbol)
                      .addQueryParameter("start", startSec.toString())
                      .addQueryParameter("end", endSec.toString())
                      .build()
                  client.newCall(Request.Builder().url(url).header("Accept", "application/json").build()).execute().use { r ->
                      if (!r.isSuccessful) throw IOException("HTTP ${r.code}")
                      val offset = r.headers.getDate("Date")?.time?.let { it - System.currentTimeMillis() }
                      val j = JSONObject(r.body?.string() ?: throw IOException("empty body"))
                      if (!j.optBoolean("success", true)) throw IOException("API error")
                      val a = j.getJSONArray("result")
                      val out = ArrayList<Candle>(a.length())
                      for (i in 0 until a.length()) {
                          val o = a.getJSONObject(i)
                          out.add(Candle(o.getLong("time"), o.getDouble("open"), o.getDouble("high"), o.getDouble("low"), o.getDouble("close")))
                      }
                      out.sortBy { it.t }
                      return CandleResult(out, offset)
                  }
              }

              /** GET /v2/products - the live instrument list used to validate the symbol setting. */
              fun symbols(): List<String> {
                  val req = Request.Builder().url("$base/v2/products".toHttpUrl()).header("Accept", "application/json").build()
                  client.newCall(req).execute().use { r ->
                      if (!r.isSuccessful) throw IOException("HTTP ${r.code}")
                      val a = JSONObject(r.body?.string() ?: throw IOException("empty body")).getJSONArray("result")
                      val out = sortedSetOf<String>()
                      for (i in 0 until a.length()) {
                          val p = a.getJSONObject(i)
                          if (p.optString("state") == "live" && p.optString("symbol").isNotEmpty()) out.add(p.getString("symbol"))
                      }
                      return out.toList()
                  }
              }
          }
          LMW_EOF
          mkdir -p "$(dirname 'app/src/main/kotlin/com/lmw/marketwallpaper/data/LiveParser.kt')"
          cat > 'app/src/main/kotlin/com/lmw/marketwallpaper/data/LiveParser.kt' <<'LMW_EOF'
          package com.lmw.marketwallpaper.data

          import org.json.JSONObject

          /** Parses Delta Exchange `candlestick_<res>` WebSocket messages. */
          object LiveParser {
              data class Live(val candle: Candle, val serverMs: Long?)

              /** Delta sends microseconds; tolerate ms and s as well. */
              fun toSec(v: Long): Long = when {
                  v >= 100_000_000_000_000L -> v / 1_000_000L
                  v >= 100_000_000_000L -> v / 1000L
                  else -> v
              }

              fun toMs(v: Long): Long = when {
                  v >= 100_000_000_000_000L -> v / 1000L
                  v >= 100_000_000_000L -> v
                  else -> v * 1000L
              }

              fun parse(text: String, channel: String, symbol: String): Live? {
                  val j = try { JSONObject(text) } catch (e: Exception) { return null }
                  if (j.optString("type") != channel) return null
                  if (j.has("symbol") && j.optString("symbol") != symbol) return null
                  val start = j.optLong("candle_start_time", -1L)
                  if (start <= 0) return null
                  val o = j.optDouble("open", Double.NaN)
                  val h = j.optDouble("high", Double.NaN)
                  val l = j.optDouble("low", Double.NaN)
                  val c = j.optDouble("close", Double.NaN)
                  if (o.isNaN() || h.isNaN() || l.isNaN() || c.isNaN()) return null
                  val ts = j.optLong("timestamp", -1L)
                  return Live(Candle(toSec(start), o, h, l, c, true), if (ts > 0) toMs(ts) else null)
              }
          }
          LMW_EOF
