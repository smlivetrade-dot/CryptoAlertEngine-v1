name: Build Crypto Alert Engine V4.1.1

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Restore V4.1.1 source
        shell: bash
        run: |
          python3 - <<'PY2'
          import base64, zipfile, io
          data = base64.b64decode("""""")
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              z.extractall(".")
          PY2
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build and test
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CryptoAlertEngine-V4.1.1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: CryptoAlertEngine-V4.1.1-source
          path: .
          retention-days: 14
