      - name: Verify V4.3.2 source invariants
        shell: bash
        run: |
          set -euo pipefail
          test -f app/build.gradle.kts
          test -f app/src/main/java/com/cryptoalertengine/trading/DeltaTradingApi.kt
          test -f app/src/main/java/com/cryptoalertengine/service/TradingService.kt
          grep -q 'versionName = "4.3.2"' app/build.gradle.kts
          grep -q 'inner class PrivateConnection' app/src/main/java/com/cryptoalertengine/trading/DeltaTradingApi.kt
          grep -q 'this@DeltaTradingApi.signedTimestampSeconds()' app/src/main/java/com/cryptoalertengine/trading/DeltaTradingApi.kt
          grep -q 'wss://socket.india.delta.exchange' app/src/main/java/com/cryptoalertengine/trading/DeltaTradingApi.kt
          grep -q 'productId > 0' app/src/main/java/com/cryptoalertengine/trading/DeltaTradingApi.kt
          grep -q 'reduce_only' app/src/main/java/com/cryptoalertengine/trading/DeltaTradingApi.kt
          grep -q 'signedQuery = if (query.isBlank())' app/src/main/java/com/cryptoalertengine/trading/DeltaTradingApi.kt
          grep -q 'method + timestamp + path + signedQuery + body' app/src/main/java/com/cryptoalertengine/trading/DeltaTradingApi.kt
          grep -q 'position.qty < totalQty' app/src/main/java/com/cryptoalertengine/service/TradingService.kt
          grep -q 'sessionRefreshJob' app/src/main/java/com/cryptoalertengine/service/TradingService.kt
          grep -q 'orderByClientId' app/src/main/java/com/cryptoalertengine/service/TradingService.kt
          grep -q 'AUTO TRADING DISARMED: no new entries' app/src/main/java/com/cryptoalertengine/service/TradingService.kt
          ! grep -q 'ORDER BOOK' app/src/main/java/com/cryptoalertengine/MainActivity.kt
          ! grep -q '"ASK"' app/src/main/java/com/cryptoalertengine/MainActivity.kt
          ! grep -q '"BID"' app/src/main/java/com/cryptoalertengine/MainActivity.kt

          grep -q 'val symbol: String = "ETHUSD"' app/src/main/java/com/cryptoalertengine/data/Models.kt
          grep -q 'val tradingTimeframe: String = "5m"' app/src/main/java/com/cryptoalertengine/data/Models.kt
          grep -q 'val mtf2: String = "15m"' app/src/main/java/com/cryptoalertengine/data/Models.kt
          grep -q 'val mtf3: String = "1h"' app/src/main/java/com/cryptoalertengine/data/Models.kt
          grep -q 'val autoReconnect30m: Boolean = true' app/src/main/java/com/cryptoalertengine/data/Models.kt
          grep -q 'val fastEmaEntryOffset: Double = 0.2' app/src/main/java/com/cryptoalertengine/data/Models.kt
          grep -q 'val slowEmaEntryOffset: Double = 0.2' app/src/main/java/com/cryptoalertengine/data/Models.kt
          grep -q 'val minEmaEntryDistance: Double = 5.0' app/src/main/java/com/cryptoalertengine/data/Models.kt
          grep -q 'val emaFastPeriod: Int = 8' app/src/main/java/com/cryptoalertengine/data/Models.kt
          grep -q 'val emaSlowPeriod: Int = 19' app/src/main/java/com/cryptoalertengine/data/Models.kt
          grep -q 'val atrFilterThreshold: Double = 4.0' app/src/main/java/com/cryptoalertengine/data/Models.kt
          grep -q 'val stEntryOffset: Double = 0.2' app/src/main/java/com/cryptoalertengine/data/Models.kt
          grep -q 'val emaMaxSlDistance: Double = 10.0' app/src/main/java/com/cryptoalertengine/data/Models.kt
          grep -q 'val haltCrossCount: Int = 5' app/src/main/java/com/cryptoalertengine/data/Models.kt
          grep -q 'val priceUpdate10mEnabled: Boolean = true' app/src/main/java/com/cryptoalertengine/data/Models.kt
          grep -q 'val widgetLivePriceEnabled: Boolean = false' app/src/main/java/com/cryptoalertengine/data/Models.kt
          grep -q 'EMA COMBINED PROTECTION ACTIVE' app/src/main/java/com/cryptoalertengine/service/TradingService.kt
          grep -q 'weightedAverageEntry' app/src/main/java/com/cryptoalertengine/engine/TradingRules.kt
          grep -q 'CLOSE SELECTED POSITION' app/src/main/java/com/cryptoalertengine/MainActivity.kt
          grep -q 'CANCEL SELECTED' app/src/main/java/com/cryptoalertengine/MainActivity.kt
          grep -q 'CANCEL ALL' app/src/main/java/com/cryptoalertengine/MainActivity.kt

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests and build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CryptoAlertEngine-V4.3.2-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
