      - name: Verify embedded project checksum and ZIP integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, zipfile
          from pathlib import Path
          p=Path('/tmp/project.zip')
          expected='7d60e22c53cacaa2df65b440c9b01b3721a75d658f24db9a535963b3a32fa581'
          if not p.is_file(): raise SystemExit('Missing decoded /tmp/project.zip')
          actual=hashlib.sha256(p.read_bytes()).hexdigest()
          if actual != expected: raise SystemExit(f'Embedded project SHA-256 mismatch: {actual} != {expected}')
          with zipfile.ZipFile(p) as z:
              bad=z.testzip()
              if bad: raise SystemExit(f'Corrupt ZIP entry: {bad}')
          print('Embedded project checksum and ZIP integrity passed.')
          PY

      - name: Verify V4.3.2 source invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          checks = {
              'app/build.gradle.kts': ['versionName = "4.3.2"'],
              'gradle.properties': ['kotlin.compiler.execution.strategy=in-process', 'org.gradle.workers.max=2'],
              'app/src/main/java/com/cryptoalertengine/trading/DeltaTradingApi.kt': [
                  'inner class PrivateConnection',
                  'this@DeltaTradingApi.signedTimestampSeconds()',
                  'wss://socket.india.delta.exchange',
                  'productId > 0',
                  'reduce_only',
                  'internal fun buildSignatureMessage',
                  'return method + timestamp + path + signedQuery + body',
                  'val wirePath = httpUrl.encodedPath',
                  'val wireQuery = httpUrl.encodedQuery ?: ""',
                  "(b.toInt() and 0xff).toString(16).padStart(2, '0')",
                  'product_ids=',
                  'states=open,pending',
                  'request("DELETE", "/v2/orders", body = body)',
                  'request("DELETE", "/v2/orders/all", body = body)',
                  'addProperty("product_id", productId)',
                  'ensureClockFresh',
                  'fun enableHeartbeat()',
                  'fun disableHeartbeat()',
                  'productTickSize',
                  'normalizePrice',
              ],
              'app/src/main/java/com/cryptoalertengine/data/SecureCredentialStore.kt': [
                  'putString("api_secret", encrypt(apiSecret.trim()))',
                  'let(::decrypt)?.trim()',
              ],
              'app/src/main/java/com/cryptoalertengine/MainActivity.kt': [
                  'secure.save(key.trim(), secret.trim())',
                  'CLOSE SELECTED POSITION',
                  'CANCEL SELECTED',
                  'CANCEL ALL',
              ],
              'app/src/main/java/com/cryptoalertengine/service/TradingService.kt': [
                  'position.qty < totalQty',
                  'sessionRefreshJob',
                  'authenticationBlocked',
                  'AUTHENTICATION BLOCKED',
                  'isAuthenticationError',
                  'a.openOrders(productId)',
                  'a.cancelOrder(productId, id)',
                  'a.cancelAllForProduct(productId)',
                  'exchange state is stale/unknown',
                  'orderByClientId',
                  'AUTO TRADING DISARMED: no new entries',
                  'EMA COMBINED PROTECTION ACTIVE',
                  'privateConnectionGeneration += 1L',
                  'enableHeartbeat()',
                  'PRIVATE WEBSOCKET HEARTBEAT STALE — reconnecting',
                  'connectionMutex',
                  'AUTO TRADING ARMED — REST entries/exits active; private WebSocket recovering (reconciliation backstop)',
                  'startContinuousMarketBridge()',
                  'LiveStateStore.marketEvents.collect',
                  'processTradingEvent',
                  'ENTRY QUEUED: exchange position=',
                  'ST EXIT PARTIAL FILL:',
                  'COMBINED EMA PROTECTION PARTIAL FILL:',
                  'reduceOnly = true',
                  'REST entries/exits active; private WebSocket recovering',
                  'TRADING EVENT CONSUMED:',
                  'AUTO ENTRY EVENT:',
                  'enqueuePendingMarketEvent',
                  'queuedReplay',
                  'Trading events are durable until the exchange state is ready',
                  'lastAtr = market.closedSnapshot.atr ?: market.snapshot.atr ?: lastAtr',
                  'lastExchangePosition',
                  'clearManagedStateAfterExchangeFlat',
                  'EXCHANGE POSITION FLAT — bot protection/strategy ledger cleared',
                  'v2/user_trades',
                  'isBotOrder',
                  'validateExistingOrder',
                  'order_not_found',
                  'pending strategy entry',
                  'LegState.PENDING_ENTRY',
              ],
              'app/src/main/java/com/cryptoalertengine/data/Models.kt': [
                  'val symbol: String = "ETHUSD"',
                  'val tradingTimeframe: String = "5m"',
                  'val mtf2: String = "15m"',
                  'val mtf3: String = "1h"',
                  'val autoReconnect30m: Boolean = true',
                  'val fastEmaEntryOffset: Double = 0.2',
                  'val slowEmaEntryOffset: Double = 0.2',
                  'val minEmaEntryDistance: Double = 5.0',
                  'val emaFastPeriod: Int = 8',
                  'val emaSlowPeriod: Int = 19',
                  'val atrFilterThreshold: Double = 4.0',
                  'val stEntryOffset: Double = 0.2',
                  'val emaMaxSlDistance: Double = 10.0',
                  'val haltCrossCount: Int = 5',
                  'val priceUpdate10mEnabled: Boolean = true',
                  'val widgetLivePriceEnabled: Boolean = false',
                  'val limitOrderBuffer: Double = 0.2',
                  'val emaTpMarketEnabled: Boolean = false',
              ],
              'app/src/main/java/com/cryptoalertengine/engine/TradingRules.kt': ['weightedAverageEntry'],
              'app/src/main/java/com/cryptoalertengine/data/LiveState.kt': [
                  'Channel<AlertEvent>(Channel.UNLIMITED)',
                  'fun emitMarketEvent(event: AlertEvent)',
                  'marketEventChannel.trySend(event)',
              ],
              'app/src/main/java/com/cryptoalertengine/engine/AlertEngine.kt': [
                  'val notify = notificationEnabled && alertedThisBar.isEmpty()',
                  'notificationEnabled: Boolean = true',
                  'notificationEligible = notify',
                  'if (touch("fast", s.emaFast))',
                  'if (touch("slow", s.emaSlow))',
                  'if (confirmedTrend == Trend.BUY)',
                  'if (confirmedTrend == Trend.SELL)',
              ],
          }
          for rel, needles in checks.items():
              p = Path(rel)
              if not p.is_file():
                  raise SystemExit(f'Missing required source file: {rel}')
              s = p.read_text(encoding='utf-8')
              for needle in needles:
                  if needle not in s:
                      raise SystemExit(f'Missing invariant: {needle!r} in {rel}')
          main = Path('app/src/main/java/com/cryptoalertengine/MainActivity.kt').read_text(encoding='utf-8')
          for forbidden in ('ORDER BOOK', '"ASK"', '"BID"'):
              if forbidden in main:
                  raise SystemExit(f'Forbidden order-book UI marker found: {forbidden!r}')
          alert = Path('app/src/main/java/com/cryptoalertengine/engine/AlertEngine.kt').read_text(encoding='utf-8')
          if 'config.atrFilterEnabled' in alert and 'atrFilterThreshold' in alert:
              raise SystemExit('ATR entry filter leaked into AlertEngine')
          trading = Path('app/src/main/java/com/cryptoalertengine/service/TradingService.kt').read_text(encoding='utf-8')
          if 'privateConnectionGeneration' not in trading:
              raise SystemExit('Missing private WebSocket generation guard')
          if 'DROP_OLDEST' in Path('app/src/main/java/com/cryptoalertengine/data/LiveState.kt').read_text(encoding='utf-8'):
              raise SystemExit('Trading market-event stream must not use DROP_OLDEST')
          if 'order_not_found' not in trading:
              raise SystemExit('Missing Delta order_not_found handling')
          if 'validateExistingOrder' not in trading:
              raise SystemExit('Missing existing-order identity validation')
          for marker in ('lastPrice - buffer', 'lastPrice + buffer', 'passivePrice = if (side == "sell") price + buffer else price - buffer', 'market = config.emaTpMarketEnabled', 'old.tpMarket == config.emaTpMarketEnabled'):
              if marker not in trading:
                  raise SystemExit(f'Missing passive-limit / TP-mode invariant: {marker}')
          api = Path('app/src/main/java/com/cryptoalertengine/trading/DeltaTradingApi.kt').read_text(encoding='utf-8')
          if 'addProperty("post_only", true)' not in api:
              raise SystemExit('Limit orders must be post-only to avoid accidental taker execution')
          if 'if (market) "market_order" else "limit_order"' not in api:
              raise SystemExit('Missing selectable TP market/limit order type')
          if 'EMA Fast + Slow share one SL/TP pair' not in Path('app/src/main/java/com/cryptoalertengine/MainActivity.kt').read_text(encoding='utf-8'):
              raise SystemExit('Missing EMA combined protection settings explanation')
          trading = Path('app/src/main/java/com/cryptoalertengine/service/TradingService.kt').read_text(encoding='utf-8')
          if 'System.currentTimeMillis() - event.timestamp > 5_000L' in trading:
              raise SystemExit('Trading event path still has a 5-second expiry')
          if 'while (pendingMarketEvents.size > 128)' in trading:
              raise SystemExit('Trading event queue still drops old events at 128 entries')
          for marker in ('if (touch("fast", s.emaFast))', 'if (touch("slow", s.emaSlow))', 'if (confirmedTrend == Trend.BUY)', 'if (confirmedTrend == Trend.SELL)'):
              if marker not in alert:
                  raise SystemExit(f'Missing notification-independent trading event marker: {marker}')
          print('Continuous event/ATR/notification invariants passed.')
          if not Path('app/src/test/java/com/cryptoalertengine/trading/DeltaTradingApiSignatureTest.kt').is_file():
              raise SystemExit('Missing DeltaTradingApiSignatureTest.kt')
          if 'atrThresholdDoesNotBlockAlerts' not in Path('app/src/test/java/com/cryptoalertengine/engine/AlertEngineTest.kt').read_text(encoding='utf-8'):
              raise SystemExit('Missing ATR alert regression test')
          print('All V4.3.2 source invariants passed.')
          PY
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Run unit tests and build debug APK
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version
          gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Upload test and build reports on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: CryptoAlertEngine-V4.3.2-continuous-event-build-reports
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: warn

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: CryptoAlertEngine-V4.3.2-continuous-event-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
