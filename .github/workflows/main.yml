      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Run unit tests and build debug APK
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version
          gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Upload test and build reports on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: CryptoAlertEngine-V4.3.2-build-reports
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: warn

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: CryptoAlertEngine-V4.3.2-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
