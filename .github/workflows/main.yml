      - name: Verify embedded project checksum and ZIP integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, zipfile
          from pathlib import Path
          p=Path('/tmp/project.zip')
          expected='f0638cef4269470e95581c2526985fcb991a1227ef4d6b3b5e49db420d98560e'
          if not p.is_file(): raise SystemExit('Missing decoded /tmp/project.zip')
          actual=hashlib.sha256(p.read_bytes()).hexdigest()
          if actual != expected: raise SystemExit(f'Embedded project SHA-256 mismatch: {actual} != {expected}')
          with zipfile.ZipFile(p) as z:
              bad=z.testzip()
              if bad: raise SystemExit(f'Corrupt ZIP entry: {bad}')
          print('Embedded project checksum and ZIP integrity passed.')
          PY

      - name: Verify V4.3.2 source invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          checks = {
              'app/build.gradle.kts': ['versionName = "4.3.2"'],
              'app/src/main/java/com/cryptoalertengine/trading/DeltaTradingApi.kt': [
                  'inner class PrivateConnection',
                  'this@DeltaTradingApi.signedTimestampSeconds()',
                  'wss://socket.india.delta.exchange',
                  'productId > 0',
                  'reduce_only',
                  'internal fun buildSignatureMessage',
                  'return method + timestamp + path + signedQuery + body',
                  'val wirePath = httpUrl.encodedPath',
                  'val wireQuery = httpUrl.encodedQuery ?: ""',
                  "(b.toInt() and 0xff).toString(16).padStart(2, '0')",
                  'product_ids=',
                  'states=open,pending',
                  'request("DELETE", "/v2/orders", body = body)',
                  'request("DELETE", "/v2/orders/all", body = body)',
                  'addProperty("product_id", productId)',
                  'ensureClockFresh',
              ],
              'app/src/main/java/com/cryptoalertengine/data/SecureCredentialStore.kt': [
                  'putString("api_secret", encrypt(apiSecret.trim()))',
                  'let(::decrypt)?.trim()',
              ],
              'app/src/main/java/com/cryptoalertengine/MainActivity.kt': [
                  'secure.save(key.trim(), secret.trim())',
                  'CLOSE SELECTED POSITION',
                  'CANCEL SELECTED',
                  'CANCEL ALL',
              ],
              'app/src/main/java/com/cryptoalertengine/service/TradingService.kt': [
                  'position.qty < totalQty',
                  'sessionRefreshJob',
                  'authenticationBlocked',
                  'AUTHENTICATION BLOCKED',
                  'isAuthenticationError',
                  'a.openOrders(productId)',
                  'a.cancelOrder(productId, id)',
                  'a.cancelAllForProduct(productId)',
                  'orderByClientId',
                  'AUTO TRADING DISARMED: no new entries',
                  'EMA COMBINED PROTECTION ACTIVE',
                  'val generation = System.currentTimeMillis()',
              ],
              'app/src/main/java/com/cryptoalertengine/data/Models.kt': [
                  'val symbol: String = "ETHUSD"',
                  'val tradingTimeframe: String = "5m"',
                  'val mtf2: String = "15m"',
                  'val mtf3: String = "1h"',
                  'val autoReconnect30m: Boolean = true',
                  'val fastEmaEntryOffset: Double = 0.2',
                  'val slowEmaEntryOffset: Double = 0.2',
                  'val minEmaEntryDistance: Double = 5.0',
                  'val emaFastPeriod: Int = 8',
                  'val emaSlowPeriod: Int = 19',
                  'val atrFilterThreshold: Double = 4.0',
                  'val stEntryOffset: Double = 0.2',
                  'val emaMaxSlDistance: Double = 10.0',
                  'val haltCrossCount: Int = 5',
                  'val priceUpdate10mEnabled: Boolean = true',
                  'val widgetLivePriceEnabled: Boolean = false',
              ],
              'app/src/main/java/com/cryptoalertengine/engine/TradingRules.kt': ['weightedAverageEntry'],
          }
          for rel, needles in checks.items():
              p = Path(rel)
              if not p.is_file():
                  raise SystemExit(f'Missing required source file: {rel}')
              s = p.read_text(encoding='utf-8')
              for needle in needles:
                  if needle not in s:
                      raise SystemExit(f'Missing invariant: {needle!r} in {rel}')
          main = Path('app/src/main/java/com/cryptoalertengine/MainActivity.kt').read_text(encoding='utf-8')
          for forbidden in ('ORDER BOOK', '"ASK"', '"BID"'):
              if forbidden in main:
                  raise SystemExit(f'Forbidden order-book UI marker found: {forbidden!r}')
          alert = Path('app/src/main/java/com/cryptoalertengine/engine/AlertEngine.kt').read_text(encoding='utf-8')
          if 'config.atrFilterEnabled' in alert and 'atrFilterThreshold' in alert:
              raise SystemExit('ATR entry filter leaked into AlertEngine')
          if not Path('app/src/test/java/com/cryptoalertengine/trading/DeltaTradingApiSignatureTest.kt').is_file():
              raise SystemExit('Missing DeltaTradingApiSignatureTest.kt')
          if 'atrThresholdDoesNotBlockAlerts' not in Path('app/src/test/java/com/cryptoalertengine/engine/AlertEngineTest.kt').read_text(encoding='utf-8'):
              raise SystemExit('Missing ATR alert regression test')
          print('All V4.3.2 source invariants passed.')
