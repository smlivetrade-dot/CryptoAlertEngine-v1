          class SettingsActivity : Activity() {
              private var scope: CoroutineScope? = null
              private var symbolsLoaded = false

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val cfg = ConfigStore.current
                  val s = CoroutineScope(SupervisorJob() + Dispatchers.Main)
                  scope = s

                  val col = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(16), dp(16), dp(16), dp(24))
                  }
                  val root = ScrollView(this).apply {
                      setBackgroundColor(Color.parseColor("#0B0E11")); fitsSystemWindows = true; addView(col)
                  }
                  fun label(t: String) = col.addView(TextView(this).apply { text = t; setTextColor(Color.parseColor("#787B86")); setPadding(0, dp(14), 0, 0) })
                  fun spinner(opts: List<String>, sel: String): Spinner {
                      val sp = Spinner(this)
                      sp.adapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, ArrayList(opts))
                      sp.setSelection(maxOf(0, opts.indexOf(sel)))
                      col.addView(sp); return sp
                  }
                  fun hex(v: String): EditText {
                      val e = EditText(this).apply { setText(v); setTextColor(Color.WHITE); setSingleLine() }
                      col.addView(e); return e
                  }
                  fun check(t: String, on: Boolean): CheckBox {
                      val c = CheckBox(this).apply { text = t; isChecked = on; setTextColor(Color.WHITE) }
                      col.addView(c); return c
                  }

                  label("Symbol")
                  val symbolSp = spinner(listOf(cfg.symbol), cfg.symbol)
                  val symbolNote = TextView(this).apply { setTextColor(Color.parseColor("#787B86")); textSize = 11f }
                  col.addView(symbolNote)
                  label("Chart type"); val typeSp = spinner(cfg.chartTypeOptions, cfg.chartType)
                  label("Candle timeframe"); val tfSp = spinner(cfg.timeframeOptions, cfg.candleTimeframe)
                  label("Display duration"); val durSp = spinner(cfg.durationOptions, cfg.displayDuration)
                  label("Background colour (#RRGGBB)"); val bgE = hex(cfg.backgroundColor)
                  label("Bullish candle colour"); val upE = hex(cfg.bullishColor)
                  label("Bearish candle colour"); val downE = hex(cfg.bearishColor)
                  val gridC = check("Show chart grid", cfg.showGrid)
                  val priceC = check("Show price scale", cfg.showPriceScale)
                  val timeC = check("Show time scale", cfg.showTimeScale)
                  val wallSw = Switch(this).apply { text = "Live wallpaper enabled"; isChecked = cfg.wallpaperEnabled; setTextColor(Color.WHITE); setPadding(0, dp(14), 0, 0) }
                  col.addView(wallSw)

                  col.addView(Button(this).apply {
                      text = "Set as live wallpaper (home + lock screen)"
                      setOnClickListener { openWallpaperPicker() }
                  })
                  col.addView(Button(this).apply {
                      text = "Save"
                      setOnClickListener {
                          fun ok(h: String) = try { Color.parseColor(h); true } catch (e: Exception) { false }
                          if (!ok(bgE.text.toString()) || !ok(upE.text.toString()) || !ok(downE.text.toString())) {
                              Toast.makeText(this@SettingsActivity, "Colours must look like #RRGGBB", Toast.LENGTH_LONG).show(); return@setOnClickListener
                          }
                          val sym = symbolSp.selectedItem as String
                          ConfigStore.update {
                              it.symbol = sym
                              it.chartType = typeSp.selectedItem as String
                              it.candleTimeframe = tfSp.selectedItem as String
                              it.displayDuration = durSp.selectedItem as String
                              it.backgroundColor = bgE.text.toString().trim()
                              it.bullishColor = upE.text.toString().trim()
                              it.bearishColor = downE.text.toString().trim()
                              it.showGrid = gridC.isChecked
                              it.showPriceScale = priceC.isChecked
                              it.showTimeScale = timeC.isChecked
                              it.wallpaperEnabled = wallSw.isChecked
                          }
                          Toast.makeText(this@SettingsActivity, "Saved", Toast.LENGTH_SHORT).show()
                          finish()
                      }
                  })
                  setContentView(root)

                  // Validate/populate the symbol list from Delta's public instrument list.
                  s.launch {
                      val list = withContext(Dispatchers.IO) {
                          try { DeltaRest(Http.client, cfg.restBaseUrl).symbols() } catch (e: Exception) { null }
                      }
                      val opts = (list ?: (cfg.fallbackSymbols + cfg.symbol)).distinct().sorted()
                      @Suppress("UNCHECKED_CAST")
                      val ad = symbolSp.adapter as ArrayAdapter<String>
                      ad.clear(); ad.addAll(opts); ad.notifyDataSetChanged()
                      symbolSp.setSelection(maxOf(0, opts.indexOf(cfg.symbol)))
                      symbolsLoaded = list != null
                      symbolNote.text = if (list != null) "${opts.size} live instruments from Delta Exchange" else "Could not load the instrument list - showing fallback symbols"
                  }
              }

              private fun openWallpaperPicker() {
                  try {
                      startActivity(Intent(WallpaperManager.ACTION_CHANGE_LIVE_WALLPAPER).putExtra(
                          WallpaperManager.EXTRA_LIVE_WALLPAPER_COMPONENT, ComponentName(this, MarketWallpaperService::class.java)))
                  } catch (e: ActivityNotFoundException) {
                      try { startActivity(Intent(WallpaperManager.ACTION_LIVE_WALLPAPER_CHOOSER)) }
                      catch (e2: ActivityNotFoundException) { Toast.makeText(this, "Live wallpapers are not supported on this device", Toast.LENGTH_LONG).show() }
                  }
              }

              override fun onDestroy() {
                  scope?.cancel()
                  super.onDestroy()
              }
          }
