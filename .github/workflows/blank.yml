name: Build LevelFit Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare LevelFit web app
        shell: bash
        run: | set -euo pipefail HTML_FILE="LevelFit_Hunter_Ascension_V4_4.html" 
          if [ ! -f "$HTML_FILE" ]; then
            echo "ERROR: $HTML_FILE was not found in the repository root."
            echo "Upload the LevelFit HTML file to the root, or edit HTML_FILE here."
            exit 1
          fi

          mkdir -p www
          cp "$HTML_FILE" www/index.html

          cat > package.json <<'EOF'
          {
            "name": "levelfit-android",
            "version": "1.0.0",
            "private": true,
            "description": "LevelFit offline fitness RPG Android app"
          }
          EOF

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.levelfit.hunterascension",
            "appName": "LevelFit",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

      - name: Install Capacitor
        run: | npm install @capacitor/core@8.6.2 @capacitor/android@8.6.2 npm install --save-dev @capacitor/cli@8.6.2 
      - name: Create Android project
        run: npx cap add android

      - name: Copy web app into Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: | chmod +x gradlew ./gradlew assembleDebug 
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LevelFit-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
